<style>
  :root{
    --primary:#440808; --primary-hover:#5A1010;
    --accent:#C9A66B; --accent-soft:#F5ECD9;
    --surface:#FFFFFF; --surface-2:#EFE9DF;
    --text:#1A1410; --text-2:#5A4D42; --text-3:#8A7B6E;
    --danger:#A02828; --success:#2F6B3F;
    --dark:#1A1410; --dark-2:#2A2320;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{height:100%;height:100dvh;background:var(--dark);overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#F5F1EB; touch-action:pan-y;
  }
  #app{position:relative; width:100%; height:100%; display:flex; flex-direction:column;}
  #statusScreen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:30px; background:var(--dark); z-index:50; gap:16px;
  }
  #statusScreen .icon{font-size:40px;color:var(--accent);}
  #statusScreen h2{font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:#F5F1EB; letter-spacing:-0.01em;}
  #statusScreen p{font-size:14px; color:#A99F94; max-width:320px; line-height:1.6;}
  #statusScreen button{
    margin-top:12px; padding:12px 28px; border-radius:4px; border:none;
    background:var(--accent); color:var(--dark); font-weight:700;
    font-family:inherit; font-size:14px; letter-spacing:0.01em; cursor:pointer;
  }
  .load-gif{display:block;margin:0 auto 4px;animation:gentlePulse 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 16px rgba(68,8,8,.14));}
  @keyframes gentlePulse{0%,100%{transform:scale(1);opacity:.95;}50%{transform:scale(1.06);opacity:1;}}
  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding:18px 20px;
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg, rgba(26,20,16,.72), transparent);
  }
  header .brand{font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:#F5F1EB; letter-spacing:-0.01em;}
  header .brand small{display:block; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:400; opacity:.75; letter-spacing:0.06em; text-transform:uppercase; margin-top:2px;}
  header a.nav-link{color:#F5F1EB; text-decoration:none; font-size:12px; background:rgba(245,241,235,.14); padding:8px 14px; border-radius:4px; letter-spacing:0.01em; border:1px solid rgba(245,241,235,.14);}
  #cameraWrap{position:relative; flex:1; background:var(--dark); overflow:hidden;}
  #liveVideo,#recordedVideo{width:100%; height:100%; object-fit:cover; display:block;}
  #liveVideo.mirrored{transform:scaleX(-1);}
  #photoCanvasPreview{width:100%; height:100%; object-fit:cover; display:none;}
  #recordedVideo{display:none;}
  .rec-badge{position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:15; background:rgba(160,40,40,.92); padding:6px 14px; border-radius:20px; font-size:13px; font-family:'JetBrains Mono',monospace; font-weight:500; display:none; align-items:center; gap:6px;}
  .rec-badge .dot{width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}
  #voiceWrap{
    display:none; flex:1; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; min-height:0; overflow:hidden;
    padding:calc(var(--hdr-h, 76px) + 8px) 20px calc(var(--ovl-h, 270px) + 8px);
    background:radial-gradient(circle at center, var(--dark-2), var(--dark));
  }
  .vn-orb{width:150px; height:150px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#A8874E); display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--dark); box-shadow:0 0 0 8px rgba(201,166,107,.15);}
  .vn-orb.recording{animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(160,40,40,.4);}70%{box-shadow:0 0 0 26px rgba(160,40,40,0);}100%{box-shadow:0 0 0 0 rgba(160,40,40,0);}}
  #vnTimer{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:500; letter-spacing:0.04em; color:#F5F1EB;}
  #vnHint{font-size:13px; color:#A99F94; text-align:center; line-height:1.55; max-width:320px; margin:0;}
  #voiceWrap.has-player .vn-orb{display:none;}
  #vnVideoPlayer{flex:1 1 0; min-height:0; width:auto; max-width:min(88%, 440px); object-fit:contain; align-self:center; background:#000;}
  #vnPlayer{flex:none; max-width:min(88%, 360px);}
  @media (max-height:720px){ .vn-orb{width:104px; height:104px; font-size:34px;} #voiceWrap{gap:12px;} }
  #vnPlayer{width:85%; display:none;}
  #bottomOverlay{position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; flex-direction:column;}
  #filmstrip{display:none; gap:8px; padding:12px 16px; overflow-x:auto; background:rgba(26,20,16,.55);}
  .shot-thumb{position:relative; flex:0 0 auto; width:56px; height:56px; border-radius:2px; overflow:hidden; border:1px solid rgba(245,241,235,.3);}
  .shot-thumb img{width:100%; height:100%; object-fit:cover;}
  .shot-thumb .remove-shot{position:absolute; top:-2px; right:-2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;}
  .shot-counter{align-self:center; font-size:12px; color:#F5F1EB; font-family:'JetBrains Mono',monospace; white-space:nowrap; padding:0 6px;}
  #controls{padding:16px 20px max(24px, env(safe-area-inset-bottom)); background:linear-gradient(0deg, rgba(26,20,16,.88) 30%, transparent);}
  .mode-switch{display:flex; justify-content:center; gap:26px; margin-bottom:18px;}
  .mode-switch button{background:none; border:none; color:rgba(245,241,235,.5); font-family:inherit; font-size:12px; font-weight:600; letter-spacing:0.08em; padding:6px 4px; border-bottom:2px solid transparent; cursor:pointer;}
  .mode-switch button.active{color:#F5F1EB; border-color:var(--accent);}
  .capture-row{display:flex; align-items:center; justify-content:center; gap:36px;}
  .side-btn{width:44px; height:44px; border-radius:50%; background:rgba(245,241,235,.15); border:1px solid rgba(245,241,235,.15); color:#F5F1EB; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #shutterBtn{width:74px; height:74px; border-radius:50%; background:#F5F1EB; border:5px solid rgba(245,241,235,.4); cursor:pointer; transition:transform .1s;}
  #shutterBtn:active{transform:scale(.96);}
  #shutterBtn.video-mode{background:var(--danger);}
  #shutterBtn.recording{border-radius:4px; width:34px; height:34px;}
  #shutterBtn:disabled{opacity:.4;}
  .finish-row{display:none; gap:14px; justify-content:center; align-items:center; margin-top:16px;}
  .finish-row button{padding:14px 26px; border-radius:4px; border:none; font-family:inherit; font-weight:700; font-size:14px; letter-spacing:0.01em; cursor:pointer;}
  #finishBtn{background:var(--accent); color:#ffffff;}
  .vn-controls{display:none; gap:16px; justify-content:center; align-items:center;}
  #vnRecordBtn{background:var(--danger); color:#fff; width:64px; height:64px; border-radius:50%; font-size:22px; padding:0; border:none; cursor:pointer;}
  #vnRedoBtn,#vnPlayBtn{background:rgba(245,241,235,.15); color:#F5F1EB; padding:14px 22px; border-radius:4px; border:1px solid rgba(245,241,235,.15); font-family:inherit; font-weight:600; font-size:13px; cursor:pointer;}
  #vnSendBtn{background:var(--accent); color:#ffffff; padding:14px 22px; border-radius:4px; border:none; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;}
  .review-row{display:none; gap:14px; justify-content:center; align-items:center;}
  .review-row button{padding:14px 26px; border-radius:4px; border:none; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;}
  #retakeBtn{background:rgba(245,241,235,.15); color:#F5F1EB; border:1px solid rgba(245,241,235,.15);}
  #sendMediaBtn{background:var(--accent); color:#ffffff;}
  .name-field{max-width:400px; margin:0 auto 14px;}
  .name-field input{width:100%; padding:13px 14px; border-radius:4px; border:1.5px solid rgba(245,241,235,.22); background:rgba(245,241,235,.06); color:#F5F1EB; font-family:inherit; font-size:16px; transition:border-color .15s,box-shadow .15s;}
  .name-field input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,166,107,.22);}
  .name-field input::placeholder{color:rgba(245,241,235,.45);}
  .toast{position:absolute; bottom:110px; left:50%; transform:translateX(-50%); z-index:60; background:var(--dark); padding:12px 20px; border-radius:4px; font-size:13px; max-width:85%; text-align:center; display:none; border:1px solid rgba(245,241,235,.12); color:#F5F1EB;}
  .toast.success{background:var(--success);} .toast.error{background:var(--danger);}
  .result-overlay{position:absolute; inset:0; z-index:90; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(26,20,16,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
  .result-overlay.show{display:flex; animation:fadeInBg .2s ease-out;}
  @keyframes fadeInBg{from{opacity:0;}to{opacity:1;}}
  .result-card{width:100%; max-width:360px; background:#F5F1EB; color:var(--text); border-radius:8px; padding:32px 28px 24px; text-align:center; box-shadow:0 16px 48px rgba(68,8,8,.24); animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2); border:1px solid #E5DDD1;}
  @keyframes cardIn{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
  .result-icon{width:68px; height:68px; margin:0 auto 16px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-soft);}
  .result-icon svg{width:34px; height:34px; stroke:var(--accent); fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
  .result-card.success .result-icon{background:#E4F0E6;} .result-card.success .result-icon svg{stroke:var(--success);}
  .result-card.success .result-icon path{stroke-dasharray:40; stroke-dashoffset:40; animation:drawCheck .5s .15s ease-out forwards;}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}
  .result-card.error .result-icon{background:#F7E4E2;} .result-card.error .result-icon svg{stroke:var(--danger);}
  .result-card.warn .result-icon{background:var(--accent-soft);} .result-card.warn .result-icon svg{stroke:#8A6A1A;}
  .result-card h3{font-family:'Fraunces',serif; font-size:20px; font-weight:700; margin-bottom:10px; color:var(--text); letter-spacing:-0.01em;}
  .result-card p{font-size:14px; line-height:1.6; color:var(--text-2); white-space:pre-line; margin-bottom:22px;}
  .result-card button{display:block; width:100%; padding:13px; border-radius:4px; border:none; font-family:inherit; font-size:14px; font-weight:700; letter-spacing:0.01em; cursor:pointer;}
  .up-btn{position:relative; visibility:hidden; padding:0; flex:none;}
  .up-btn.show{visibility:visible;}
  .up-btn svg.ring{position:absolute; inset:-1px; width:46px; height:46px; transform:rotate(-90deg); pointer-events:none;}
  .up-btn .ring-bg{fill:none; stroke:rgba(245,241,235,.18); stroke-width:3;}
  .up-btn .ring-fg{fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; stroke-dasharray:125.66; stroke-dashoffset:125.66; transition:stroke-dashoffset .25s;}
  .up-btn.warn .ring-fg{stroke:#D8A24A; stroke-dashoffset:0;}
  .up-btn .ico{width:18px; height:18px; stroke:#F5F1EB; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; position:relative;}
  .up-btn .badge{position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--accent); color:#fff; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; display:flex; align-items:center; justify-content:center; border:2px solid #1A1410; box-sizing:content-box;}
  .up-btn.warn .badge{background:#D8A24A; color:#1A1410;}
  /* Preview slot di capture row */
  .side-slot{position:relative; width:44px; height:44px; flex:none;}
  .side-slot .side-btn{position:absolute; inset:0; margin:0;}
  #previewBtn{display:none; align-items:center; justify-content:center; background:var(--primary); border:1px solid var(--primary); color:#fff;}
  #previewBtn.show{display:flex;}
  #previewBtn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
  #previewBtn:disabled{opacity:.6;}

  /* Preview modal */
  .preview-card{width:100%; max-width:420px; background:#F5F1EB; color:var(--text); border-radius:8px; padding:22px 20px 20px; position:relative; box-shadow:0 16px 48px rgba(68,8,8,.24); border:1px solid #E5DDD1; max-height:86vh; display:flex; flex-direction:column;}
  .preview-card h3{margin:0 40px 6px 0; font-family:'Fraunces',serif; font-size:18px; color:var(--text);}
  .preview-card .pv-sub{font-size:12px; color:var(--text-3); margin-bottom:12px;}
  .preview-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px; overflow-y:auto; max-height:46vh; margin:0 -4px; padding:0 4px;}
  .preview-grid .pv-item{position:relative; aspect-ratio:3/4; border-radius:4px; overflow:hidden; border:1px solid #E5DDD1; background:#EFE9DF;}
  .preview-grid .pv-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .preview-loading{text-align:center; color:#8A7B6E; font-size:13px; padding:20px; grid-column:1/-1;}
  #previewSendBtn{margin-top:14px; background:var(--primary); color:#fff; padding:13px; border-radius:4px; border:none; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;}
  #previewSendBtn:hover{background:var(--primary-hover);}
  #previewSendBtn:disabled{opacity:.6; cursor:not-allowed;}
  #previewCloseBtn{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%; background:transparent; border:none; color:var(--text-3); font-size:16px; cursor:pointer;}
  #previewCloseBtn:hover{background:rgba(68,8,8,.08); color:var(--primary);}
  .side-spacer{width:44px; flex:none;}
  .queue-card{max-width:380px; padding:26px 22px 20px; text-align:left; position:relative;}
  .queue-card h3{margin:0 40px 4px 0; text-align:left;}
  .queue-card .q-sub{margin:0 0 14px; font-size:13px; text-align:left; white-space:normal; color:var(--text-2); line-height:1.5;}
  .result-card .q-close{position:absolute; top:12px; right:12px; width:34px; height:34px; padding:0; border-radius:50%; background:transparent; color:var(--text-3); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .result-card .q-close:hover{background:rgba(68,8,8,.08); color:var(--primary);}
  .q-list{max-height:min(52vh,360px); overflow-y:auto; margin:0 -6px; padding:0 6px; -webkit-overflow-scrolling:touch;}
  .q-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid #E5DDD1;}
  .q-row:first-child{border-top:none;}
  .q-thumb{width:44px; height:44px; flex:none; border-radius:2px; background:#EFE9DF; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .q-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .q-thumb svg{width:20px; height:20px; stroke:var(--primary); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .q-main{flex:1; min-width:0;}
  .q-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .q-top b{font-size:13px; font-weight:600; color:var(--text);}
  .q-state{font-size:11px; color:var(--text-3);}
  .q-bar{height:4px; border-radius:2px; background:#E5DDD1; overflow:hidden; margin:7px 0 5px;}
  .q-bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s;}
  .q-bytes{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-2);}
  .q-check{width:24px; height:24px; flex:none; border-radius:50%; background:var(--success); display:none; align-items:center; justify-content:center;}
  .q-check svg{width:14px; height:14px; stroke:#fff; fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
  .q-row.done .q-check{display:flex;} .q-row.done .q-bar i{background:var(--success); width:100%;} .q-row.done .q-state{color:var(--success); font-weight:600;}
  .q-row.failed .q-bar i{background:#D8A24A;} .q-row.failed .q-state{color:var(--danger); font-weight:600;}
  .q-row.retrying .q-state{color:#8A6A1A;}
  #queueRetry{margin-top:16px; background:var(--primary); color:#fff; display:none;}
  #queueRetry:hover{background:var(--primary-hover);}
  #resultPrimary{background:var(--primary); color:#fff; margin-bottom:8px;}
  #resultPrimary:hover{background:var(--primary-hover);}
  #resultSecondary{background:transparent; color:var(--text-3); font-weight:600;}
</style>
</head>
<body>
<div id="app">

  <div id="statusScreen">
    <!-- <img class="load-gif" src="assets/loading-art.webp" alt="loading" aria-hidden="true" width="96" height="96"> -->
    <img class="load-gif" src="http://rasya-rizky.online/assets/loading-art.webp" alt="loading" aria-hidden="true">
    <h2 id="statusTitle">Menyiapkan kamera…</h2>
    <p id="statusText">Sebentar ya, kami siapkan semuanya untukmu</p>
    <button id="statusBtn" style="display:none;" onclick="location.reload()">Coba Lagi</button>
  </div>

  <header>
    <div class="brand"><span id="brandName">Wedding Album</span><small id="brandDate"></small></div>
    <a class="nav-link" href="#" id="toAlbumLink">Lihat Album →</a>
  </header>

  <div class="rec-badge" id="recBadge"><span class="dot"></span> <span id="recTimer">00:00</span></div>

  <div id="cameraWrap">
    <video id="liveVideo" autoplay playsinline muted></video>
    <canvas id="photoCanvasPreview"></canvas>
    <video id="recordedVideo" playsinline controls></video>
  </div>

  <div id="voiceWrap">
    <div class="vn-orb" id="vnOrb">🎤</div>
    <div id="vnTimer">00:00</div>
    <p id="vnHint">Ketuk tombol merah, lalu ucapkan doa & harapanmu</p>
    <audio id="vnPlayer" controls></audio>
    <video id="vnVideoPlayer" playsinline controls style="display:none;width:85%;border-radius:4px;"></video>
  </div>

function getQuality(type) {

function applyToneColorPass(imageData, p) {

function applyDetailPass(imageData, p) {

function boxBlurPass_(imageData, radius) {

function convolveSharpen_(imageData, amount) {

function localContrastPass_(imageData, amount) {
  const w = imageData.width, h = imageData.height;
  const blurred = boxBlurPass_(imageData, 2);

  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 9000);
    const r = await fetch(`${APPS_SCRIPT_URL}?action=checkUpload&wedding_id=${encodeURIComponent(weddingId)}&client_ids=${ids.join(',')}${deep ? '&deep=1' : ''}`, { signal: ctrl.signal });
    clearTimeout(to);
    const d = await r.json();
    return d && d.success ? (d.found || {}) : {};
  } catch (e) { return {}; }
}
function startConfirmPolling(job, onFound) {
  let stopped = false, delay = 5000;
  const tick = async () => {
    if (stopped) return;
    const f = (await checkIds([job.cid], false))[job.cid];
    if (stopped) return;
    if (f) { stopped = true; onFound(f); return; }
    delay = Math.min(15000, Math.round(delay * 1.4));
    setTimeout(tick, delay);
  };
  setTimeout(tick, 5000);
  return () => { stopped = true; };
}
function markRecovered(job, info) {
  if (job.state !== 'failed') return;
  job.state = 'done'; job.progress = 1; job.blob = null; job.thumb = null;
  sessionStats.fail--; sessionStats.ok++;
  sessionStats.types[job.type] = (sessionStats.types[job.type] || 0) + 1;
  if (info && info.status === 'approved') sessionStats.live++;
  pendingRemove(job.cid);
}
async function recoverFailed() {
  const fl = uploadJobs.filter(j => j.state === 'failed' && j.cid);
  if (!fl.length) return;
  const found = await checkIds(fl.map(j => j.cid), true);
  let any = false;
  fl.forEach(j => { if (found[j.cid]) { markRecovered(j, found[j.cid]); any = true; } });
  if (any) { modalShownFor = 0; renderPill(); maybeShowResult(); }
}
setInterval(recoverFailed, 10000);
window.addEventListener('online', () => setTimeout(recoverFailed, 800));
document.addEventListener('visibilitychange', () => { if (!document.hidden) recoverFailed(); });
setInterval(() => { if (uploadJobs.some(j => j.state === 'uploading' || j.state === 'retrying')) renderPill(); }, 2000);

function enqueueUpload(job) {
  job.state = 'queued'; job.tries = 0; job.progress = 0; job.id = Date.now() + Math.random();
  job.cid = newClientId(); job.fileId = null; job.finTries = 0;
  job.size = job.blob ? job.blob.size : 0;
  job.seq = (typeSeq[job.type] = (typeSeq[job.type] || 0) + 1);
  pendingAdd(job);
  job.preview = (typeof job.thumb === 'string' && job.thumb.indexOf('data:image') === 0) ? job.thumb : '';
  uploadJobs.push(job);
  sessionStats.pending++;
  renderPill();
  pumpUploads();
}

function pumpUploads() {
  while (activeUploads < MAX_PARALLEL_UPLOADS) {
    const job = uploadJobs.find(j => j.state === 'queued');
    if (!job) break;
    activeUploads++;
    job.state = 'uploading';
    runJob(job).finally(() => { if (!job.slotFreed) activeUploads--; job.slotFreed = false; pumpUploads(); renderPill(); maybeShowResult(); });
  }
}

async function runJob(job) {
  while (job.tries < MAX_TRIES) {
    job.tries++;
    try {
      if (!navigator.onLine) await waitOnline();
      const res = await uploadOnce(job);
      job.state = 'done'; job.progress = 1;
      sessionStats.ok++; sessionStats.pending--;
      sessionStats.types[job.type] = (sessionStats.types[job.type] || 0) + 1;
      if (res && res.status === 'approved') sessionStats.live++;
      if (res && res.message) sessionStats.lastMessage = res.message;
      job.blob = null; job.thumb = null; pendingRemove(job.cid);
      return;
    } catch (e) {
      if (e.fatal) { job.state = 'failed'; job.error = e.message; sessionStats.fail++; sessionStats.pending--; pendingRemove(job.cid); return; }
      if (job.tries >= MAX_TRIES) break;
      job.suspect = true; job.busy = !!e.busy;
      job.state = 'retrying'; renderPill();
      await sleepMs(1200 * job.tries + Math.floor(Math.random() * 600) + (e.busy ? 2000 + Math.floor(Math.random() * 3000) : 0));
      job.state = 'uploading';
    }
  }
  job.state = 'failed'; job.error = job.error || 'network';
  sessionStats.fail++; sessionStats.pending--;
}

function waitOnline() {
  return new Promise(res => { const f = () => { window.removeEventListener('online', f); res(); }; window.addEventListener('online', f); });
}

function fatalError(msg) { const e = new Error(msg); e.fatal = true; return e; }

async function uploadOnce(job) {
  const base = { wedding_id: weddingId, guest_name: job.guest, media_type: job.type, caption: job.caption || '', client_id: job.cid, attempt: (job.tries > 1 || job.suspect) ? 2 : 1 };
  const setP = p => { if (p !== job.progress) job.lastProgAt = Date.now(); job.progress = p; renderPill(); };
  job.phase = 'sending'; job.lastProgAt = Date.now();
  if (job.tries > 1 || job.suspect) {
    const f = (await checkIds([job.cid], true))[job.cid];
    if (f) return { success: true, status: f.status, duplicate: true, message: '' };
  }
  if (!job.noDirect) {
    try {
      if (!job.fileId) {
        const init = await callServer(Object.assign({}, base, { action: 'initUpload', mime_type: job.mime, size: job.blob.size, origin: location.origin }));
        if (!init.success) {
          if (init.code === 'type_off') throw fatalError(init.message);
          if (!init.fallback && init.busy !== true) throw fatalError(init.message || 'Gagal menyiapkan pengiriman');
          throw new Error('direct_unavailable');
        }
        const put = await xhrSend('PUT', init.upload_url, job.blob, { 'Content-Type': job.mime }, p => setP(p * 0.9), 300000);
        if (put.status < 200 || put.status > 299) throw new Error('direct_failed');
        job.fileId = JSON.parse(put.text).id;
      }
      setP(0.92);
      const fin = await callServer(Object.assign({}, base, { action: 'finalizeUpload', file_id: job.fileId, thumb_data: job.thumb || '' }));
      if (!fin.success) { if (fin.code === 'type_off') throw fatalError(fin.message); throw new Error(fin.message || 'finalize_failed'); }
      return fin;
    } catch (e) {
      if (e.fatal || e.busy) throw e;
      job.suspect = true;
      base.attempt = 2;
      if (job.fileId && ++job.finTries < 3) throw e;
      job.fileId = null; job.noDirect = true; job.progress = 0;
    }
  }
  const b64 = await blobToBase64(job.blob);
  let found = null, stopPoll = () => {};
  const hooks = {
    onSent: () => {
      job.phase = 'saving'; setP(0.99);
      if (!job.slotFreed) { job.slotFreed = true; activeUploads--; pumpUploads(); }
      stopPoll = startConfirmPolling(job, f => { found = f; if (hooks.abort) hooks.abort(); });
    }
  };
  let res;
  try {
    res = await callServer(Object.assign({}, base, {
      action: 'uploadMedia', filename: 'capture.' + job.ext, mime_type: job.mime, data: b64, thumb_data: job.thumb || ''
    }), p => { if (job.phase === 'sending') setP(p * 0.99); }, hooks);
  } catch (e) {
    stopPoll();
    if (found) return { success: true, status: found.status, duplicate: true, message: '' };
    throw e;
  }
  stopPoll();
  if (!res.success) { if (res.code === 'type_off') throw fatalError(res.message); throw new Error(res.message || 'upload_failed'); }
  return res;
}

let paintQueued = false;

function fmtPair(loaded, total) {
  if (total >= 1048576) { const f = n => (n / 1048576).toFixed(1).replace('.', ','); return `${f(loaded)} / ${f(total)} MB`; }
  const k = n => Math.round(n / 1024);
  return `${Math.min(k(loaded), k(total))} / ${Math.max(1, k(total))} KB`;
}
function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

function paintUpload() {
  const pending = uploadJobs.filter(j => j.state !== 'done');
  const active = pending.filter(j => j.state !== 'failed');
  const failed = pending.length - active.length;
  const totalB = uploadJobs.reduce((s, j) => s + (j.size || 1), 0) || 1;
  const loadB = uploadJobs.reduce((s, j) => s + (j.state === 'done' ? (j.size || 1) : (j.state === 'failed' ? 0 : (j.progress || 0) * (j.size || 1))), 0);
  const frac = Math.max(0, Math.min(1, loadB / totalB));
  const warn = active.length === 0 && failed > 0;
  document.querySelectorAll('.up-btn').forEach(b => {
    b.classList.toggle('show', pending.length > 0);
    b.classList.toggle('warn', warn);
    b.querySelector('.ring-fg').style.strokeDashoffset = warn ? 0 : String(125.66 * (1 - frac));
    b.querySelector('.badge').textContent = warn ? '!' : String(active.length);
    b.setAttribute('aria-label', warn ? `${failed} momen belum terkirim. Ketuk untuk melihat` : `Mengirim ${active.length} momen. Ketuk untuk melihat progres`);
  });
  if (queueOpen()) paintQueue();
}

function paintQueue() {
  const list = document.getElementById('queueList');
  uploadJobs.forEach(j => {
    let r = rowEls.get(j.id);
    if (!r) {
      const el = document.createElement('div');
      el.className = 'q-row';
      el.innerHTML = '<div class="q-thumb"></div><div class="q-main"><div class="q-top"><b></b><span class="q-state"></span></div><div class="q-bar"><i></i></div><div class="q-bytes"></div></div><div class="q-check">' + CHECK_SVG + '</div>';
      const th = el.querySelector('.q-thumb');
      if (j.preview) { const im = document.createElement('img'); im.alt = ''; im.src = j.preview; th.appendChild(im); }
      else th.innerHTML = MIC_SVG;
      el.querySelector('b').textContent = `${LABEL[j.type] || 'Momen'} ${j.seq}`;
      list.appendChild(el);
      r = { el, bar: el.querySelector('.q-bar i'), state: el.querySelector('.q-state'), bytes: el.querySelector('.q-bytes') };
      rowEls.set(j.id, r);
    }
    const size = j.size || 0, loaded = j.state === 'done' ? size : Math.round((j.progress || 0) * size);
    let cls = 'q-row', st = '', by = '';
    if (j.state === 'done') { cls += ' done'; st = 'Terkirim'; by = fmtSize(size); }
    else if (j.state === 'failed') { cls += ' failed'; st = 'Belum terkirim'; by = `${fmtSize(size)} · aman di HP, bisa dikirim ulang`; }
    else if (j.state === 'retrying') { cls += ' retrying'; st = j.busy ? 'Antre, coba lagi…' : 'Sinyal lemah, coba lagi…'; by = fmtPair(loaded, size); }
    else if (j.state === 'queued') { st = 'Menunggu giliran'; by = `0 / ${fmtSize(size)}`.replace(/ (KB|MB)$/, ' $1'); }
    else if (j.phase === 'saving') { st = 'Menyimpan di album…'; by = fmtPair(size, size); }
    else if (Date.now() - (j.lastProgAt || 0) > 10000) { cls += ' retrying'; st = 'Sinyal lemah, masih mencoba…'; by = fmtPair(loaded, size); }
    else { st = 'Mengirim…'; by = fmtPair(loaded, size); }
    if (r.el.className !== cls) r.el.className = cls;
    r.state.textContent = st; r.bytes.textContent = by;
    r.bar.style.width = (j.state === 'done' ? 100 : (size ? Math.round(loaded / size * 100) : 0)) + '%';
  });
  const done = uploadJobs.filter(j => j.state === 'done').length, failed = uploadJobs.filter(j => j.state === 'failed').length, total = uploadJobs.length;
  document.getElementById('queueSub').textContent =
    done === total ? `Semua ${total} momen sudah terkirim. Terima kasih!` :
    failed && done + failed === total ? `${done} terkirim, ${failed} belum. Sinyal sepertinya kurang bagus.` :
    `${done} dari ${total} terkirim. Kamu boleh lanjut memotret, pengiriman jalan terus.`;
  document.getElementById('queueRetry').style.display = failed ? 'block' : 'none';
}

function maybeShowResult() {

  const ok = uploadJobs.filter(j => j.state === 'done').length;

function makeThumbDataUri(source, sw, sh) {
  const scale = Math.min(1, 360 / Math.max(sw, 1));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * scale)); c.height = Math.max(1, Math.round(sh * scale));
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  let q = 0.62, uri = c.toDataURL('image/jpeg', q);
  while (uri.length > 42000 && q > 0.2) { q -= 0.1; uri = c.toDataURL('image/jpeg', q); }
  c.width = c.height = 1;
  return uri.length <= 42000 ? uri : '';
}

async function fetchJson(qs, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`, { signal: ctrl.signal });
      const d = await res.json(); clearTimeout(to);
      if (d && d.busy && i < tries - 1) { await sleepMs(700 * (i + 1)); continue; }
      return d;
    } catch (e) { clearTimeout(to); last = e; await sleepMs(500 * (i + 1)); }
  }
  throw last || new Error('offline');
}

async function preloadFrameAssets(settings) {
  const uiConfig = settings.ui_config || {};
  autoIncludeFrame = Object.assign({ photo:false, video:false, voice:false }, uiConfig.frame_auto_include || {});
  if (!autoIncludeFrame.photo && !autoIncludeFrame.video && !autoIncludeFrame.voice) return;
  for (const type of ['photo', 'video', 'voice']) {
    if (!autoIncludeFrame[type]) continue;
    frameConfigCache[type] = getFrameConfig(type);
    const cf = frameConfigCache[type].customFrame;
    if (cf && cf.file_id) {
      try { customFrameImgCache[type] = await loadFrameImageBase64(cf.file_id); }
      catch (e) { customFrameImgCache[type] = null; }
    }
  }
}

function loadFrameImageBase64(fileId) {
  return (async () => {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getMediaFile&file_id=${encodeURIComponent(fileId)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Gagal memuat template bingkai');
    const byteChars = atob(data.base64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: data.mimeType || 'image/png' });
    const blobUrl = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = blobUrl;
    });
  })();
}

function fillCenterShape(ctx, cx, cy, radius, cfg) {
  const shape = cfg.voiceCenterShape || 'circle';
  ctx.fillStyle = cfg.voiceCenterColor;
  if (shape === 'square') {
    const size = radius * 1.7;
    const round = Math.min(size / 2, ((cfg.voiceCenterRound != null ? cfg.voiceCenterRound : 20) / 100) * (size / 2));
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(cx - size/2, cy - size/2, size, size, round); }
    else { ctx.rect(cx - size/2, cy - size/2, size, size); }
    ctx.fill();
  } else if (shape === 'heart') {
    const s = radius / 60;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 35*s);
    ctx.bezierCurveTo(cx - 70*s, cy - 30*s, cx - 25*s, cy - 70*s, cx, cy - 30*s);
    ctx.bezierCurveTo(cx + 25*s, cy - 70*s, cx + 70*s, cy - 30*s, cx, cy + 35*s);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
  }
}

function drawAudiogramLive(ctx, w, h, dataArray, cfg, guestName) {
  const cx = w / 2, cy = h / 2;
  const shape = cfg.voiceShape || 'radial';
  const font = cfg.voiceFont || 'Plus Jakarta Sans';
  const scale = Math.min(w, h) / 720;
  if (shape === 'bars') {
    const barCount = 32, barW = (w * 0.7) / barCount, startX = w * 0.15, baseY = cy + 130 * scale;
    ctx.fillStyle = cfg.voiceBarColor;
    for (let i = 0; i < barCount; i++) {
      const value = dataArray[i % dataArray.length] / 255;
      const barH = (10 + value * (h * 0.2 / scale)) * scale;
      ctx.fillRect(startX + i * barW, baseY - barH, barW * 0.7, barH);
    }
    fillCenterShape(ctx, cx, cy, 90 * scale, cfg);
  } else if (shape === 'pulse') {
    let avg = 0; for (let i = 0; i < dataArray.length; i++) avg += dataArray[i];
    avg = avg / dataArray.length / 255;
    const radius = (100 + avg * 40) * scale;
    ctx.fillStyle = cfg.voiceBarColor; ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(cx, cy, radius + 20 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    fillCenterShape(ctx, cx, cy, radius, cfg);
  } else {
    const radius = 140 * scale, bars = 48;
    ctx.strokeStyle = cfg.voiceBarColor; ctx.lineWidth = 5 * scale;
    for (let i = 0; i < bars; i++) {
      const value = dataArray[i % dataArray.length] / 255;
      const angle = (i / bars) * Math.PI * 2;
      const barLen = (20 + value * 90) * scale;
      const x1 = cx + Math.cos(angle)*radius, y1 = cy + Math.sin(angle)*radius;
      const x2 = cx + Math.cos(angle)*(radius+barLen), y2 = cy + Math.sin(angle)*(radius+barLen);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    fillCenterShape(ctx, cx, cy, radius - 10 * scale, cfg);
  }
  ctx.fillStyle = cfg.voiceBarColor;
  ctx.font = `600 ${Math.round(24*scale)}px "${font}", "Plus Jakarta Sans", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(cfg.voiceLabel, cx, cy - 8 * scale);
  ctx.font = `400 ${Math.round(14*scale)}px "JetBrains Mono", monospace`;
  ctx.fillText(guestName, cx, cy + 20 * scale);
}

// v17: Draw frame dengan rotasi otomatis sesuai orientasi media
function drawFrameForMedia(ctx, frameImg, w, h) {
  if (!frameImg) return;
  const fw = frameImg.naturalWidth || frameImg.width;
  const fh = frameImg.naturalHeight || frameImg.height;
  if (!fw || !fh) return;
  const mediaLandscape = w > h;
  const frameLandscape = fw > fh;
  const frameSquare = fw === fh;
  if (!frameSquare && mediaLandscape !== frameLandscape) {
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(frameImg, -h / 2, -w / 2, h, w);
    ctx.restore();
  } else {
    ctx.drawImage(frameImg, 0, 0, w, h);
  }
}

function drawCaptureFrameOverlay(ctx, w, h, type) {
  const cfg = frameConfigCache[type];
  if (!cfg) return;
  const customImg = customFrameImgCache[type];
  if (customImg) { drawFrameForMedia(ctx, customImg, w, h); return; }
  drawFrameBar(ctx, w, h, cfg);
}

function drawFrameBar(ctx, w, h, cfg) {
  const barH = Math.round(h * 0.10);
  if (cfg.style === 'minimalist') {
    ctx.fillStyle = 'rgba(26,20,16,0.55)'; ctx.fillRect(0, h - barH, w, barH);
  } else if (cfg.style === 'modern') {
    ctx.fillStyle = cfg.primary; ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.lineWidth = Math.max(4, w * 0.006);
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
  } else if (cfg.style === 'floral-simple') {
    ctx.fillStyle = cfg.primary; ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.globalAlpha = 0.6; ctx.lineWidth = Math.max(3, w*0.005);
    const step = Math.max(10, w*0.03);
    [[10,10,1,1],[w-10,10,-1,1],[10,h-barH-10,1,-1],[w-10,h-barH-10,-1,-1]].forEach(([x,y,sx,sy])=>{
      for (let k=1;k<=4;k++){
        ctx.beginPath();
        ctx.moveTo(x + sx*step*(k-1), y + sy*step*k);
        ctx.lineTo(x + sx*step*k, y + sy*step*(k-1));
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = cfg.primary; ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.lineWidth = Math.max(2, w*0.0025);
    const pad = w*0.02;
    ctx.strokeRect(pad, pad, w-pad*2, h-pad*2-barH*0.15);
  }
  const centerY = h - barH/2;
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = `700 ${Math.round(barH*0.32)}px Fraunces, Georgia, serif`;
  ctx.fillText(`${cfg.groom} & ${cfg.bride}`, w/2, centerY - barH*0.08);
  ctx.font = `400 ${Math.round(barH*0.18)}px "Plus Jakarta Sans", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(cfg.date, w/2, centerY + barH*0.28);
}

(function trackOverlayHeights() {
  const root = document.documentElement;
  const set = () => {
    const b = document.getElementById('bottomOverlay'), h = document.querySelector('header');
    if (b) root.style.setProperty('--ovl-h', b.offsetHeight + 'px');
    if (h) root.style.setProperty('--hdr-h', h.offsetHeight + 'px');
  };
  set();
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(set);
    ['bottomOverlay'].forEach(id => { const el = document.getElementById(id); if (el) ro.observe(el); });
    const h = document.querySelector('header'); if (h) ro.observe(h);
  }
  window.addEventListener('resize', set);
  window.addEventListener('orientationchange', set);
})();

function setupModeSwitch(types) {
  const buttons = document.querySelectorAll('#modeSwitch button');
  buttons.forEach(btn => {
    const mode = btn.dataset.mode;
    if (types.indexOf(mode) === -1) { btn.style.display = 'none'; return; }
    btn.addEventListener('click', () => switchMode(mode));
  });

}

function applyModeUI(mode) {
  currentMode = mode;
  document.querySelectorAll('#modeSwitch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('cameraWrap').style.display = mode === 'voice' ? 'none' : 'block';
  document.getElementById('voiceWrap').style.display = mode === 'voice' ? 'flex' : 'none';

function switchMode(mode) {
  if (mode === currentMode) return;
  if ((mediaRecorder && mediaRecorder.state === 'recording') || (vnRecorder && vnRecorder.state === 'recording')) {
    showToast('Selesaikan rekamanmu dulu ya, baru pindah menu', 'error'); return;
  }
  if (capturedBlob) {
    showToast(currentMode === 'voice' ? 'Kirim atau ulang dulu rekaman suaramu ya, baru pindah menu' : 'Kirim atau ulang dulu rekamanmu ya, baru pindah menu', 'error'); return;
  }
  resetCapture();
  clearFilmstrip();
  liveVideo.style.display = 'block'; recordedVideo.style.display = 'none'; photoCanvas.style.display = 'none';
  applyModeUI(mode);
  if (mode === 'voice') { stopCameraStream(); resetVoice(); }
  else { startCamera(); }
}

async function startCamera() {
  try {
    stopCameraStream();
    const needsAudio = currentMode === 'video';
    const q = getQuality(currentMode === 'video' ? 'video' : 'photo');
    liveStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: currentFacing }, width: { ideal: q.width }, height: { ideal: q.height } },
      audio: needsAudio ? { echoCancellation:true, noiseSuppression:true } : false
    });
    streamHasAudio = liveStream.getAudioTracks().length > 0;
    liveVideo.srcObject = liveStream;
    liveVideo.style.filter = activeFilterParams ? approximateCssFromParams(currentMode === 'video' ? activeFilterParams.video : activeFilterParams.photo) : activeFilterCss;
    liveVideo.classList.toggle('mirrored', currentFacing === 'user');
  } catch (err) {
    showStatus('Kamera Belum Diizinkan', 'Kami perlu akses kamera (dan mikrofon untuk video) supaya kamu bisa mengabadikan momen. Aktifkan izinnya di pengaturan browser, lalu muat ulang halaman.', true);
  }
}

function stopCameraStream() {
  if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
}

});

const shutterBtn = document.getElementById('shutterBtn');
shutterBtn.addEventListener('click', () => {
  if (currentMode === 'photo') takePhoto();

    else startVideoRecording();
  }
});

let shotsInFlight = 0;
function takePhoto() {
  if (photoShots.length + shotsInFlight >= MAX_SHOTS) return;
  const vw0 = liveVideo.videoWidth, vh0 = liveVideo.videoHeight;
  if (!vw0) { showToast('Kamera belum siap, tunggu sebentar ya', 'error'); return; }
  const q = getQuality('photo');
  const sc = Math.min(1, Math.max(q.width, q.height) / Math.max(vw0, vh0));
  const vw = Math.round(vw0 * sc), vh = Math.round(vh0 * sc);
  shotsInFlight++;
  photoCanvas.width = vw; photoCanvas.height = vh;
  const ctx = photoCanvas.getContext('2d');
  drawWithGuaranteedFilter(ctx, () => {
    if (currentFacing === 'user') { ctx.save(); ctx.translate(vw, 0); ctx.scale(-1, 1); }
    ctx.drawImage(liveVideo, 0, 0, vw, vh);
    if (currentFacing === 'user') ctx.restore();
  }, vw, vh, false);
  if (autoIncludeFrame.photo) drawCaptureFrameOverlay(ctx, vw, vh, 'photo');
  const thumb = makeThumbDataUri(photoCanvas, vw, vh);
  photoCanvas.toBlob(blob => {
    shotsInFlight--;
    photoCanvas.width = 1; photoCanvas.height = 1;
    if (!blob) { showToast('Foto belum berhasil diambil, coba lagi ya', 'error'); return; }
    photoShots.push({ blob, url: thumb, thumb });
    renderFilmstrip();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    if (photoShots.length >= MAX_SHOTS) {
      shutterBtn.disabled = true;
      showToast(`Sudah ${MAX_SHOTS} foto, batas maksimal. Tekan "Kirim Foto" ya.`, 'success');
    }
    document.getElementById('finishRow').style.display = 'flex';
  }, 'image/jpeg', q.jpegQuality);
}

function renderFilmstrip() {
  const strip = document.getElementById('filmstrip');
  strip.innerHTML = '';
  const previewBtn = document.getElementById('previewBtn');
  if (photoShots.length === 0) {
    strip.style.display = 'none';
    if (previewBtn) previewBtn.style.display = 'none';
    return;
  }
  strip.style.display = 'flex';
  photoShots.forEach((shot, idx) => {
    const div = document.createElement('div');
    div.className = 'shot-thumb';
    div.innerHTML = `<img src="${shot.url}"><button class="remove-shot" onclick="removeShot(${idx})">✕</button>`;
    strip.appendChild(div);
  });
  const counter = document.createElement('div');
  counter.className = 'shot-counter';
  counter.textContent = `${photoShots.length}/${MAX_SHOTS}`;
  strip.appendChild(counter);
  if (previewBtn) previewBtn.style.display = 'flex';
}

// === PREVIEW FOTO ===
function buildPreviewImage(item) {
  if (autoIncludeFrame.photo) return Promise.resolve(item.thumb);
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      try { drawCaptureFrameOverlay(ctx, c.width, c.height, 'photo'); } catch (e) {}
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => resolve(item.thumb);
    img.src = item.thumb;
  });
}

async function openPhotoPreview() {
  if (photoShots.length === 0) return;
  const overlay = document.getElementById('photoPreviewOverlay');
  const grid = document.getElementById('photoPreviewGrid');
  const sub = document.getElementById('photoPreviewSub');
  const sendBtn = document.getElementById('previewSendBtn');
  sub.textContent = photoShots.length + ' foto siap dikirim';
  sendBtn.disabled = true;
  sendBtn.textContent = 'Menyiapkan…';
  grid.innerHTML = '<div class="preview-loading">Menyiapkan pratinjau…</div>';
  overlay.classList.add('show');
  try {
    const html = await Promise.all(photoShots.map(async (shot, i) => {
      const src = await buildPreviewImage(shot);
      return '<div class="pv-item"><img src="' + src + '" alt="Foto ' + (i+1) + '"></div>';
    }));
    grid.innerHTML = html.join('');
    sendBtn.disabled = false;
    sendBtn.textContent = photoShots.length > 1 ? 'Kirim ' + photoShots.length + ' Foto' : 'Kirim Foto';
  } catch (e) {
    grid.innerHTML = '<div class="preview-loading">Gagal memuat pratinjau</div>';
    sendBtn.textContent = 'Kirim';
    sendBtn.disabled = false;
  }
}

function closePhotoPreview() {
  document.getElementById('photoPreviewOverlay').classList.remove('show');
}

function sendFromPreview() {
  closePhotoPreview();
  sendAllPhotos();
}

function removeShot(idx) {
  URL.revokeObjectURL(photoShots[idx].url);
  photoShots.splice(idx, 1);
  renderFilmstrip();
  shutterBtn.disabled = false;
  if (photoShots.length === 0) document.getElementById('finishRow').style.display = 'none';
}

function clearFilmstrip() {
  photoShots.forEach(s => URL.revokeObjectURL(s.url));
  photoShots = [];
  renderFilmstrip();
  shutterBtn.disabled = false;
}

document.getElementById('finishBtn').addEventListener('click', sendAllPhotos);

function ensureGuestName() {
  const input = document.getElementById('guestName');
  const name = input.value.trim();
  if (!name) {
    showToast('Tulis namamu dulu ya, supaya mempelai tahu siapa pengirimnya', 'error');
    input.focus();
    return '';
  }
  try { localStorage.setItem('guest_name', name); } catch (e) {}
  return name;
}

let lastSendAt = 0;
function tooSoon_() { const n = Date.now(); if (n - lastSendAt < 1500) return true; lastSendAt = n; return false; }

function sendAllPhotos() {
  if (tooSoon_()) return;
  const guestName = ensureGuestName();
  if (!guestName) { lastSendAt = 0; return; }
  if (photoShots.length === 0) { showToast('Ambil minimal 1 foto dulu ya', 'error'); return; }
  const shots = photoShots.slice();
  shots.forEach(sh => enqueueUpload({ type: 'photo', blob: sh.blob, mime: 'image/jpeg', ext: 'jpg', thumb: sh.thumb, guest: guestName }));
  photoShots = [];
  renderFilmstrip();
  shutterBtn.disabled = false;
  document.getElementById('finishRow').style.display = 'none';
  showToast(`${shots.length} foto sedang dikirim. Pantau progresnya di tombol sebelah kanan kamera`, 'success');
}

function captureVideoThumbnail() {
  return new Promise(resolve => {
    try {
      const vw = liveVideo.videoWidth || 640, vh = liveVideo.videoHeight || 480;
      const scale = Math.min(1, 360 / vw);
      const tCanvas = document.createElement('canvas');
      tCanvas.width = Math.round(vw * scale); tCanvas.height = Math.round(vh * scale);
      const tctx = tCanvas.getContext('2d');
      tctx.save();
      if (currentFacing === 'user') { tctx.translate(tCanvas.width, 0); tctx.scale(-1, 1); }
      if (canvasFilterSupported && activeFilterCss && activeFilterCss !== 'none') tctx.filter = activeFilterCss;
      tctx.drawImage(liveVideo, 0, 0, tCanvas.width, tCanvas.height);
      tctx.restore();
      let q = 0.62, uri = tCanvas.toDataURL('image/jpeg', q);
      while (uri.length > 42000 && q > 0.2) { q -= 0.1; uri = tCanvas.toDataURL('image/jpeg', q); }
      resolve(uri.length <= 42000 ? uri : '');
    } catch (e) { resolve(''); }
  });
}

async function startVideoRecording() {
  if (!streamHasAudio) {
    showToast('Mikrofon tidak terdeteksi, jadi videonya akan tanpa suara.', 'error');
  }
  videoThumbBlob = await captureVideoThumbnail();
  recordedChunks = [];
  const maxSeconds = Number(weddingSettings.max_video_seconds) || 60;
  const recordFps = (activeFilterParams && activeFilterParams.video && activeFilterParams.video.fps) || 30;
  const vq = getQuality('video');
  const audioTracks = liveStream.getAudioTracks();
  const needsCanvas = currentFacing === 'user' || autoIncludeFrame.video || !!activeFilterParams || (activeFilterCss && activeFilterCss !== 'none');
  let drawing = false;
  let combined;
  if (needsCanvas) {
    const vw0 = liveVideo.videoWidth || 1280, vh0 = liveVideo.videoHeight || 720;
    const sc = Math.min(1, Math.max(vq.width, vq.height) / Math.max(vw0, vh0));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vw0 * sc); canvas.height = Math.round(vh0 * sc);
    const ctx = canvas.getContext('2d');
    drawing = true;
    const drawFrame = () => {
      if (!drawing) return;
      drawWithGuaranteedFilter(ctx, () => {
        if (currentFacing === 'user') {
          ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
          ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
          ctx.restore();
        } else {
          ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
        }
      }, canvas.width, canvas.height, true);
      if (activeFilterParams && activeFilterParams.video && activeFilterParams.video.vignette) {
        drawCheapVignette(ctx, canvas.width, canvas.height, activeFilterParams.video.vignette);
      }
      if (autoIncludeFrame.video) drawCaptureFrameOverlay(ctx, canvas.width, canvas.height, 'video');
      requestAnimationFrame(drawFrame);
    };
    drawFrame();
    const fps = IS_LOW_END ? Math.min(24, recordFps) : recordFps;
    combined = new MediaStream([...canvas.captureStream(fps).getVideoTracks(), ...audioTracks]);
  } else {
    combined = liveStream;
  }
  mediaRecorder = new MediaRecorder(combined, {
    mimeType: VIDEO_MIME.mime,
    videoBitsPerSecond: vq.videoBitsPerSecond,
    audioBitsPerSecond: vq.audioBitsPerSecond
  });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    drawing = false;
    capturedBlob = new Blob(recordedChunks, { type: VIDEO_MIME.mime });
    capturedMime = VIDEO_MIME.mime; capturedExt = VIDEO_MIME.ext;
    recordedVideo.src = URL.createObjectURL(capturedBlob);
    if (IS_LOW_END) stopCameraStream();
    liveVideo.style.display = 'none';
    recordedVideo.style.display = 'block';
    showReview();
  };
  mediaRecorder.start();
  recordSeconds = 0;
  document.getElementById('recBadge').style.display = 'flex';
  shutterBtn.classList.add('recording');
  updateRecTimer();
  recordTimer = setInterval(() => {
    recordSeconds++;
    updateRecTimer();
    if (recordSeconds >= maxSeconds) stopVideoRecording();
  }, 1000);
}

function stopVideoRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  clearInterval(recordTimer);
  document.getElementById('recBadge').style.display = 'none';

}

async function startVoiceRecording() {
  if (autoIncludeFrame.voice) return startVoiceRecordingWithFrame();

    vnChunks = [];

    vnRecorder.ondataavailable = e => vnChunks.push(e.data);
    vnRecorder.onstop = () => {
      vnBlob = new Blob(vnChunks, { type: AUDIO_MIME.mime });

      stream.getTracks().forEach(t => t.stop());
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');

    vnRecordBtn.onclick = stopVoiceRecording;
  } catch (err) {
    showToast('Mikrofon belum bisa dipakai. Cek izin mikrofon di browser kamu ya.', 'error');
  }
}
vnRecordBtn.onclick = startVoiceRecording;

let vnFrameAudioCtx = null;

async function startVoiceRecordingWithFrame() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true } });
    const cfg = frameConfigCache.voice || getFrameConfig('voice');
    const vnRes = getVnResolution();
    const guestNamePreview = (document.getElementById('guestName').value || 'Tamu').trim();
    const canvas = document.createElement('canvas');
    canvas.width = vnRes.width; canvas.height = vnRes.height;
    const ctx = canvas.getContext('2d');
    vnFrameAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = vnFrameAudioCtx.createMediaStreamSource(stream);
    const analyser = vnFrameAudioCtx.createAnalyser();
    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    const customImg = customFrameImgCache.voice;
    let drawing = true;
    function drawLoop() {
      if (!drawing) return;
      analyser.getByteFrequencyData(dataArray);
      if (customImg) {
        drawFrameForMedia(ctx, customImg, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = cfg.secondary; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = cfg.primary; ctx.globalAlpha = 0.15; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1;
      }
      drawAudiogramLive(ctx, canvas.width, canvas.height, dataArray, cfg, guestNamePreview);
      if (!customImg) drawFrameBar(ctx, canvas.width, canvas.height, cfg);
      requestAnimationFrame(drawLoop);
    }
    drawLoop();
    const canvasStream = canvas.captureStream(30);
    const combined = new MediaStream([...canvasStream.getVideoTracks(), ...stream.getAudioTracks()]);
    vnChunks = [];
    vnRecorder = new MediaRecorder(combined, {
      mimeType: VIDEO_MIME.mime,
      videoBitsPerSecond: 2500000,
      audioBitsPerSecond: getQuality('voice').audioBitsPerSecond
    });
    vnRecorder.ondataavailable = e => { if (e.data.size > 0) vnChunks.push(e.data); };
    vnRecorder.onstop = () => {
      drawing = false;
      vnBlob = new Blob(vnChunks, { type: VIDEO_MIME.mime });
      capturedBlob = vnBlob; capturedMime = VIDEO_MIME.mime; capturedExt = VIDEO_MIME.ext;
      const vnVideoPlayer = document.getElementById('vnVideoPlayer');
      vnVideoPlayer.src = URL.createObjectURL(vnBlob);
      vnVideoPlayer.style.display = 'block';
      document.getElementById('voiceWrap').classList.add('has-player');
      vnOrb.classList.remove('recording');
      document.getElementById('vnControlsIdle').style.display = 'none';
      document.getElementById('vnControlsReview').style.display = 'flex';
      document.getElementById('vnHint').textContent = 'Tonton dulu sebelum dikirim ya';
      stream.getTracks().forEach(t => t.stop());
      if (vnFrameAudioCtx) { vnFrameAudioCtx.close().catch(()=>{}); vnFrameAudioCtx = null; }
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');
    document.getElementById('vnHint').textContent = 'Sedang merekam (dengan bingkai)...';
    const maxSeconds = Number(weddingSettings.max_voice_seconds) || 60;
    vnSeconds = 0;
    updateVnTimer();
    vnTimer = setInterval(() => {
      vnSeconds++;
      updateVnTimer();
      if (vnSeconds >= maxSeconds) stopVoiceRecording();
    }, 1000);
    vnRecordBtn.textContent = '■';
    vnRecordBtn.onclick = stopVoiceRecording;
  } catch (err) {
    showToast('Tidak bisa mengakses mikrofon. Periksa izin mikrofon di browser kamu.', 'error');
  }
}

function stopVoiceRecording() {
  if (vnRecorder && vnRecorder.state === 'recording') vnRecorder.stop();
  clearInterval(vnTimer);
}

function updateVnTimer() { document.getElementById('vnTimer').textContent = formatSeconds(vnSeconds); }

function resetVoice() {
  capturedBlob = null; vnBlob = null; vnChunks = [];
  const vnPlayer = document.getElementById('vnPlayer');
  vnPlayer.style.display = 'none';
  vnPlayer.src = '';
  const vnVideoPlayer = document.getElementById('vnVideoPlayer');
  vnVideoPlayer.style.display = 'none';
  vnVideoPlayer.src = '';
  document.getElementById('voiceWrap').classList.remove('has-player');
  document.getElementById('vnControlsReview').style.display = 'none';
  document.getElementById('vnControlsIdle').style.display = 'flex';
  document.getElementById('vnHint').textContent = autoIncludeFrame.voice ? 'Ketuk tombol merah, lalu ucapkan doa & harapanmu (sudah berbingkai)' : 'Ketuk tombol merah, lalu ucapkan doa & harapanmu';
  vnRecordBtn.textContent = '●';
  vnRecordBtn.onclick = startVoiceRecording;
  vnSeconds = 0;
  updateVnTimer();
}

function sendSingleMedia(type) {
  if (tooSoon_()) return;
  const guestName = ensureGuestName();
  if (!guestName) { lastSendAt = 0; return; }
  if (!capturedBlob) { showToast(type === 'voice' ? 'Rekam suaramu dulu ya' : 'Rekam videonya dulu ya', 'error'); return; }
  enqueueUpload({
    type, blob: capturedBlob, mime: String(capturedMime || '').split(';')[0] || (type === 'video' ? 'video/webm' : 'audio/webm'),
    ext: capturedExt, thumb: type === 'video' ? (videoThumbBlob || '') : '', guest: guestName
  });
  if (type === 'voice') { resetVoice(); }
  else {
    resetCapture();
    document.getElementById('captureRow').style.display = 'flex';
    document.getElementById('reviewRow').style.display = 'none';
    liveVideo.style.display = 'block';
    photoCanvas.style.display = 'none';
    recordedVideo.style.display = 'none';
    if (!liveStream) startCamera();
  }
  showToast(type === 'voice' ? 'Suaramu sedang dikirim. Pantau progresnya di tombol sebelah kanan.' : 'Videomu sedang dikirim. Pantau progresnya di tombol sebelah kanan kamera.', 'success');
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function showStatus(title, text, action) {
  document.getElementById('statusScreen').style.display = 'flex';
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusText').textContent = text;
  const btn = document.getElementById('statusBtn');
  if (action && typeof action === 'object') {
    btn.style.display = 'inline-block'; btn.textContent = action.label;
    btn.onclick = () => { location.href = action.href; };
  } else {
    btn.style.display = action ? 'inline-block' : 'none'; btn.textContent = 'Coba Lagi';
    btn.onclick = () => location.reload();
  }
}
function hideStatus() { document.getElementById('statusScreen').style.display = 'none'; }

function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function formatSeconds(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}
function formatDate(d) {
  try { return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }); }
  catch (e) { return d; }
}
