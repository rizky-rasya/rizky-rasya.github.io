<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Album - Selamat Datang</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="welcome-page">
    <div class="welcome-container">
        <div class="welcome-card">
            <div class="welcome-floral">❦</div>
            
            <h1 class="welcome-title" id="coupleName">Wedding Album</h1>
            <p class="welcome-date" id="weddingDate"></p>
            
            <div class="welcome-divider">
                <span>❦</span>
            </div>
            
            <p class="welcome-message">
                Selamat datang! Bagikan momen terbaikmu di pernikahan kami.
            </p>
            
            <div class="welcome-form">
                <div class="form-group">
                    <label for="guestName">Siapa nama Anda?</label>
                    <input type="text" 
                           id="guestName" 
                           placeholder="Masukkan nama Anda"
                           maxlength="50"
                           autocomplete="off">
                </div>
                
                <button class="btn btn-primary btn-lg" id="startBtn" onclick="startCapture()">
                    📷 Mulai Bagikan Momen
                </button>
            </div>
            
            <div class="welcome-links">
                <a href="album.html" class="btn btn-outline btn-sm">
                    📸 Lihat Album
                </a>
            </div>
        </div>
        
        <footer class="welcome-footer">
            <p>Dibuat dengan ❤️ • Wedding Album Digital</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Load wedding info
        async function loadWeddingInfo() {
            try {
                const weddingId = getWeddingId();
                const result = await api.getSettings(weddingId);
                
                if (result.success && result.settings) {
                    const s = result.settings;
                    document.getElementById('coupleName').textContent = 
                        `${s.groom_name} & ${s.bride_name}`;
                    document.getElementById('weddingDate').textContent = 
                        formatDate(s.date);
                    
                    // Update theme colors
                    if (s.primary_color) {
                        document.documentElement.style.setProperty('--primary-color', s.primary_color);
                    }
                    if (s.secondary_color) {
                        document.documentElement.style.setProperty('--secondary-color', s.secondary_color);
                    }
                    
                    document.title = `Wedding Album - ${s.groom_name} & ${s.bride_name}`;
                }
            } catch (error) {
                console.error('Gagal load:', error);
            }
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            });
        }
        
        function startCapture() {
            const guestName = document.getElementById('guestName').value.trim();
            
            if (!guestName) {
                showError('Mohon masukkan nama Anda terlebih dahulu');
                return;
            }
            
            // Simpan nama
            setGuestName(guestName);
            
            // Redirect ke halaman kamera
            window.location.href = 'camera.html';
        }
        
        function showError(message) {
            const input = document.getElementById('guestName');
            input.style.borderColor = '#e74c3c';
            input.placeholder = message;
            input.classList.add('shake');
            
            setTimeout(() => {
                input.style.borderColor = '';
                input.classList.remove('shake');
            }, 2000);
        }
        
        // Enter key untuk submit
        document.getElementById('guestName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startCapture();
            }
        });
        
        // Load saved name
        const savedName = getGuestName();
        if (savedName) {
            document.getElementById('guestName').value = savedName;
        }
        
        // Init
        loadWeddingInfo();
    </script>
</body>
</html>
