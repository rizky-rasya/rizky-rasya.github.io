<style>
  :root{--primary:#440808;--primary-hover:#5A1010;--accent:#C9A66B;--accent-soft:#F5ECD9;--surface:#FFFFFF;--surface-2:#EFE9DF;--text:#1A1410;--text-2:#5A4D42;--text-3:#8A7B6E;--danger:#A02828;--success:#2F6B3F;--dark:#1A1410;--dark-2:#2A2320;}

  #statusScreen button{margin-top:12px;padding:12px 28px;border-radius:4px;border:none;background:var(--accent);color:#ffffff;font-weight:700;font-family:inherit;font-size:14px;letter-spacing:0.01em;cursor:pointer}

  #vnSendBtn{background:var(--accent);color:#fff;padding:14px 22px;border-radius:4px;border:none;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}

<script>
function reloadSelf(){

const urlParams = new URLSearchParams(window.location.search);
let weddingId = urlParams.get('w');
if (weddingId) localStorage.setItem('active_wedding_id', weddingId);

document.getElementById('toAlbumLink').href = weddingId ? `album.html?w=${encodeURIComponent(weddingId)}` : '#';

if (!weddingId) {
  showStatus('Link Belum Lengkap', 'Link ini belum berisi kode undangan. Minta mempelai mengirimkan ulang link yang benar ya.', false);

function pickSupportedMime(candidates){for(const c of candidates){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c.mime))return c}return candidates[candidates.length-1]}

const AUDIO_MIME = pickSupportedMime([{mime:'audio/mp4;codecs=mp4a.40.2',ext:'m4a'},{mime:'audio/mp4',ext:'m4a'},{mime:'audio/webm;codecs=opus',ext:'webm'},{mime:'audio/webm',ext:'webm'}]);

let weddingSettings = null;
const QUALITY_PRESETS = {
  photo:{standard:{width:1280,height:720,jpegQuality:.85},high:{width:1920,height:1080,jpegQuality:.92},max:{width:3840,height:2160,jpegQuality:.97}},
  video:{standard:{width:1280,height:720,videoBitsPerSecond:2500000,audioBitsPerSecond:96000},high:{width:1920,height:1080,videoBitsPerSecond:6000000,audioBitsPerSecond:128000},max:{width:1920,height:1080,videoBitsPerSecond:10000000,audioBitsPerSecond:192000}},
  voice:{standard:{audioBitsPerSecond:64000},high:{audioBitsPerSecond:128000}}
};
function getQuality(type){
  const uiConfig=(weddingSettings&&weddingSettings.ui_config)||{};
  const q=uiConfig.quality||{};
  const level=q[type]||'high';
  let out;
  if(level==='custom'){const custom=(uiConfig.quality_custom&&uiConfig.quality_custom[type])||{};out=Object.assign({},QUALITY_PRESETS[type].high,custom);}
  else out=Object.assign({},QUALITY_PRESETS[type][level]||QUALITY_PRESETS[type].high);

  const slow=/(^|-)2g|3g/.test(ct);
  if(type==='photo'){out.width=Math.min(out.width,IS_LOW_END?1280:2560);out.height=Math.min(out.height,IS_LOW_END?720:1440);if(IS_LOW_END||slow)out.jpegQuality=Math.min(out.jpegQuality,.82);}
  else if(type==='video'){out.width=Math.min(out.width,IS_LOW_END?1280:1920);out.height=Math.min(out.height,IS_LOW_END?720:1080);const cap=slow?1200000:(IS_LOW_END?1800000:8000000);out.videoBitsPerSecond=Math.min(out.videoBitsPerSecond,cap);out.audioBitsPerSecond=Math.min(out.audioBitsPerSecond,slow?64000:128000);}

}
let activeFilterCss='none';
let activeFilterParams=null;
let activeVideoCss='none';
function liveFilterCss(mode){const P=activeFilterParams?(mode==='video'?activeFilterParams.video:activeFilterParams.photo):null;if(P&&Object.keys(P).length)return approximateCssFromParams(P);return mode==='video'?activeVideoCss:activeFilterCss;}
let canvasFilterSupported=(function(){try{const c=document.createElement('canvas');c.width=2;c.height=2;const cx=c.getContext('2d');cx.fillStyle='#000';cx.fillRect(0,0,2,2);cx.filter='invert(1)';cx.fillRect(0,0,2,2);const px=cx.getImageData(0,0,1,1).data;return px[0]>200;}catch(e){return false;}})();

function drawWithGuaranteedFilter(ctx,drawFn,w,h,isRealtime){
  const p=activeFilterParams?(isRealtime?activeFilterParams.video:activeFilterParams.photo):null;
  if(p&&Object.keys(p).length>0){
    if(isRealtime){if(canvasFilterSupported){ctx.filter=approximateCssFromParams(p);drawFn();ctx.filter='none';}else{drawFn();}return;}
    drawFn();

function clamp255_(v){return v<0?0:(v>255?255:v);}
function applyToneColorPass(imageData,p){

    r+=brightAdd;g+=brightAdd;b+=brightAdd;
    if(bpAmt!==0){r+=bpAmt*(1-r/255);g+=bpAmt*(1-g/255);b+=bpAmt*(1-b/255);}

    r=L+(r-L)*satFactor;g=L+(g-L)*satFactor;b=L+(b-L)*satFactor;
    if(vibAmt!==0){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const curSat=(mx-mn)/255;const amt=vibAmt*(1-curSat);L=.2126*r+.7152*g+.0722*b;r=L+(r-L)*(1+amt);g=L+(g-L)*(1+amt);b=L+(b-L)*(1+amt);}
    r+=warmAmt;b-=warmAmt;g+=tintAmt;r-=tintAmt*.5;b-=tintAmt*.5;
    if(vigAmt!==0){const idx=i/4;const x=idx%w,y=Math.floor(idx/w);const dist=Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))/maxDist;const fall=Math.max(0,dist-.4)*vigAmt*1.6;const factor=1-fall;r*=factor;g*=factor;b*=factor;}

  }

function applyDetailPass(imageData,p){let data=imageData;if((p.noiseReduction||0)>0)data=boxBlurPass_(data,Math.round((p.noiseReduction/100)*3));if((p.sharpness||0)!==0)data=convolveSharpen_(data,(p.sharpness||0)/100);if((p.definition||0)!==0)data=localContrastPass_(data,(p.definition||0)/100);return data;}
function boxBlurPass_(imageData,radius){if(radius<=0)return imageData;const w=imageData.width,h=imageData.height;const src=imageData.data;const out=new Uint8ClampedArray(src.length);for(let y=0;y<h;y++){for(let x=0;x<w;x++){let r=0,g=0,b=0,a=0,count=0;for(let dy=-radius;dy<=radius;dy++){for(let dx=-radius;dx<=radius;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const idx=(ny*w+nx)*4;r+=src[idx];g+=src[idx+1];b+=src[idx+2];a+=src[idx+3];count++;}}const oidx=(y*w+x)*4;out[oidx]=r/count;out[oidx+1]=g/count;out[oidx+2]=b/count;out[oidx+3]=a/count;}}return new ImageData(out,w,h);}
function convolveSharpen_(imageData,amount){const w=imageData.width,h=imageData.height;const src=imageData.data;const out=new Uint8ClampedArray(src.length);const center=1+4*amount,side=-amount;const get=(nx,ny,c)=>{nx=Math.max(0,Math.min(w-1,nx));ny=Math.max(0,Math.min(h-1,ny));return src[(ny*w+nx)*4+c];};for(let y=0;y<h;y++){for(let x=0;x<w;x++){const idx=(y*w+x)*4;for(let c=0;c<3;c++){out[idx+c]=get(x,y,c)*center+get(x-1,y,c)*side+get(x+1,y,c)*side+get(x,y-1,c)*side+get(x,y+1,c)*side;}out[idx+3]=src[idx+3];}}return new ImageData(out,w,h);}
function localContrastPass_(imageData,amount){const w=imageData.width,h=imageData.height;const blurred=boxBlurPass_(imageData,2);const src=imageData.data,blur=blurred.data;const out=new Uint8ClampedArray(src.length);for(let i=0;i<src.length;i+=4){for(let c=0;c<3;c++){const diff=src[i+c]-blur[i+c];out[i+c]=src[i+c]+diff*amount*1.5;}out[i+3]=src[i+3];}return new ImageData(out,w,h);}
function approximateCssFromParams(p){const brightness=1+((p.exposure||0)+(p.brightness||0)*.5)/150;const contrast=1+(p.contrast||0)/130;const saturate=1+((p.saturation||0)+(p.vibrancy||0)*.6)/130;const hue=(p.warmth||0)*-.6;return `brightness(${brightness}) contrast(${contrast}) saturate(${saturate}) hue-rotate(${hue}deg)`;}
function drawCheapVignette(ctx,w,h,amount){const amt=Math.max(0,Math.min(100,amount))/100;if(amt<=0)return;const cx=w/2,cy=h/2,r=Math.sqrt(cx*cx+cy*cy);const grad=ctx.createRadialGradient(cx,cy,r*.5,cx,cy,r);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,`rgba(0,0,0,${amt*.65})`);ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);}
function applyManualFilter(ctx,w,h,filterStr){const ops=[];if(!filterStr||filterStr==='none')return;const re=/([a-z-]+)\(([^)]+)\)/g;let m;while((m=re.exec(filterStr))!==null){ops.push({name:m[1],val:parseFloat(m[2])});}if(!ops.length)return;const imgData=ctx.getImageData(0,0,w,h);const d=imgData.data;for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];ops.forEach(op=>{if(op.name==='brightness'){r*=op.val;g*=op.val;b*=op.val;}else if(op.name==='contrast'){r=(r-128)*op.val+128;g=(g-128)*op.val+128;b=(b-128)*op.val+128;}else if(op.name==='saturate'){const l=.2126*r+.7152*g+.0722*b;r=l+(r-l)*op.val;g=l+(g-l)*op.val;b=l+(b-l)*op.val;}else if(op.name==='sepia'){const a=op.val;const sr=.393*r+.769*g+.189*b;const sg=.349*r+.686*g+.168*b;const sb=.272*r+.534*g+.131*b;r=r+(sr-r)*a;g=g+(sg-g)*a;b=b+(sb-b)*a;}else if(op.name==='grayscale'){const l=.2126*r+.7152*g+.0722*b;r=r+(l-r)*op.val;g=g+(l-g)*op.val;b=b+(l-b)*op.val;}else if(op.name==='hue-rotate'){const rad=op.val*Math.PI/180;const cos=Math.cos(rad),sin=Math.sin(rad);const nr=r*(.213+cos*.787-sin*.213)+g*(.715-cos*.715-sin*.715)+b*(.072-cos*.072+sin*.928);const ng=r*(.213-cos*.213+sin*.143)+g*(.715+cos*.285+sin*.140)+b*(.072-cos*.072-sin*.283);const nb=r*(.213-cos*.213-sin*.787)+g*(.715-cos*.715+sin*.715)+b*(.072+cos*.928+sin*.072);r=nr;g=ng;b=nb;}});d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));}ctx.putImageData(imgData,0,0);}

const IS_LOW_END = (navigator.deviceMemory&&navigator.deviceMemory<=2)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4);

const MAX_TRIES = 5;

function sleepMs(ms){return new Promise(r=>setTimeout(r,ms));}
function xhrSend(method,url,body,headers,onProgress,timeoutMs,hooks){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();x.open(method,url);
    const toAppsScript=url.indexOf('script.google.com')!==-1;
    Object.keys(headers||{}).forEach(k=>{if(toAppsScript&&k.toLowerCase()==='content-type')return;x.setRequestHeader(k,headers[k]);});
    x.timeout=timeoutMs||90000;
    if(onProgress&&x.upload)x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total);};
    x.onload=()=>resolve({status:x.status,text:x.responseText});
    x.onerror=()=>reject(new Error('network'));
    x.ontimeout=()=>reject(new Error('timeout'));
    x.onabort=()=>reject(new Error('aborted'));
    if(hooks){hooks.abort=()=>{try{x.abort();}catch(e){}};if(hooks.onSent&&x.upload)x.upload.onload=hooks.onSent;}
    x.send(body);
  });
}
async function callServer(payload,onProgress,hooks){const r=await xhrSend('POST',APPS_SCRIPT_URL,JSON.stringify(payload),null,onProgress,120000,hooks);let data;try{data=JSON.parse(r.text);}catch(e){throw new Error('bad_response');}if(data&&data.busy){const er=new Error(data.message||'busy');er.busy=true;throw er;}return data;}
const typeSeq={};
function newClientId(){let hex='';try{const a=new Uint8Array(8);crypto.getRandomValues(a);hex=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}catch(e){hex=(Date.now().toString(16)+Math.random().toString(16).slice(2)).slice(0,16);}return 'm'+hex.slice(0,14);}

const PEND_KEY='pending_uploads';
function pendingAdd(job){try{const a=JSON.parse(localStorage.getItem(PEND_KEY)||'[]').filter(x=>x&&Date.now()-x.ts<30*60*1000);a.push({c:job.cid,w:weddingId,t:job.type,z:job.size,ts:Date.now()});localStorage.setItem(PEND_KEY,JSON.stringify(a.slice(-60)));}catch(e){}}
function pendingRemove(cid){try{localStorage.setItem(PEND_KEY,JSON.stringify(JSON.parse(localStorage.getItem(PEND_KEY)||'[]').filter(x=>x&&x.c!==cid)));}catch(e){}}
async function checkIds(ids,deep){try{const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),9000);const r=await fetch(`${APPS_SCRIPT_URL}?action=checkUpload&wedding_id=${encodeURIComponent(weddingId)}&client_ids=${ids.join(',')}${deep?'&deep=1':''}`,{signal:ctrl.signal});clearTimeout(to);const d=await r.json();return d&&d.success?(d.found||{}):{};}catch(e){return{};}}
function startConfirmPolling(job,onFound){let stopped=false,delay=5000;const tick=async()=>{if(stopped)return;const f=(await checkIds([job.cid],false))[job.cid];if(stopped)return;if(f){stopped=true;onFound(f);return;}delay=Math.min(15000,Math.round(delay*1.4));setTimeout(tick,delay);};setTimeout(tick,5000);return()=>{stopped=true;};}
function markRecovered(job,info){if(job.state!=='failed')return;job.state='done';job.progress=1;job.blob=null;job.thumb=null;sessionStats.fail--;sessionStats.ok++;sessionStats.types[job.type]=(sessionStats.types[job.type]||0)+1;if(info&&info.status==='approved')sessionStats.live++;pendingRemove(job.cid);}
async function recoverFailed(){const fl=uploadJobs.filter(j=>j.state==='failed'&&j.cid);if(!fl.length)return;const found=await checkIds(fl.map(j=>j.cid),true);let any=false;fl.forEach(j=>{if(found[j.cid]){markRecovered(j,found[j.cid]);any=true;}});if(any){modalShownFor=0;renderPill();maybeShowResult();}}
setInterval(recoverFailed,10000);
window.addEventListener('online',()=>setTimeout(recoverFailed,800));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)recoverFailed();});
setInterval(()=>{if(uploadJobs.some(j=>j.state==='uploading'||j.state==='retrying'))renderPill();},2000);

function enqueueUpload(job){job.state='queued';job.tries=0;job.progress=0;job.id=Date.now()+Math.random();job.cid=newClientId();job.fileId=null;job.finTries=0;job.size=job.blob?job.blob.size:0;job.seq=(typeSeq[job.type]=(typeSeq[job.type]||0)+1);pendingAdd(job);job.preview=(typeof job.thumb==='string'&&job.thumb.indexOf('data:image')===0)?job.thumb:'';uploadJobs.push(job);sessionStats.pending++;renderPill();pumpUploads();}
function pumpUploads(){while(activeUploads<MAX_PARALLEL_UPLOADS){const job=uploadJobs.find(j=>j.state==='queued');if(!job)break;activeUploads++;job.state='uploading';runJob(job).finally(()=>{if(!job.slotFreed)activeUploads--;job.slotFreed=false;pumpUploads();renderPill();maybeShowResult();});}}
async function runJob(job){while(job.tries<MAX_TRIES){job.tries++;try{if(!navigator.onLine)await waitOnline();const res=await uploadOnce(job);job.state='done';job.progress=1;sessionStats.ok++;sessionStats.pending--;sessionStats.types[job.type]=(sessionStats.types[job.type]||0)+1;if(res&&res.status==='approved')sessionStats.live++;if(res&&res.message)sessionStats.lastMessage=res.message;job.blob=null;job.thumb=null;pendingRemove(job.cid);return;}catch(e){if(e.fatal){job.state='failed';job.error=e.message;sessionStats.fail++;sessionStats.pending--;pendingRemove(job.cid);return;}if(job.tries>=MAX_TRIES)break;job.suspect=true;job.busy=!!e.busy;job.state='retrying';renderPill();await sleepMs(600*job.tries+Math.floor(Math.random()*400)+(e.busy?1500+Math.floor(Math.random()*2500):0));job.state='uploading';}}job.state='failed';job.error=job.error||'network';sessionStats.fail++;sessionStats.pending--;}
function waitOnline(){return new Promise(res=>{const f=()=>{window.removeEventListener('online',f);res();};window.addEventListener('online',f);});}
function fatalError(msg){const e=new Error(msg);e.fatal=true;return e;}
async function uploadOnce(job){
  const base={wedding_id:weddingId,guest_name:job.guest,media_type:job.type,caption:job.caption||'',client_id:job.cid,attempt:(job.tries>1||job.suspect)?2:1};
  const setP=p=>{if(p!==job.progress)job.lastProgAt=Date.now();job.progress=p;renderPill();};
  job.phase='sending';job.lastProgAt=Date.now();
  if(job.tries>1||job.suspect){const f=(await checkIds([job.cid],job.tries>=3))[job.cid];if(f)return{success:true,status:f.status,duplicate:true,message:''};}
  if(!job.noDirect){
    try{
      if(!job.fileId){
        const init=await callServer(Object.assign({},base,{action:'initUpload',mime_type:job.mime,size:job.blob.size,origin:location.origin}));
        if(!init.success){if(init.code==='type_off')throw fatalError(init.message);if(!init.fallback&&init.busy!==true)throw fatalError(init.message||'Gagal menyiapkan pengiriman');throw new Error('direct_unavailable');}
        const put=await xhrSend('PUT',init.upload_url,job.blob,{'Content-Type':job.mime},p=>setP(p*.9),300000);
        if(put.status<200||put.status>299)throw new Error('direct_failed');
        job.fileId=JSON.parse(put.text).id;
      }
      setP(.92);
      const fin=await callServer(Object.assign({},base,{action:'finalizeUpload',file_id:job.fileId,thumb_data:job.thumb||''}));
      if(!fin.success){if(fin.code==='type_off')throw fatalError(fin.message);throw new Error(fin.message||'finalize_failed');}
      return fin;
    }catch(e){
      if(e.fatal||e.busy)throw e;
      job.suspect=true;base.attempt=2;
      if(job.fileId&&++job.finTries<3)throw e;
      job.fileId=null;job.noDirect=true;job.progress=0;
    }
  }
  const b64=await blobToBase64(job.blob);
  let found=null,stopPoll=()=>{};
  const hooks={onSent:()=>{job.phase='saving';setP(.99);if(!job.slotFreed){job.slotFreed=true;activeUploads--;pumpUploads();}stopPoll=startConfirmPolling(job,f=>{found=f;if(hooks.abort)hooks.abort();});}};
  let res;
  try{res=await callServer(Object.assign({},base,{action:'uploadMedia',filename:'capture.'+job.ext,mime_type:job.mime,data:b64,thumb_data:job.thumb||''}),p=>{if(job.phase==='sending')setP(p*.99);},hooks);}
  catch(e){stopPoll();if(found)return{success:true,status:found.status,duplicate:true,message:''};throw e;}
  stopPoll();
  if(!res.success){if(res.code==='type_off')throw fatalError(res.message);throw new Error(res.message||'upload_failed');}
  return res;
}

let paintQueued=false;
function renderPill(){if(paintQueued)return;paintQueued=true;requestAnimationFrame(()=>{paintQueued=false;paintUpload();});}
function fmtPair(l,t){if(t>=1048576){const f=n=>(n/1048576).toFixed(1).replace('.',',');return`${f(l)} / ${f(t)} MB`;}const k=n=>Math.round(n/1024);return`${Math.min(k(l),k(t))} / ${Math.max(1,k(t))} KB`;}
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function paintUpload(){
  const pending=uploadJobs.filter(j=>j.state!=='done');
  const active=pending.filter(j=>j.state!=='failed');
  const failed=pending.length-active.length;
  const totalB=uploadJobs.reduce((s,j)=>s+(j.size||1),0)||1;
  const loadB=uploadJobs.reduce((s,j)=>s+(j.state==='done'?(j.size||1):(j.state==='failed'?0:(j.progress||0)*(j.size||1))),0);
  const frac=Math.max(0,Math.min(1,loadB/totalB));
  const warn=active.length===0&&failed>0;
  document.querySelectorAll('.up-btn').forEach(b=>{
    b.classList.toggle('show',pending.length>0);
    b.classList.toggle('warn',warn);
    b.querySelector('.ring-fg').style.strokeDashoffset=warn?0:String(125.66*(1-frac));
    b.querySelector('.badge').textContent=warn?'!':String(active.length);
    b.setAttribute('aria-label',warn?`${failed} momen belum terkirim. Ketuk untuk melihat`:`Mengirim ${active.length} momen. Ketuk untuk melihat progres`);
  });
  if(queueOpen())paintQueue();
}

function paintQueue(){
  const list=document.getElementById('queueList');
  uploadJobs.forEach(j=>{
    let r=rowEls.get(j.id);
    if(!r){
      const el=document.createElement('div');el.className='q-row';
      el.innerHTML='<div class="q-thumb"></div><div class="q-main"><div class="q-top"><b></b><span class="q-state"></span></div><div class="q-bar"><i></i></div><div class="q-bytes"></div></div><div class="q-check">'+CHECK_SVG+'</div>';
      const th=el.querySelector('.q-thumb');
      if(j.preview){const im=document.createElement('img');im.alt='';im.src=j.preview;th.appendChild(im);}else th.innerHTML=MIC_SVG;
      el.querySelector('b').textContent=`${LABEL[j.type]||'Momen'} ${j.seq}`;
      list.appendChild(el);
      r={el,bar:el.querySelector('.q-bar i'),state:el.querySelector('.q-state'),bytes:el.querySelector('.q-bytes')};
      rowEls.set(j.id,r);
    }
    const size=j.size||0,loaded=j.state==='done'?size:Math.round((j.progress||0)*size);
    let cls='q-row',st='',by='';
    if(j.state==='done'){cls+=' done';st='Terkirim';by=fmtSize(size);}
    else if(j.state==='failed'){cls+=' failed';st='Belum terkirim';by=`${fmtSize(size)} · aman di HP, bisa dikirim ulang`;}
    else if(j.state==='retrying'){cls+=' retrying';st=j.busy?'Antre, coba lagi…':'Sinyal lemah, coba lagi…';by=fmtPair(loaded,size);}
    else if(j.state==='queued'){st='Menunggu giliran';by=`0 / ${fmtSize(size)}`;}
    else if(j.phase==='saving'){st='Menyimpan di album…';by=fmtPair(size,size);}
    else if(Date.now()-(j.lastProgAt||0)>10000){cls+=' retrying';st='Sinyal lemah, masih mencoba…';by=fmtPair(loaded,size);}
    else{st='Mengirim…';by=fmtPair(loaded,size);}
    if(r.el.className!==cls)r.el.className=cls;
    r.state.textContent=st;r.bytes.textContent=by;
    r.bar.style.width=(j.state==='done'?100:(size?Math.round(loaded/size*100):0))+'%';
  });
  const done=uploadJobs.filter(j=>j.state==='done').length,failed=uploadJobs.filter(j=>j.state==='failed').length,total=uploadJobs.length;
  document.getElementById('queueSub').textContent=
    done===total?`Semua ${total} momen sudah terkirim. Terima kasih!`:
    failed&&done+failed===total?`${done} terkirim, ${failed} belum. Sinyal sepertinya kurang bagus.`:
    `${done} dari ${total} terkirim. Kamu boleh lanjut memotret, pengiriman jalan terus.`;
  document.getElementById('queueRetry').style.display=failed?'block':'none';
}
function retryFailed(){
  uploadJobs.filter(j=>j.state==='failed').forEach(j=>{j.state='queued';j.tries=0;j.finTries=0;j.noDirect=false;j.progress=0;sessionStats.fail--;sessionStats.pending++;});
  closeResultModal();modalShownFor=0;renderPill();pumpUploads();
}

function maybeShowResult(){
  const busy=uploadJobs.some(j=>j.state==='queued'||j.state==='uploading'||j.state==='retrying');
  if(busy||uploadJobs.length===0)return;
  if(modalShownFor===uploadJobs.length)return;
  modalShownFor=uploadJobs.length;
  const ok=uploadJobs.filter(j=>j.state==='done').length;
  const failed=uploadJobs.filter(j=>j.state==='failed');
  const fatalMsg=failed.find(j=>j.error&&j.error!=='network'&&j.error!=='upload_failed');
  const labels={photo:'foto',video:'video',voice:'voice note'};
  const parts=Object.keys(sessionStats.types).map(t=>`${sessionStats.types[t]} ${labels[t]}`);
  if(failed.length===0){
    const live=sessionStats.live>=ok;
    openResultModal({kind:'success',title:'Terkirim',
      text:`Terima kasih sudah ikut mengabadikan momen.\n${parts.join(' & ')} kamu `+(live?'sudah tampil di album.':'sedang menunggu persetujuan mempelai. Setelah disetujui, otomatis tampil di album.'),
      primary:{label:'Lihat Album',href:document.getElementById('toAlbumLink').href},
      secondary:{label:'Kirim Lagi',fn:closeResultModal}});
  }else if(ok>0){
    openResultModal({kind:'warn',title:'Sebagian sudah terkirim',
      text:`${ok} berhasil, ${failed.length} belum.\nYang belum terkirim masih aman di HP-mu — coba kirim lagi ya.`,
      primary:{label:'Kirim Ulang',fn:retryFailed},secondary:{label:'Nanti Saja',fn:closeResultModal}});
  }else{
    openResultModal({kind:'error',title:fatalMsg?'Pengiriman ditutup':'Belum berhasil terkirim',
      text:fatalMsg?fatalMsg.error:'Sinyal sepertinya kurang stabil.\nMomenmu masih aman di HP. Kami tetap mengecek otomatis; kalau ternyata sudah masuk, kamu akan dikabari.',
      primary:fatalMsg?{label:'Mengerti',fn:closeResultModal}:{label:'Coba Lagi',fn:retryFailed},
      secondary:fatalMsg?null:{label:'Nanti Saja',fn:closeResultModal}});
  }
}

function makeThumbDataUri(source,sw,sh){
  const scale=Math.min(1,360/Math.max(sw,1));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));
  c.getContext('2d').drawImage(source,0,0,c.width,c.height);
  let q=.62,uri=c.toDataURL('image/jpeg',q);
  while(uri.length>42000&&q>.2){q-=.1;uri=c.toDataURL('image/jpeg',q);}
  c.width=c.height=1;
  return uri.length<=42000?uri:'';
}

async function bootCamera(){
  const p=startCamera();
  const result=await Promise.race([p,new Promise(r=>setTimeout(()=>r('timeout'),10000))]);
  if(result===true)hideStatus();
  else if(result==='timeout'){
    camStatus('Kamera Lama Dimuat',CAM_SLOW_TEXT);
    p.then(ok=>{if(ok===true&&document.getElementById('statusTitle').textContent==='Kamera Lama Dimuat')hideStatus();});
  }
  return result;
}
function retryCamera(){
  showStatus('Menyiapkan kamera…','Sebentar ya, kami siapkan semuanya untukmu',false);
  return bootCamera();
}
function isRecordingNow(){return !!((mediaRecorder&&mediaRecorder.state==='recording')||(vnRecorder&&vnRecorder.state==='recording'));}
function onTabHide(){
  tabActive=false;
  if(isRecordingNow())return;                 // sedang merekam: jangan putuskan kamera
  clearTimeout(camReleaseTimer);
  camReleaseTimer=setTimeout(()=>{if(!tabActive&&!isRecordingNow())stopCameraStream();},20000);
}
function onTabShow(){
  tabActive=true;clearTimeout(camReleaseTimer);
  if(!weddingSettings)return;                 // pengaturan belum siap: init() yang menyalakan kamera
  if(currentMode==='voice'||capturedBlob)return;
  const tracks=liveStream?liveStream.getVideoTracks():[];
  const alive=tracks.length>0&&tracks.some(t=>t.readyState==='live')&&!tracks.some(t=>t.muted);
  if(alive){try{liveVideo.play().catch(()=>{});}catch(e){}return;}   // kamera masih hidup: langsung siap
  retryCamera();
}
window.addEventListener('message',e=>{

async function handleReturnToPage(){
  if(capturedBlob)return;
  if(currentMode==='voice')return;
  const statusEl=document.getElementById('statusScreen');
  const statusVisible=statusEl.style.display!=='none';
  const statusTitle=(document.getElementById('statusTitle').textContent||'');
  const stillLoading=statusVisible&&(statusTitle.indexOf('Menyiapkan')!==-1||statusTitle.indexOf('Memuat')!==-1);
  if(stillLoading){const ok=await startCamera();if(ok)hideStatus();return;}
  const tracks=liveStream?liveStream.getVideoTracks():[];
  const alive=tracks.some(t=>t.readyState==='live');
  if(!alive)startCamera();
}

async function fetchJson(qs,tries=2,timeoutMs=10000){
  let last;
  for(let i=0;i<tries;i++){
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),timeoutMs);
    try{
      const res=await fetch(`${APPS_SCRIPT_URL}?${qs}`,{signal:ctrl.signal});
      const d=await res.json();clearTimeout(to);
      if(d&&d.busy&&i<tries-1){await sleepMs(400*(i+1));continue;}
      return d;
    }catch(e){clearTimeout(to);last=e;await sleepMs(300*(i+1));}
  }
  throw last||new Error('offline');
}

function applyFilters(filterData){

  const list=filterData.filters||[];
  const find=id=>id?list.find(f=>String(f.filter_id)===String(id)):null;
  const parse=m=>{try{return m&&m.params?JSON.parse(m.params):null;}catch(e){return null;}};
  const pm=find(filterData.active_filter_id);                 // filter kamera foto
  const vm=find(filterData.active_video_filter_id)||pm;       // filter video (kalau belum diatur: ikut filter foto)

  activeFilterCss=pm?(pm.css_filter||'none'):'none';
  activeVideoCss=vm?(vm.css_filter||'none'):'none';
  let photoP=null,videoP=null;
  const rp=parse(pm);
  if(rp){if(rp.photo||rp.video){photoP=rp.photo||{};}else{photoP=rp;}}
  const rv=parse(vm);
  if(rv){if(rv.photo||rv.video){videoP=rv.video||{};}else{videoP=rv;}}
  activeFilterParams=(photoP||videoP)?{photo:photoP||{},video:videoP||{}}:null;
  try{
    if(liveVideo&&liveStream){liveVideo.style.filter=liveFilterCss(currentMode==='video'?'video':'photo');}

}

  if(currentMode==='voice'||!tabActive){hideStatus();}   // tab di latar belakang: kamera dinyalakan saat tab dibuka

  }).catch(()=>{});

}

// v18: bingkai custom disimpan di Cache Storage (tidak diunduh ulang tiap tab) + 4x percobaan.
async function fetchFrameBlob(fileId){
  const url=`${APPS_SCRIPT_URL}?action=getMediaFile&file_id=${encodeURIComponent(fileId)}`;
  let store=null;
  try{store=window.caches?await caches.open('frames-v1'):null;}catch(e){}
  if(store){try{const hit=await store.match(url);if(hit)return await hit.blob();}catch(e){}}
  let last;
  for(let i=0;i<4;i++){
    try{
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
      const res=await fetch(url,{signal:ctrl.signal});const data=await res.json();clearTimeout(to);
      if(data&&data.success){
        const bin=atob(data.base64),bytes=new Uint8Array(bin.length);
        for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);
        const blob=new Blob([bytes],{type:data.mimeType||'image/png'});
        if(store){try{await store.put(url,new Response(blob,{headers:{'content-type':blob.type}}));}catch(e){}}
        return blob;
      }
      last=new Error((data&&data.message)||'Gagal memuat template bingkai');
    }catch(e){last=e;}
    await sleepMs(600*(i+1)+Math.floor(Math.random()*400));
  }
  throw last||new Error('frame');
}
async function loadFrameImageBase64(fileId){
  const blob=await fetchFrameBlob(fileId);
  const blobUrl=URL.createObjectURL(blob);
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(blobUrl);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(blobUrl);reject(new Error('decode'));};
    img.src=blobUrl;
  });
}
const frameLoad={},frameLoadedId={};
function syncFrameSettings(settings){
  const ui=(settings&&settings.ui_config)||{};
  autoIncludeFrame=Object.assign({photo:false,video:false,voice:false},ui.frame_auto_include||{});
  ['photo','video','voice'].forEach(t=>{if(autoIncludeFrame[t])frameConfigCache[t]=getFrameConfig(t);});
}
function frameCustomId(type){const c=frameConfigCache[type];return c&&c.customFrame?c.customFrame.file_id:null;}
function frameMissing(type){
  if(!autoIncludeFrame[type])return false;
  const id=frameCustomId(type);
  return !!id&&!(customFrameImgCache[type]&&frameLoadedId[type]===id);
}
function startFrameLoad(type){
  const id=frameCustomId(type);
  frameLoadedId[type]=null;
  frameLoad[type]=loadFrameImageBase64(id).then(img=>{customFrameImgCache[type]=img;frameLoadedId[type]=id;return true;}).catch(()=>{customFrameImgCache[type]=null;return false;});
  return frameLoad[type];
}
async function ensureFrame(type){
  if(!frameMissing(type))return true;
  if(!frameLoad[type])startFrameLoad(type);
  await frameLoad[type];
  if(frameMissing(type))await startFrameLoad(type);
  return !frameMissing(type);
}
async function guardFrame(type){
  if(!frameMissing(type))return true;
  showToast('Bingkai lagi disiapkan, tunggu sebentar ya','success');
  const ok=await ensureFrame(type);
  if(!ok)showToast('Bingkai belum bisa dimuat. Periksa sinyal lalu coba lagi ya','error');
  return ok;
}
function preloadFrameAssets(settings){
  syncFrameSettings(settings);
  const jobs=[];
  ['photo','video','voice'].forEach(t=>{if(frameMissing(t)&&!frameLoad[t])jobs.push(startFrameLoad(t));});
  return Promise.all(jobs);
}
function fillCenterShape(ctx,cx,cy,radius,cfg){
  const shape=cfg.voiceCenterShape||'circle';ctx.fillStyle=cfg.voiceCenterColor;
  if(shape==='square'){const size=radius*1.7;const round=Math.min(size/2,((cfg.voiceCenterRound!=null?cfg.voiceCenterRound:20)/100)*(size/2));ctx.beginPath();if(ctx.roundRect){ctx.roundRect(cx-size/2,cy-size/2,size,size,round);}else{ctx.rect(cx-size/2,cy-size/2,size,size);}ctx.fill();}
  else if(shape==='heart'){const s=radius/60;ctx.beginPath();ctx.moveTo(cx,cy+35*s);ctx.bezierCurveTo(cx-70*s,cy-30*s,cx-25*s,cy-70*s,cx,cy-30*s);ctx.bezierCurveTo(cx+25*s,cy-70*s,cx+70*s,cy-30*s,cx,cy+35*s);ctx.closePath();ctx.fill();}
  else{ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.fill();}
}
function drawAudiogramLive(ctx,w,h,dataArray,cfg,guestName){
  const cx=w/2,cy=h/2;const shape=cfg.voiceShape||'radial';const font=cfg.voiceFont||'Plus Jakarta Sans';const scale=Math.min(w,h)/720;
  if(shape==='bars'){const barCount=32,barW=(w*.7)/barCount,startX=w*.15,baseY=cy+130*scale;ctx.fillStyle=cfg.voiceBarColor;for(let i=0;i<barCount;i++){const value=dataArray[i%dataArray.length]/255;const barH=(10+value*(h*.2/scale))*scale;ctx.fillRect(startX+i*barW,baseY-barH,barW*.7,barH);}fillCenterShape(ctx,cx,cy,90*scale,cfg);}
  else if(shape==='pulse'){let avg=0;for(let i=0;i<dataArray.length;i++)avg+=dataArray[i];avg=avg/dataArray.length/255;const radius=(100+avg*40)*scale;ctx.fillStyle=cfg.voiceBarColor;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(cx,cy,radius+20*scale,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;fillCenterShape(ctx,cx,cy,radius,cfg);}
  else{const radius=140*scale,bars=48;ctx.strokeStyle=cfg.voiceBarColor;ctx.lineWidth=5*scale;for(let i=0;i<bars;i++){const value=dataArray[i%dataArray.length]/255;const angle=(i/bars)*Math.PI*2;const barLen=(20+value*90)*scale;const x1=cx+Math.cos(angle)*radius,y1=cy+Math.sin(angle)*radius;const x2=cx+Math.cos(angle)*(radius+barLen),y2=cy+Math.sin(angle)*(radius+barLen);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}fillCenterShape(ctx,cx,cy,radius-10*scale,cfg);}
  ctx.fillStyle=cfg.voiceBarColor;ctx.font=`600 ${Math.round(24*scale)}px "${font}", "Plus Jakarta Sans", sans-serif`;ctx.textAlign='center';ctx.fillText(cfg.voiceLabel,cx,cy-8*scale);
  ctx.font=`400 ${Math.round(14*scale)}px "JetBrains Mono", monospace`;ctx.fillText(guestName,cx,cy+20*scale);
}
function drawFrameForMedia(ctx,frameImg,w,h){
  if(!frameImg)return;
  const fw=frameImg.naturalWidth||frameImg.width;const fh=frameImg.naturalHeight||frameImg.height;
  if(!fw||!fh)return;
  const mediaLandscape=w>h;const frameLandscape=fw>fh;const frameSquare=fw===fh;
  if(!frameSquare&&mediaLandscape!==frameLandscape){ctx.save();ctx.translate(w/2,h/2);ctx.rotate(Math.PI/2);ctx.drawImage(frameImg,-h/2,-w/2,h,w);ctx.restore();}
  else{ctx.drawImage(frameImg,0,0,w,h);}
}
function drawCaptureFrameOverlay(ctx,w,h,type){const cfg=frameConfigCache[type];if(!cfg)return;const customImg=customFrameImgCache[type];if(customImg){drawFrameForMedia(ctx,customImg,w,h);return;}drawFrameBar(ctx,w,h,cfg);}
function drawFrameBar(ctx,w,h,cfg){

  else if(cfg.style==='floral-simple'){ctx.fillStyle=cfg.primary;ctx.fillRect(0,h-barH,w,barH);ctx.strokeStyle=cfg.secondary;ctx.globalAlpha=.6;ctx.lineWidth=Math.max(3,w*.005);const step=Math.max(10,w*.03);[[10,10,1,1],[w-10,10,-1,1],[10,h-barH-10,1,-1],[w-10,h-barH-10,-1,-1]].forEach(([x,y,sx,sy])=>{for(let k=1;k<=4;k++){ctx.beginPath();ctx.moveTo(x+sx*step*(k-1),y+sy*step*k);ctx.lineTo(x+sx*step*k,y+sy*step*(k-1));ctx.stroke();}});ctx.globalAlpha=1;}
  else{ctx.fillStyle=cfg.primary;ctx.fillRect(0,h-barH,w,barH);ctx.strokeStyle=cfg.secondary;ctx.lineWidth=Math.max(2,w*.0025);const pad=w*.02;ctx.strokeRect(pad,pad,w-pad*2,h-pad*2-barH*.15);}

let swipeHintScheduled=false;
function swipeHint(){
  if(swipeHintScheduled)return;
  try{
    if(!(('ontouchstart' in window)||navigator.maxTouchPoints>0))return;
    if(localStorage.getItem('swipe_hint_v1'))return;
    swipeHintScheduled=true;
    setTimeout(()=>{try{localStorage.setItem('swipe_hint_v1','1');}catch(e){}showToast('Tips: geser layar ke kiri atau kanan untuk ganti Foto, Video, dan Suara','success');},2500);
  }catch(e){}
}
function visibleModes(){return Array.from(document.querySelectorAll('#modeSwitch button')).filter(b=>b.style.display!=='none').map(b=>b.dataset.mode);}
function swipeBlocked(){
  if(document.querySelector('.result-overlay.show,.pvfull.show'))return true;
  if((mediaRecorder&&mediaRecorder.state==='recording')||(vnRecorder&&vnRecorder.state==='recording'))return true;
  if(capturedBlob)return true;
  if(getComputedStyle(document.getElementById('statusScreen')).display!=='none')return true;
  return false;
}
(function(){
  let sx=0,sy=0,st=0,track=false;
  const root=document.getElementById('app');
  root.addEventListener('touchstart',e=>{
    track=false;if(e.touches.length!==1)return;
    if(e.target.closest&&e.target.closest('input,button,audio,#filmstrip,.pvfull,.result-overlay'))return;
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();track=true;
  },{passive:true});
  root.addEventListener('touchend',e=>{
    if(!track)return;track=false;
    const t=e.changedTouches[0];if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st>700||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6)return;
    if(swipeBlocked())return;
    const modes=visibleModes();if(modes.length<2)return;
    const n=modes.indexOf(currentMode)+(dx<0?1:-1);
    if(n<0||n>=modes.length)return;
    switchMode(modes[n]);
  },{passive:true});
})();

let cameraToken=0;
async function startCamera(isRetry){
  const myToken=++cameraToken;
  try{
    stopCameraStream();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showStatus('Browser Tidak Mendukung','Coba browser lain seperti Chrome atau Safari terbaru ya.',true);return false;}
    const needsAudio=currentMode==='video';
    if(await queryPermState('camera')==='denied'){showPermissionHelp(needsAudio?'both':'camera');return false;}
    if(needsAudio&&await queryPermState('microphone')==='denied'){showPermissionHelp('both');return false;}
    const q=getQuality(currentMode==='video'?'video':'photo');
    const wIdeal=isRetry?Math.min(640,q.width):q.width;
    const hIdeal=isRetry?Math.min(480,q.height):q.height;
    let stream;
    try{
      stream=await Promise.race([
        navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:currentFacing},width:{ideal:wIdeal},height:{ideal:hIdeal}},audio:needsAudio?{echoCancellation:true,noiseSuppression:true}:false}),
        new Promise((_,reject)=>setTimeout(()=>reject(new Error('__gum_timeout__')),12000))
      ]);
    }catch(permErr){
      if(myToken!==cameraToken)return false;
      const msg=String(permErr&&permErr.message||'');
      if(msg==='__gum_timeout__'){if(!isRetry){await sleepMs(1200);return startCamera(true);}camStatus('Kamera Tidak Merespon',CAM_SLOW_TEXT);return false;}
      if(/NotAllowed|Permission|denied/i.test(msg)){showPermissionHelp(needsAudio?'both':'camera');return false;}
      if(/NotReadable|Could not start|TrackStart|In use/i.test(msg)&&!isRetry){await sleepMs(1500);return startCamera(true);}
      throw permErr;
    }
    if(myToken!==cameraToken){stream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});return true;}
    liveStream=stream;
    streamHasAudio=stream.getAudioTracks().length>0;
    liveVideo.muted=true;
    liveVideo.srcObject=stream;
    try{
      liveVideo.style.filter=liveFilterCss(currentMode==='video'?'video':'photo');
      liveVideo.classList.toggle('mirrored',currentFacing==='user');
    }catch(e){}
    try{
      const playP=liveVideo.play();
      if(playP&&playP.then){
        await Promise.race([
          playP.catch(()=>{const retryPlay=()=>{try{liveVideo.play().catch(()=>{});}catch(e){}};document.addEventListener('click',retryPlay,{once:true,passive:true});document.addEventListener('touchstart',retryPlay,{once:true,passive:true});}),
          new Promise(resolve=>setTimeout(resolve,1500))
        ]);
      }
    }catch(e){}
    if(!liveVideo.videoWidth){
      await new Promise(resolve=>{let done=false;const finish=()=>{if(!done){done=true;liveVideo.removeEventListener('loadedmetadata',finish);resolve();}};liveVideo.addEventListener('loadedmetadata',finish);setTimeout(finish,2000);});
    }
    if(!liveVideo.videoWidth&&!isRetry&&myToken===cameraToken){await sleepMs(400);return startCamera(true);}
    return true;
  }catch(err){
    if(myToken!==cameraToken)return false;
    const msg=String(err&&err.message||'');
    let title='Kamera Belum Bisa Dibuka';
    let body='Kami perlu izin kamera supaya kamu bisa mengabadikan momen. Cek pengaturan browser lalu coba lagi ya.';
    if(/NotAllowed|Permission|denied/i.test(msg)){title='Izin Kamera Belum Diberikan';body='Aktifkan izin kamera di pengaturan browser (ikon gembok di address bar), lalu muat ulang halaman ini.';}
    else if(/NotFound|NotReadable|DevicesNotFound/i.test(msg)){title='Kamera Tidak Terdeteksi';body='Pastikan kamera tidak sedang dipakai aplikasi lain, lalu tekan Coba Lagi.';}
    else if(/NotSupported|Overconstrained/i.test(msg)){title='Kamera Tidak Mendukung';body='Browser kamu belum bisa memakai kamera di halaman ini. Coba buka di Chrome atau Safari terbaru ya.';}
    camStatus(title,body+' Atau kirim foto dan video dari galeri HP-mu dulu.');
    return false;
  }
}
function stopCameraStream(){
  if(liveStream){liveStream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});liveStream=null;}
  try{if(liveVideo&&liveVideo.srcObject)liveVideo.srcObject=null;}catch(e){}
}

let shotsInFlight=0;
function takePhoto(){
  if(photoShots.length+shotsInFlight>=MAX_SHOTS)return;
  if(frameMissing('photo')){guardFrame('photo');return;}   // jangan memotret tanpa bingkai diam-diam
  const vw0=liveVideo.videoWidth,vh0=liveVideo.videoHeight;
  if(!vw0){showToast('Kamera belum siap, tunggu sebentar ya','error');return;}
  const q=getQuality('photo');
  const sc=Math.min(1,Math.max(q.width,q.height)/Math.max(vw0,vh0));
  const vw=Math.round(vw0*sc),vh=Math.round(vh0*sc);
  shotsInFlight++;
  photoCanvas.width=vw;photoCanvas.height=vh;
  const ctx=photoCanvas.getContext('2d');
  drawWithGuaranteedFilter(ctx,()=>{
    if(currentFacing==='user'){ctx.save();ctx.translate(vw,0);ctx.scale(-1,1);}
    ctx.drawImage(liveVideo,0,0,vw,vh);
    if(currentFacing==='user')ctx.restore();
  },vw,vh,false);
  if(autoIncludeFrame.photo)drawCaptureFrameOverlay(ctx,vw,vh,'photo');
  const thumb=makeThumbDataUri(photoCanvas,vw,vh);
  photoCanvas.toBlob(blob=>{
    shotsInFlight--;
    photoCanvas.width=1;photoCanvas.height=1;
    if(!blob){showToast('Foto belum berhasil diambil, coba lagi ya','error');return;}
    photoShots.push({blob,url:thumb,thumb});
    renderFilmstrip();
    if(navigator.vibrate){try{navigator.vibrate(15);}catch(e){}}
    if(photoShots.length>=MAX_SHOTS){shutterBtn.disabled=true;showToast(`Sudah ${MAX_SHOTS} foto, batas maksimal. Tekan "Kirim Foto" ya.`,'success');}
    document.getElementById('finishRow').style.display='flex';
  },'image/jpeg',q.jpegQuality);
}
function renderFilmstrip(){
  const strip=document.getElementById('filmstrip');
  strip.innerHTML='';
  const previewBtn=document.getElementById('previewBtn');
  if(photoShots.length===0){strip.style.display='none';if(previewBtn)previewBtn.style.display='none';return;}
  strip.style.display='flex';
  photoShots.forEach((shot,idx)=>{
    const div=document.createElement('div');
    div.className='shot-thumb';
    div.innerHTML=`<img src="${shot.url}"><button class="remove-shot" onclick="removeShot(${idx})">✕</button>`;
    strip.appendChild(div);
  });
  const counter=document.createElement('div');
  counter.className='shot-counter';
  counter.textContent=`${photoShots.length}/${MAX_SHOTS}`;
  strip.appendChild(counter);
  if(previewBtn)previewBtn.style.display='flex';
}
let pvImages=[];let pvIdx=0;let pvObjectUrls=[];
function trackPvUrl(url){if(url&&url.indexOf('blob:')===0)pvObjectUrls.push(url);return url;}
function revokePvUrls(){pvObjectUrls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});pvObjectUrls=[];}
function buildFullPreviewUrl(item){
  return new Promise(resolve=>{
    if(autoIncludeFrame.photo){resolve(trackPvUrl(URL.createObjectURL(item.blob)));return;}
    const srcUrl=URL.createObjectURL(item.blob);
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
        try{drawCaptureFrameOverlay(ctx,c.width,c.height,'photo');}catch(e){}
        c.toBlob(b=>{URL.revokeObjectURL(srcUrl);resolve(trackPvUrl(URL.createObjectURL(b||item.blob)));},'image/jpeg',.92);
      }catch(e){URL.revokeObjectURL(srcUrl);resolve(trackPvUrl(URL.createObjectURL(item.blob)));}
    };
    img.onerror=()=>{URL.revokeObjectURL(srcUrl);resolve(trackPvUrl(URL.createObjectURL(item.blob)));};
    img.src=srcUrl;
  });
}
async function openPhotoPreview(){

function openPvFull(idx){if(!pvImages.length)return;pvIdx=Math.max(0,Math.min(pvImages.length-1,idx|0));document.getElementById('pvFull').classList.add('show');showPvFull();}

function closePvFull(){document.getElementById('pvFull').classList.remove('show');const img=document.getElementById('pvFullImg');img.onload=null;img.src='';pvIdx=0;revokePvUrls();pvImages=[];}
function stepPvFull(dir){const n=pvIdx+dir;if(n<0||n>=pvImages.length)return;pvIdx=n;showPvFull();}
function deleteFromPvFull(){if(pvIdx<0||pvIdx>=photoShots.length)return;showConfirmDialog({title:'Hapus Foto Ini?',text:'Foto yang dihapus tidak akan bisa dikembalikan. Kamu masih bisa mengambil foto baru.',confirmLabel:'Hapus Foto',cancelLabel:'Batal'},doDeleteFromPvFull);}
function doDeleteFromPvFull(){
  if(pvIdx<0||pvIdx>=photoShots.length)return;
  try{URL.revokeObjectURL(pvImages[pvIdx]);}catch(e){}
  try{URL.revokeObjectURL(photoShots[pvIdx].url);}catch(e){}
  photoShots.splice(pvIdx,1);pvImages.splice(pvIdx,1);
  shutterBtn.disabled=false;renderFilmstrip();
  if(photoShots.length===0){closePvFull();document.getElementById('finishRow').style.display='none';return;}

  const el=document.getElementById('pvFull');let x0=0,y0=0;

function captureVideoThumbnail(){
  return new Promise(resolve=>{
    try{
      const vw=liveVideo.videoWidth||640,vh=liveVideo.videoHeight||480;
      const scale=Math.min(1,360/vw);
      const tCanvas=document.createElement('canvas');tCanvas.width=Math.round(vw*scale);tCanvas.height=Math.round(vh*scale);
      const tctx=tCanvas.getContext('2d');
      tctx.save();
      if(currentFacing==='user'){tctx.translate(tCanvas.width,0);tctx.scale(-1,1);}
      if(canvasFilterSupported&&activeVideoCss&&activeVideoCss!=='none')tctx.filter=activeVideoCss;
      tctx.drawImage(liveVideo,0,0,tCanvas.width,tCanvas.height);
      tctx.restore();
      let q=.62,uri=tCanvas.toDataURL('image/jpeg',q);
      while(uri.length>42000&&q>.2){q-=.1;uri=tCanvas.toDataURL('image/jpeg',q);}
      resolve(uri.length<=42000?uri:'');
    }catch(e){resolve('');}
  });
}
async function startVideoRecording(){
  if(!(await guardFrame('video')))return;
  if(!streamHasAudio){showToast('Mikrofon tidak terdeteksi, jadi videonya akan tanpa suara.','error');}
  videoThumbBlob=await captureVideoThumbnail();
  recordedChunks=[];
  const maxSeconds=Number(weddingSettings.max_video_seconds)||60;
  const recordFps=(activeFilterParams&&activeFilterParams.video&&activeFilterParams.video.fps)||30;
  const weakDevice=!!(navigator.deviceMemory&&navigator.deviceMemory<=2);   // hanya HP benar-benar lemah yang dibatasi (maks 30 fps)
  const fps=weakDevice?Math.min(30,recordFps):recordFps;
  const vq=getQuality('video');
  try{const vt=liveStream.getVideoTracks()[0];if(vt&&vt.applyConstraints)await vt.applyConstraints({frameRate:{ideal:fps}});}catch(e){}   // minta kamera merekam sesuai FPS admin
  const audioTracks=liveStream.getAudioTracks();
  const needsCanvas=currentFacing==='user'||autoIncludeFrame.video||!!activeFilterParams||(activeVideoCss&&activeVideoCss!=='none');
  let drawing=false;let combined;
  if(needsCanvas){
    const vw0=liveVideo.videoWidth||1280,vh0=liveVideo.videoHeight||720;
    const sc=Math.min(1,Math.max(vq.width,vq.height)/Math.max(vw0,vh0));
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(vw0*sc);canvas.height=Math.round(vh0*sc);
    const ctx=canvas.getContext('2d');drawing=true;
    const drawFrame=()=>{
      if(!drawing)return;
      drawWithGuaranteedFilter(ctx,()=>{
        if(currentFacing==='user'){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(liveVideo,0,0,canvas.width,canvas.height);ctx.restore();}
        else{ctx.drawImage(liveVideo,0,0,canvas.width,canvas.height);}
      },canvas.width,canvas.height,true);
      if(activeFilterParams&&activeFilterParams.video&&activeFilterParams.video.vignette){drawCheapVignette(ctx,canvas.width,canvas.height,activeFilterParams.video.vignette);}
      if(autoIncludeFrame.video)drawCaptureFrameOverlay(ctx,canvas.width,canvas.height,'video');
      if(typeof liveVideo.requestVideoFrameCallback==='function')liveVideo.requestVideoFrameCallback(drawFrame);else requestAnimationFrame(drawFrame);   // satu gambar per frame kamera
    };
    drawFrame();
    combined=new MediaStream([...canvas.captureStream(fps).getVideoTracks(),...audioTracks]);
  }else{combined=liveStream;}
  mediaRecorder=new MediaRecorder(combined,{mimeType:VIDEO_MIME.mime,videoBitsPerSecond:Math.round(vq.videoBitsPerSecond*Math.min(1.5,Math.max(1,fps/30))),audioBitsPerSecond:vq.audioBitsPerSecond});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data);};
  mediaRecorder.onstop=()=>{
    drawing=false;
    capturedBlob=new Blob(recordedChunks,{type:VIDEO_MIME.mime});
    capturedMime=VIDEO_MIME.mime;capturedExt=VIDEO_MIME.ext;
    recordedVideo.src=URL.createObjectURL(capturedBlob);
    if(IS_LOW_END)stopCameraStream();
    liveVideo.style.display='none';recordedVideo.style.display='block';
    showReview();
  };
  mediaRecorder.start();
  recordSeconds=0;
  document.getElementById('recBadge').style.display='flex';
  shutterBtn.classList.add('recording');
  updateRecTimer();
  recordTimer=setInterval(()=>{recordSeconds++;updateRecTimer();if(recordSeconds>=maxSeconds)stopVideoRecording();},1000);
}
function stopVideoRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
  clearInterval(recordTimer);
  document.getElementById('recBadge').style.display='none';
  shutterBtn.classList.remove('recording');
}

async function startVoiceRecording(){
  if(await queryPermState('microphone')==='denied'){showPermissionHelp('mic');return;}
  if(autoIncludeFrame.voice){if(!(await guardFrame('voice')))return;return startVoiceRecordingWithFrame();}
  try{
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
    catch(permErr){if(/NotAllowed|Permission|denied/i.test(String(permErr.message))){showPermissionHelp('mic');return;}throw permErr;}
    vnChunks=[];
    vnRecorder=new MediaRecorder(stream,{mimeType:AUDIO_MIME.mime,audioBitsPerSecond:getQuality('voice').audioBitsPerSecond});
    vnRecorder.ondataavailable=e=>vnChunks.push(e.data);

      vnBlob=new Blob(vnChunks,{type:AUDIO_MIME.mime});

      stream.getTracks().forEach(t=>t.stop());
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');
    document.getElementById('vnHint').textContent='Sedang merekam… ketuk tombol untuk berhenti';
    const maxSeconds=Number(weddingSettings.max_voice_seconds)||60;

let vnFrameAudioCtx=null;
async function startVoiceRecordingWithFrame(){
  try{
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
    catch(permErr){if(/NotAllowed|Permission|denied/i.test(String(permErr.message))){showPermissionHelp('mic');return;}throw permErr;}
    const cfg=frameConfigCache.voice||getFrameConfig('voice');
    const vnRes=getVnResolution();
    const guestNamePreview=(document.getElementById('guestName').value||'Tamu').trim();
    const canvas=document.createElement('canvas');
    canvas.width=vnRes.width;canvas.height=vnRes.height;
    const ctx=canvas.getContext('2d');
    vnFrameAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=vnFrameAudioCtx.createMediaStreamSource(stream);
    const analyser=vnFrameAudioCtx.createAnalyser();
    analyser.fftSize=256;
    const dataArray=new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    const customImg=customFrameImgCache.voice;
    let drawing=true;
    function drawLoop(){
      if(!drawing)return;
      analyser.getByteFrequencyData(dataArray);
      if(customImg){drawFrameForMedia(ctx,customImg,canvas.width,canvas.height);}
      else{ctx.fillStyle=cfg.secondary;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=cfg.primary;ctx.globalAlpha=.15;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=1;}
      drawAudiogramLive(ctx,canvas.width,canvas.height,dataArray,cfg,guestNamePreview);
      if(!customImg)drawFrameBar(ctx,canvas.width,canvas.height,cfg);
      requestAnimationFrame(drawLoop);
    }
    drawLoop();
    const canvasStream=canvas.captureStream(30);
    const combined=new MediaStream([...canvasStream.getVideoTracks(),...stream.getAudioTracks()]);
    vnChunks=[];
    vnRecorder=new MediaRecorder(combined,{mimeType:VIDEO_MIME.mime,videoBitsPerSecond:2500000,audioBitsPerSecond:getQuality('voice').audioBitsPerSecond});
    vnRecorder.ondataavailable=e=>{if(e.data.size>0)vnChunks.push(e.data);};
    vnRecorder.onstop=()=>{
      drawing=false;
      vnBlob=new Blob(vnChunks,{type:VIDEO_MIME.mime});
      capturedBlob=vnBlob;capturedMime=VIDEO_MIME.mime;capturedExt=VIDEO_MIME.ext;
      const vnVideoPlayer=document.getElementById('vnVideoPlayer');
      vnVideoPlayer.src=URL.createObjectURL(vnBlob);
      vnVideoPlayer.style.display='block';
      document.getElementById('voiceWrap').classList.add('has-player');
      vnOrb.classList.remove('recording');
      document.getElementById('vnControlsIdle').style.display='none';
      document.getElementById('vnControlsReview').style.display='flex';
      document.getElementById('vnHint').textContent='Tonton dulu sebelum dikirim ya';
      stream.getTracks().forEach(t=>t.stop());
      if(vnFrameAudioCtx){vnFrameAudioCtx.close().catch(()=>{});vnFrameAudioCtx=null;}
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');
    document.getElementById('vnHint').textContent='Sedang merekam (dengan bingkai)...';
    const maxSeconds=Number(weddingSettings.max_voice_seconds)||60;
    vnSeconds=0;updateVnTimer();
    vnTimer=setInterval(()=>{vnSeconds++;updateVnTimer();if(vnSeconds>=maxSeconds)stopVoiceRecording();},1000);
    vnRecordBtn.textContent='■';
    vnRecordBtn.onclick=stopVoiceRecording;
  }catch(err){showToast('Tidak bisa mengakses mikrofon. Periksa izin mikrofon di browser kamu.','error');}
}
function stopVoiceRecording(){if(vnRecorder&&vnRecorder.state==='recording')vnRecorder.stop();clearInterval(vnTimer);}
function updateVnTimer(){document.getElementById('vnTimer').textContent=formatSeconds(vnSeconds);}
function resetVoice(){
  capturedBlob=null;vnBlob=null;vnChunks=[];
  const vnPlayer=document.getElementById('vnPlayer');
  vnPlayer.style.display='none';vnPlayer.src='';
  const vnVideoPlayer=document.getElementById('vnVideoPlayer');
  vnVideoPlayer.style.display='none';vnVideoPlayer.src='';
  document.getElementById('voiceWrap').classList.remove('has-player');
  document.getElementById('vnControlsReview').style.display='none';
  document.getElementById('vnControlsIdle').style.display='flex';
  document.getElementById('vnHint').textContent=autoIncludeFrame.voice?'Ketuk tombol merah, lalu ucapkan doa & harapanmu (sudah berbingkai)':'Ketuk tombol merah, lalu ucapkan doa & harapanmu';
  vnRecordBtn.textContent='●';vnRecordBtn.onclick=startVoiceRecording;
  vnSeconds=0;updateVnTimer();
}
function sendSingleMedia(type){
  if(tooSoon_())return;
  const guestName=ensureGuestName();
  if(!guestName){lastSendAt=0;return;}
  if(!capturedBlob){showToast(type==='voice'?'Rekam suaramu dulu ya':'Rekam videonya dulu ya','error');return;}
  enqueueUpload({type,blob:capturedBlob,mime:String(capturedMime||'').split(';')[0]||(type==='video'?'video/webm':'audio/webm'),ext:capturedExt,thumb:type==='video'?(videoThumbBlob||''):'',guest:guestName});
  if(type==='voice'){resetVoice();}
  else{
    resetCapture();
    document.getElementById('captureRow').style.display='flex';
    document.getElementById('reviewRow').style.display='none';
    liveVideo.style.display='block';photoCanvas.style.display='none';recordedVideo.style.display='none';
    if(!liveStream)startCamera();
  }
  showToast(type==='voice'?'Suaramu sedang dikirim. Pantau progresnya di tombol sebelah kanan.':'Videomu sedang dikirim. Pantau progresnya di tombol sebelah kanan kamera.','success');
}
function blobToBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob);});}
function showStatus(title,text,action){
  document.getElementById('statusScreen').style.display='flex';
  document.getElementById('statusTitle').textContent=title;
  document.getElementById('statusText').textContent=text;
  const btn=document.getElementById('statusBtn');
  const alt=document.getElementById('statusAltBtn');
  if(alt){
    if(action&&typeof action==='object'&&action.alt){alt.style.display='inline-block';alt.textContent=action.alt.label;alt.onclick=action.alt.fn;}
    else{alt.style.display='none';alt.onclick=null;}
  }
  if(action&&typeof action==='object'){
    btn.style.display='inline-block';btn.textContent=action.label;
    if(action.fn){btn.onclick=action.fn;}
    else if(action.href){
      btn.onclick = function(){
        var h = action.href || '';
        if (/album\.html/.test(h)) { try { parent.postMessage({ type:'switchTab', tab:'album' }, '*'); } catch (e) {} }
        else { location.href = h; }
      };
    }
    else{btn.onclick=reloadSelf;}
  }else if(action===true){btn.style.display='inline-block';btn.textContent='Coba Lagi';btn.onclick=reloadSelf;}
  else{btn.style.display='none';btn.onclick=null;}
}
function hideStatus(){document.getElementById('statusScreen').style.display='none';}
function showToast(text,type){const t=document.getElementById('toast');t.textContent=text;t.className='toast '+type;t.style.display='block';setTimeout(()=>{t.style.display='none';},4000);}
function formatSeconds(s){const m=String(Math.floor(s/60)).padStart(2,'0');const sec=String(s%60).padStart(2,'0');return`${m}:${sec}`;}
function formatDate(d){try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
init();   // v18.1: sengaja di paling akhir, setelah semua let/const terdefinisi
</script>

<script>
function reloadSelf(){
  try { parent.postMessage({ type:'reloadTab', tab:'album' }, '*'); return; } catch(e){}
  location.reload();
}
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyRNMVjhKK93fq3r2LNsRBkSUkWK3LU44iFALV3YmjVZkkG37912TtX3wy3jXcTpnFE/exec';
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});
const urlParams=new URLSearchParams(window.location.search);
let weddingId=urlParams.get('w');
if(weddingId)localStorage.setItem('active_wedding_id',weddingId);
else weddingId=localStorage.getItem('active_wedding_id');
document.getElementById('backToIndex').href=weddingId?`index.html?w=${encodeURIComponent(weddingId)}`:'index.html';
document.getElementById('toGaleri').href=weddingId?`galeri.html?w=${encodeURIComponent(weddingId)}`:'galeri.html';
let items=[];let currentFilter='all';let currentPage=0,hasMore=false,isLoading=false,loadToken=0;
let weddingSettings=null;let enabledTypes=['photo','video','voice'];let currentlyPlayingEl=null;
const fullFileCache=new Map();const CACHE_LIMIT=4;
const TYPE_LABEL={photo:'Foto',video:'Video',voice:'Suara'};
const TYPE_ICON={photo:'📷',video:'🎥',voice:'🎤'};
if(!weddingId){document.getElementById('loader').textContent='Link album belum lengkap. Buka lewat link yang dibagikan mempelai ya.';}
else{init();}
async function apiGet(params,tries=3){
  const qs=new URLSearchParams(params).toString();let lastErr;
  for(let i=0;i<tries;i++){
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),20000);
    try{
      const res=await fetch(`${APPS_SCRIPT_URL}?${qs}`,{signal:ctrl.signal});
      const data=await res.json();clearTimeout(to);
      if(data&&data.busy&&i<tries-1){await sleep(800*(i+1));continue;}
      return data;
    }catch(e){clearTimeout(to);lastErr=e;await sleep(600*(i+1));}
  }
  throw lastErr||new Error('Koneksi bermasalah');
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mixHex_(x,y,t){const px=parseInt(x.slice(1),16),py=parseInt(y.slice(1),16);const ch=sh=>Math.round(((px>>sh)&255)*(1-t)+((py>>sh)&255)*t);return'#'+[16,8,0].map(sh=>ch(sh).toString(16).padStart(2,'0')).join('');}
function lum_(hex){const c=[16,8,0].map(sh=>{const v=((parseInt(hex.slice(1),16)>>sh)&255)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function applyThemeColors(s){
  if(!s)return;
  const ok=h=>/^#[0-9a-fA-F]{6}$/.test(h||'');
  const root=document.documentElement;
  if(ok(s.primary_color)){let p=s.primary_color,guard=0;while(1.05/(lum_(p)+0.05)<4.5&&guard++<12)p=mixHex_(p,'#1A1410',0.15);root.style.setProperty('--primary',p);root.style.setProperty('--primary-hover',mixHex_(p,'#1A1410',0.15));}
  if(ok(s.secondary_color))root.style.setProperty('--accent',s.secondary_color);
}
async function init(){
  try{
    const s=await apiGet({action:'getSettings',wedding_id:weddingId});
    if(!s.success){document.getElementById('loader').textContent=s.message||'Album tidak ditemukan.';return;}
    weddingSettings=s;applyThemeColors(s);enabledTypes=s.types||['photo'];
    document.getElementById('titleText').textContent=(s.ui_config&&s.ui_config.album_headline)||`${s.name_first||s.groom_name} & ${s.name_second||s.bride_name}`;
    if(s.date)document.getElementById('subtitleText').textContent=formatDate(s.date);
    buildFilters();
  }catch(e){showLoadError();return;}
  loadPage(true);
}
function buildFilters(){
  const box=document.getElementById('filters');box.innerHTML='';
  if(enabledTypes.length<=1){box.style.display='none';currentFilter='all';return;}
  box.style.display='flex';
  [['all','Semua']].concat(enabledTypes.map(t=>[t,TYPE_LABEL[t]])).forEach(([val,label])=>{
    const b=document.createElement('button');b.dataset.filter=val;b.textContent=label;
    if(val===currentFilter)b.classList.add('active');
    b.addEventListener('click',()=>{
      if(currentFilter===val)return;
      currentFilter=val;
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
      loadPage(true);
    });
    box.appendChild(b);
  });
}
function showLoadError(){const l=document.getElementById('loader');l.style.display='block';l.innerHTML='Koneksi sedang kurang stabil.<br><button class="retry-btn" onclick="reloadSelf()">Coba Lagi</button>';}
const SIZE_KEY='album_page_size';
let pageSize=25;
try{const v=localStorage.getItem(SIZE_KEY);pageSize=v==='50'?50:(v==='all'?'all':25);}catch(e){}
let totalPages=1,totalItems=0,firstLoadDone=false;
const reqSize=()=>pageSize==='all'?50:pageSize;
const LOW_END=(navigator.deviceMemory&&navigator.deviceMemory<=2)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4);
const pageMem=new Map();
function memKey(page){return`${currentFilter}|${reqSize()}|${page}`;}
async function fetchPage(page){
  const k=memKey(page);
  if(pageMem.has(k))return pageMem.get(k);
  const data=await apiGet({action:'getAlbum',wedding_id:weddingId,page,type:currentFilter,size:reqSize()});
  if(data&&data.success){pageMem.set(k,data);while(pageMem.size>(LOW_END?2:4))pageMem.delete(pageMem.keys().next().value);}
  return data;
}
async function loadPage(reset,page,opts){
  opts=opts||{};
  const paged=pageSize!=='all';
  if(isLoading&&!reset&&!opts.force)return;
  const myToken=++loadToken;isLoading=true;
  const grid=document.getElementById('grid');
  const loader=document.getElementById('loader');
  const target=reset?(page||1):(paged?(page||currentPage+1):currentPage+1);
  const replace=reset||paged;
  const cacheKey=`alb_${weddingId}_${currentFilter}_${reqSize()}`;
  setPagerBusy(true);
  if(reset&&target===1){
    items=[];currentPage=0;hasMore=false;
    grid.innerHTML='';document.getElementById('empty').style.display='none';
    try{const cached=JSON.parse(sessionStorage.getItem(cacheKey)||'null');if(cached&&cached.media&&cached.media.length){items=cached.media.slice();renderItems(items,false);}else loader.style.display='block';}catch(e){loader.style.display='block';}
  }else if(replace){grid.classList.add('busy');}else{loader.style.display='block';}
  try{
    const data=await fetchPage(target);
    if(myToken!==loadToken)return;
    loader.style.display='none';
    if(!data.success){showToast(data.message||'Album belum bisa dimuat','error');return;}
    if(JSON.stringify(data.types)!==JSON.stringify(enabledTypes)){enabledTypes=data.types;buildFilters();}
    currentPage=data.page;hasMore=data.has_more;
    totalPages=data.total_pages||1;totalItems=data.total||0;
    if(replace){
      items=data.media.slice();grid.innerHTML='';renderItems(items,false);
      if(reset&&target===1){try{sessionStorage.setItem(cacheKey,JSON.stringify({media:data.media}));}catch(e){}}
      if(!opts.keepScroll&&firstLoadDone&&paged)scrollToTop();
    }else{
      const start=items.length;items=items.concat(data.media);renderItems(data.media,true,start);
    }
    firstLoadDone=true;
    document.getElementById('empty').style.display=items.length===0?'block':'none';
    updateToolbar();updatePager();watchSentinel();prefetchNext();
  }catch(e){
    if(myToken===loadToken){loader.style.display='none';if(items.length===0)showLoadError();else showToast('Koneksi terputus. Coba lagi ya.','error');}
  }finally{
    if(myToken===loadToken){isLoading=false;grid.classList.remove('busy');setPagerBusy(false);}
  }
}
function scrollToTop(){
  const el=document.getElementById('toolbar').style.display!=='none'?document.getElementById('toolbar'):document.getElementById('grid');
  const y=el.getBoundingClientRect().top+window.pageYOffset-12;
  window.scrollTo({top:Math.max(0,y),behavior:LOW_END?'auto':'smooth'});
}
function updateToolbar(){
  const tb=document.getElementById('toolbar');
  if(totalItems===0){tb.style.display='none';return;}
  tb.style.display='flex';
  document.getElementById('sizePick').style.display=totalItems>25?'flex':'none';
  document.querySelectorAll('#sizePick button').forEach(b=>b.classList.toggle('active',b.dataset.size===String(pageSize)));
  const size=reqSize();
  if(pageSize==='all')document.getElementById('countText').textContent=`${items.length} dari ${totalItems} momen`;
  else{const from=(currentPage-1)*size+1,to=Math.min(totalItems,from+items.length-1);document.getElementById('countText').textContent=totalItems<=size?`${totalItems} momen`:`${from}–${to} dari ${totalItems} momen`;}
}
function updatePager(){
  const pg=document.getElementById('pager');
  if(pageSize==='all'||totalPages<=1){pg.style.display='none';return;}
  pg.style.display='flex';
  document.getElementById('pageInfo').textContent=`Halaman ${currentPage} dari ${totalPages}`;
  document.getElementById('prevPage').disabled=currentPage<=1;
  document.getElementById('nextPage').disabled=currentPage>=totalPages;
}
function setPagerBusy(b){if(b){document.getElementById('prevPage').disabled=true;document.getElementById('nextPage').disabled=true;}else updatePager();}
function prefetchNext(){
  if(pageSize==='all'||LOW_END||currentPage>=totalPages)return;
  if(navigator.connection&&(navigator.connection.saveData||/2g/.test(navigator.connection.effectiveType||'')))return;
  const nextNo=currentPage+1,tok=loadToken;
  setTimeout(()=>{if(tok===loadToken&&!isLoading)fetchPage(nextNo).catch(()=>{});},900);
}
document.getElementById('prevPage').addEventListener('click',()=>{if(currentPage>1)loadPage(false,currentPage-1);});
document.getElementById('nextPage').addEventListener('click',()=>{if(currentPage<totalPages)loadPage(false,currentPage+1);});
document.getElementById('sizePick').addEventListener('click',e=>{
  const b=e.target.closest('button[data-size]');if(!b)return;
  const v=b.dataset.size==='all'?'all':Number(b.dataset.size);
  if(v===pageSize)return;
  pageSize=v;try{localStorage.setItem(SIZE_KEY,String(v));}catch(err){}
  pageMem.clear();loadPage(true,1);
});
let sentinelObserver=null;
function watchSentinel(){
  const s=document.getElementById('sentinel');
  if(!('IntersectionObserver'in window))return;
  if(!sentinelObserver){
    sentinelObserver=new IntersectionObserver(entries=>{if(entries[0].isIntersecting&&pageSize==='all'&&hasMore&&!isLoading)loadPage(false);},{rootMargin:'600px'});
    sentinelObserver.observe(s);
  }else{sentinelObserver.unobserve(s);sentinelObserver.observe(s);}
}
function renderItems(list,append,startIndex){
  const grid=document.getElementById('grid');
  const ui=(weddingSettings&&weddingSettings.ui_config)||{};
  const previewOn=ui.allow_preview!==false;
  const originalOn=ui.allow_download_original!==false;
  const framedOn=ui.allow_download_framed!==false;
  const frag=document.createDocumentFragment();
  const base=append?startIndex:0;
  list.forEach((item,k)=>{
    const idx=base+k;
    const div=document.createElement('div');div.className='item';div.dataset.idx=idx;
    const uid='m_'+item.media_id;
    const thumb=item.thumbnail_url||'';
    let mediaHtml='';
    if(!previewOn){mediaHtml=`<div class="media-box" style="flex-direction:column;gap:6px;color:var(--text-3);"><span style="font-size:26px;">${TYPE_ICON[item.media_type]}</span><span style="font-size:11px;">${TYPE_LABEL[item.media_type]} — unduh untuk melihat</span></div>`;}
    else if(item.media_type==='photo'){mediaHtml=thumb?`<div class="media-box" data-act="view" style="cursor:zoom-in"><img src="${thumb}" decoding="async" alt="Foto dari ${escapeAttr(item.guest_name)}"></div>`:`<div class="media-box" data-act="view" style="cursor:zoom-in"><span class="spinner">Ketuk untuk melihat foto</span></div>`;}
    else if(item.media_type==='video'){mediaHtml=`<div class="media-box" id="${uid}_box" style="${thumb?'':'background:#2A2320;'}">${thumb?`<img src="${thumb}" decoding="async" alt="">`:''}<button class="video-poster-btn" data-act="playvideo" aria-label="Putar video">▶</button></div>`;}
    else{mediaHtml=`<div class="audio-box" id="${uid}_box"><div class="wave">🎵</div><button class="play-toggle" data-act="playaudio" id="${uid}_btn" aria-label="Putar suara">▶</button></div>`;}
    const dl=[];
    if(originalOn)dl.push(`<button class="dl-btn" data-act="dlorig">Unduh Asli</button>`);
    if(framedOn)dl.push(`<button class="dl-btn primary" data-act="dlframe">Unduh Berbingkai</button>`);
    if(!dl.length)dl.push(`<span style="font-size:11px;color:var(--text-3);">Unduhan sedang dinonaktifkan mempelai</span>`);
    div.innerHTML=`${mediaHtml}<div class="cap"><div class="who"><b>${escapeHtml(item.guest_name)}</b><span>${escapeHtml(item.date||'')}</span></div>${item.caption?`<div style="margin-bottom:8px;font-style:italic;">${escapeHtml(item.caption)}</div>`:''}<div class="dl-row">${dl.join('')}</div></div>`;
    frag.appendChild(div);
  });
  grid.appendChild(frag);
}
document.getElementById('grid').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const card=el.closest('.item');
  const item=items[Number(card.dataset.idx)];if(!item)return;
  const uid='m_'+item.media_id;
  const act=el.dataset.act;
  if(act==='playvideo')playFullVideo(item.file_id,uid,el);
  else if(act==='playaudio')playAudio(item.file_id,uid,el);
  else if(act==='dlorig')downloadOriginal(item.file_id,item.media_type,item.guest_name,el);
  else if(act==='dlframe')downloadWithFrame(item.media_id,item.file_id,item.media_type,item.guest_name,el);
  else if(act==='view')openPhoto(item,card);
});
let viewIdx=-1,viewTok=0,viewTimer=null,viewBusy=false;
function viewerOpen(){return document.getElementById('photoViewer').style.display==='flex';}
function photoAfter(from,dir){for(let i=from+dir;i>=0&&i<items.length;i+=dir)if(items[i].media_type==='photo')return i;return-1;}
function canStepMore(dir){if(photoAfter(viewIdx,dir)!==-1)return true;if(pageSize==='all')return dir>0&&hasMore;return dir>0?currentPage<totalPages:currentPage>1;}
function openPhoto(item,card){viewIdx=Number(card.dataset.idx);document.getElementById('photoViewer').style.display='flex';showViewer();}
function showViewer(){
  const item=items[viewIdx];if(!item)return;
  const img=document.getElementById('photoViewerImg');const tok=++viewTok;
  clearTimeout(viewTimer);
  document.getElementById('pvName').textContent=item.guest_name;
  const photos=items.filter(x=>x.media_type==='photo');
  document.getElementById('pvCount').textContent=photos.length>1?`${photos.indexOf(item)+1} / ${photos.length}`:'';
  img.src=item.thumbnail_url||'';
  img.classList.add('loading');
  document.getElementById('pvPrev').disabled=!canStepMore(-1);
  document.getElementById('pvNext').disabled=!canStepMore(1);
  viewTimer=setTimeout(async()=>{
    try{
      const{url}=await fetchFileChunked(item.file_id);
      if(tok===viewTok&&viewerOpen()){img.src=url;img.classList.remove('loading');}
    }catch(e){if(tok===viewTok){img.classList.remove('loading');showToast('Foto ukuran penuh belum bisa dimuat. Coba lagi ya.','error');}}
  },350);
}
async function stepPhoto(dir){
  if(viewBusy||viewIdx<0)return;
  let nxt=photoAfter(viewIdx,dir);
  if(nxt===-1){
    if(!canStepMore(dir))return;
    viewBusy=true;
    document.getElementById('pvCount').textContent='Memuat…';
    try{
      while(nxt===-1&&canStepMore(dir)){
        const oldLen=items.length;
        if(pageSize==='all'){await loadPage(false,null,{force:true});nxt=photoAfter(oldLen-1,1);}
        else{await loadPage(false,currentPage+dir,{force:true,keepScroll:true});nxt=dir>0?photoAfter(-1,1):photoAfter(items.length,-1);}
        if(items.length===oldLen&&pageSize==='all')break;
      }
    }finally{viewBusy=false;}
    if(nxt===-1){showToast('Sudah di foto terakhir.','success');showViewer();return;}
  }
  viewIdx=nxt;showViewer();
}
function closePhoto(){clearTimeout(viewTimer);viewTok++;document.getElementById('photoViewer').style.display='none';document.getElementById('photoViewerImg').src='';viewIdx=-1;}
document.addEventListener('keydown',e=>{
  if(!viewerOpen())return;

  else if(e.key==='ArrowRight')stepPhoto(1);

});
(function(){

function readPending(){try{return JSON.parse(localStorage.getItem(PEND_KEY)||'[]').filter(x=>x&&x.w===weddingId&&Date.now()-x.ts<30*60*1000);}catch(e){return[];}}
function removePending(cids){try{const gone=new Set(cids);localStorage.setItem(PEND_KEY,JSON.stringify(JSON.parse(localStorage.getItem(PEND_KEY)||'[]').filter(x=>x&&!gone.has(x.c))));}catch(e){}}
function openInfo(o){

document.getElementById('infoOverlay').addEventListener('click',e=>{if(e.target.id==='infoOverlay')closeInfo();});
function watchPending(){
  const mine=readPending();if(!mine.length||!weddingId)return;
  const left=new Set(mine.map(x=>x.c)),total=mine.length,got={};
  const t0=Date.now();let n=0;
  showToast('Mengecek kiriman kamu…','info');
  async function tick(){
    n++;
    const ids=Array.from(left).slice(0,30);
    const deep=n===1||Date.now()-t0>150000;
    try{const d=await apiGet({action:'checkUpload',wedding_id:weddingId,client_ids:ids.join(','),deep:deep?1:0},2);if(d&&d.success)Object.keys(d.found||{}).forEach(id=>{got[id]=d.found[id];left.delete(id);});}catch(e){}
    removePending(Object.keys(got));
    if(left.size===0){
      const approved=Object.keys(got).every(id=>got[id].status==='approved');

  });

function triggerDownload(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),3000);}
function escapeAttr(str){return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeHtml(str){return escapeAttr(str);}
function formatDate(d){try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function showToast(text,type){const t=document.getElementById('toast');t.textContent=text;t.className='toast '+type;t.style.display='block';setTimeout(()=>{t.style.display='none';},4500);}
/* ===== v18.2: album selalu terbaru tanpa reload ===== */
let refreshingAlbum=false,albumActive=true;
function isMediaPlaying(){
  if(currentlyPlayingEl&&!currentlyPlayingEl.paused)return true;
  return Array.from(document.querySelectorAll('#grid video')).some(v=>!v.paused);
}
function applyAlbumData(data){
  const grid=document.getElementById('grid');
  if(JSON.stringify(data.types)!==JSON.stringify(enabledTypes)){enabledTypes=data.types;buildFilters();}
  currentPage=data.page;hasMore=data.has_more;totalPages=data.total_pages||1;totalItems=data.total||0;
  items=data.media.slice();
  grid.innerHTML='';renderItems(items,false);
  document.getElementById('empty').style.display=items.length===0?'block':'none';
  if(currentPage===1){try{sessionStorage.setItem(`alb_${weddingId}_${currentFilter}_${reqSize()}`,JSON.stringify({media:data.media}));}catch(e){}}
  updateToolbar();updatePager();watchSentinel();
}
async function refreshAlbumSilently(){
  if(refreshingAlbum||isLoading||!weddingSettings||!weddingId)return;
  if(viewerOpen()||viewBusy||isMediaPlaying())return;
  if(pageSize==='all'&&currentPage>1)return;
  refreshingAlbum=true;
  try{
    const page=Math.max(1,currentPage||1);
    const data=await apiGet({action:'getAlbum',wedding_id:weddingId,page,type:currentFilter,size:reqSize(),_:Date.now()},2);
    if(!data||!data.success)return;
    const sig=l=>l.map(x=>x.media_id).join(',');
    if(sig(data.media)===sig(items)&&(data.total||0)===totalItems)return;
    if(isLoading||viewerOpen()||viewBusy||isMediaPlaying())return;
    pageMem.clear();pageMem.set(memKey(data.page),data);
    applyAlbumData(data);
  }catch(e){}
  finally{refreshingAlbum=false;}
}
setInterval(()=>{if(albumActive&&!document.hidden&&!(navigator.connection&&navigator.connection.saveData))refreshAlbumSilently();},45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&albumActive)refreshAlbumSilently();});
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='refreshAlbum'){albumActive=true;refreshAlbumSilently();}
  else if(d.type==='tabState'){albumActive=!!d.active;if(d.active)refreshAlbumSilently();}
});
try{parent.postMessage({type:'frameReady',tab:'album'},'*');}catch(e){}
if(weddingId)watchPending();
</script>

    }
  }, true);
})();
