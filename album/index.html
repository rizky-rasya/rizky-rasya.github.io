function applyThemeColors(s){if(!s)return;if(s.primary_color)document.documentElement.style.setProperty('--primary',s.primary_color);if(s.secondary_color)document.documentElement.style.setProperty('--accent',s.secondary_color);}
async function fetchJson(qs,tries=3){
  let last;
  for(let i=0;i<tries;i++){
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),15000);
    try{const res=await fetch(`${APPS_SCRIPT_URL}?${qs}`,{signal:ctrl.signal});const d=await res.json();clearTimeout(to);return d;}
    catch(e){clearTimeout(to);last=e;await new Promise(r=>setTimeout(r,500*(i+1)));}
  }
  throw last||new Error('offline');
}
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
/* v18: bingkai custom disimpan di Cache Storage + 4x percobaan; kirim selalu menunggu bingkai siap (tidak pernah lolos tanpa bingkai). */
async function fetchFrameBlob(fileId){
  const url=`${APPS_SCRIPT_URL}?action=getMediaFile&file_id=${encodeURIComponent(fileId)}`;
  let store=null;
  try{store=window.caches?await caches.open('frames-v1'):null;}catch(e){}
  if(store){try{const hit=await store.match(url);if(hit)return await hit.blob();}catch(e){}}
  let last;
  for(let i=0;i<4;i++){
    try{
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
      const res=await fetch(url,{signal:ctrl.signal});const data=await res.json();clearTimeout(to);
      if(data&&data.success){
        const bytes=base64ToUint8(data.base64);
        const blob=new Blob([bytes],{type:data.mimeType||'image/png'});
        if(store){try{await store.put(url,new Response(blob,{headers:{'content-type':blob.type}}));}catch(e){}}
        return blob;
      }
      last=new Error((data&&data.message)||'Gagal memuat bingkai');
    }catch(e){last=e;}
    await sleepMs(600*(i+1)+Math.floor(Math.random()*400));
  }
  throw last||new Error('frame');
}
async function loadFrameImage(fileId){
  const blob=await fetchFrameBlob(fileId);
  const url=URL.createObjectURL(blob);
  return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('decode'));};img.src=url;});
}
const frameLoad={},frameLoadedId={};
function frameCustomId(type){const c=frameConfigCache[type];return c&&c.customFrame?c.customFrame.file_id:null;}
function frameMissing(type){const id=frameCustomId(type);return !!id&&!(customFrameImgCache[type]&&frameLoadedId[type]===id);}
function startFrameLoad(type){
  const id=frameCustomId(type);frameLoadedId[type]=null;
  frameLoad[type]=loadFrameImage(id).then(img=>{customFrameImgCache[type]=img;frameLoadedId[type]=id;return true;}).catch(()=>{customFrameImgCache[type]=null;return false;});
  return frameLoad[type];
}
async function ensureFrame(type){
  if(!frameMissing(type))return true;
  if(!frameLoad[type])startFrameLoad(type);
  await frameLoad[type];
  if(frameMissing(type))await startFrameLoad(type);
  return !frameMissing(type);
}
function preloadFrameAssets(settings){
  const jobs=[];
  for(const type of ['photo','video']){
    frameConfigCache[type]=getFrameConfig(type);
    if(frameMissing(type)&&!frameLoad[type])jobs.push(startFrameLoad(type));
  }
  return Promise.all(jobs);
}
function base64ToUint8(b64){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
function getFrameConfig(type){
  const w=weddingSettings||{};
  const uiConfig=w.ui_config||{};
  const frames=uiConfig.frames||{};
  const customFrame=type?frames[type]:null;
  return{
    style:w.frame_style||'elegant',primary:w.primary_color||'#440808',secondary:w.secondary_color||'#C9A66B',
    groom:w.name_first||w.groom_name||'',bride:w.name_second||w.bride_name||'',date:w.date?formatDate(w.date):'',
    customFrame:(customFrame&&customFrame.type==='custom'&&customFrame.file_id)?customFrame:null
  };
}
function drawFrameForMedia(ctx,frameImg,w,h){if(!frameImg)return;const fw=frameImg.naturalWidth||frameImg.width;const fh=frameImg.naturalHeight||frameImg.height;if(!fw||!fh)return;const mediaLandscape=w>h;const frameLandscape=fw>fh;const frameSquare=fw===fh;if(!frameSquare&&mediaLandscape!==frameLandscape){ctx.save();ctx.translate(w/2,h/2);ctx.rotate(Math.PI/2);ctx.drawImage(frameImg,-h/2,-w/2,h,w);ctx.restore();}else{ctx.drawImage(frameImg,0,0,w,h);}}
function drawFrameBar(ctx,w,h,cfg){
  const barH=Math.round(h*.10);
  if(cfg.style==='minimalist'){ctx.fillStyle='rgba(26,20,16,0.55)';ctx.fillRect(0,h-barH,w,barH);}
  else if(cfg.style==='modern'){ctx.fillStyle=cfg.primary;ctx.fillRect(0,h-barH,w,barH);ctx.strokeStyle=cfg.secondary;ctx.lineWidth=Math.max(4,w*.006);ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,w-ctx.lineWidth,h-ctx.lineWidth);}
  else if(cfg.style==='floral-simple'){ctx.fillStyle=cfg.primary;ctx.fillRect(0,h-barH,w,barH);ctx.strokeStyle=cfg.secondary;ctx.globalAlpha=.6;ctx.lineWidth=Math.max(3,w*.005);const step=Math.max(10,w*.03);[[10,10,1,1],[w-10,10,-1,1],[10,h-barH-10,1,-1],[w-10,h-barH-10,-1,-1]].forEach(([x,y,sx,sy])=>{for(let k=1;k<=4;k++){ctx.beginPath();ctx.moveTo(x+sx*step*(k-1),y+sy*step*k);ctx.lineTo(x+sx*step*k,y+sy*step*(k-1));ctx.stroke();}});ctx.globalAlpha=1;}
  else{ctx.fillStyle=cfg.primary;ctx.fillRect(0,h-barH,w,barH);ctx.strokeStyle=cfg.secondary;ctx.lineWidth=Math.max(2,w*.0025);const pad=w*.02;ctx.strokeRect(pad,pad,w-pad*2,h-pad*2-barH*.15);}

  ctx.font=`700 ${Math.round(barH*.32)}px Fraunces, Georgia, serif`;ctx.fillText(`${cfg.groom} & ${cfg.bride}`,w/2,centerY-barH*.08);

}
function drawFrameForType(ctx,w,h,type){const cfg=frameConfigCache[type];if(!cfg)return;const customImg=customFrameImgCache[type];if(customImg){drawFrameForMedia(ctx,customImg,w,h);return;}drawFrameBar(ctx,w,h,cfg);}

/* v18.2: pilihan melebihi batas tidak lagi ditolak. Batch pertama diproses & dikirim dulu,

let overflowFiles=[];let overflowBusy=false;
async function addFilesToGrid(valid){
  photoBusy+=valid.length;updatePickState();

  for(const file of valid){
    try{const result=await processPhoto(file);photoItems.push(result);}
    catch(err){showToast('Satu foto gagal diproses: '+err.message,'error');}

function pvOpen(){return document.getElementById('pvFull').classList.contains('show');}
function openPvFull(idx){
  if(!photoItems.length||pvOpen())return;
  pvIdx=Math.max(0,Math.min(photoItems.length-1,idx|0));
  document.getElementById('pvFull').classList.add('show');showPvFull();
}
function showPvFull(){
  const it=photoItems[pvIdx];if(!it)return;
  if(!it.pv)it.pv=URL.createObjectURL(it.blob);
  const img=document.getElementById('pvFullImg');
  img.classList.add('loading');img.onload=()=>img.classList.remove('loading');img.src=it.pv;
  document.getElementById('pvFullCount').textContent=photoItems.length>1?(pvIdx+1)+' / '+photoItems.length:'';
  document.getElementById('pvFullPrev').disabled=pvIdx<=0;
  document.getElementById('pvFullNext').disabled=pvIdx>=photoItems.length-1;
}
function closePvFull(){
  document.getElementById('pvFull').classList.remove('show');
  const img=document.getElementById('pvFullImg');img.onload=null;img.src='';
  photoItems.forEach(freePv);pvIdx=0;
}
function stepPvFull(dir){const n=pvIdx+dir;if(n<0||n>=photoItems.length)return;pvIdx=n;showPvFull();}
function deleteFromPvFull(){

function doDeleteFromPvFull(){

(function(){
  let sx=0,sy=0,st=0,track=false;
  document.addEventListener('touchstart',e=>{
    track=false;if(e.touches.length!==1)return;
    if(e.target.closest&&e.target.closest('input,video,audio,.pvfull,.result-overlay,.status-screen'))return;
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();track=true;

    if(!track)return;track=false;

async function processPhoto(file){
  const img=await loadImageFile(file);
  const maxDim=2560;
  const sw=img.naturalWidth,sh=img.naturalHeight;
  const isLandscape=sw>=sh;const targetAspect=isLandscape?(16/9):(9/16);const currentAspect=sw/sh;
  let cx,cy,cw,ch;
  if(Math.abs(currentAspect-targetAspect)<0.01){cx=0;cy=0;cw=sw;ch=sh;}
  else if(currentAspect>targetAspect){ch=sh;cw=sh*targetAspect;cx=(sw-cw)/2;cy=0;}
  else{cw=sw;ch=sw/targetAspect;cx=0;cy=(sh-ch)/2;}
  let ow=cw,oh=ch;const scale=Math.min(1,maxDim/Math.max(ow,oh));ow=Math.round(ow*scale);oh=Math.round(oh*scale);
  const canvas=document.createElement('canvas');canvas.width=ow;canvas.height=oh;
  const ctx=canvas.getContext('2d');ctx.drawImage(img,cx,cy,cw,ch,0,0,ow,oh);
  drawFrameForType(ctx,ow,oh,'photo');
  const thumb=makeThumbUri(canvas,ow,oh);
  const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',.92));
  canvas.width=canvas.height=1;
  return{blob,thumb,w:ow,h:oh};
}
function loadImageFile(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('gagal muat gambar'));};
    img.src=url;
  });
}
function makeThumbUri(source,sw,sh){
  const scale=Math.min(1,360/Math.max(sw,1));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));
  c.getContext('2d').drawImage(source,0,0,c.width,c.height);
  let q=.62,uri=c.toDataURL('image/jpeg',q);
  while(uri.length>42000&&q>.2){q-=.1;uri=c.toDataURL('image/jpeg',q);}
  c.width=c.height=1;
  return uri.length<=42000?uri:'';
}

/* ===== v18.4: deteksi FPS asli video (baca metadata MP4/MOV, cadangan: ukur saat diputar) ===== */
function normFps(f){if(!isFinite(f)||f<=0)return 0;const std=[24,25,30,48,50,60,90,120];for(const c of std){if(Math.abs(f-c)/c<0.04)return c;}return Math.min(120,Math.max(10,Math.round(f)));}
function walkBoxes(dv,start,end,cb){let o=start;while(o+8<=end){let sz=dv.getUint32(o);const t=String.fromCharCode(dv.getUint8(o+4),dv.getUint8(o+5),dv.getUint8(o+6),dv.getUint8(o+7));let hdr=8;if(sz===1){sz=Number(dv.getBigUint64(o+8));hdr=16;}else if(sz===0){sz=end-o;}if(sz<hdr)break;cb(t,o+hdr,Math.min(end,o+sz));o+=sz;}}
function fpsFromMoov(dv){
  let fps=0;
  walkBoxes(dv,0,dv.byteLength,(t,s,e)=>{
    if(t!=='trak'||fps)return;
    let isVideo=false,ts=0,dur=0,count=0;
    walkBoxes(dv,s,e,(t2,s2,e2)=>{
      if(t2!=='mdia')return;
      walkBoxes(dv,s2,e2,(t3,s3,e3)=>{
        if(t3==='hdlr'){isVideo=String.fromCharCode(dv.getUint8(s3+8),dv.getUint8(s3+9),dv.getUint8(s3+10),dv.getUint8(s3+11))==='vide';}
        else if(t3==='mdhd'){if(dv.getUint8(s3)===1){ts=dv.getUint32(s3+20);dur=Number(dv.getBigUint64(s3+24));}else{ts=dv.getUint32(s3+12);dur=dv.getUint32(s3+16);}}
        else if(t3==='minf'){walkBoxes(dv,s3,e3,(t4,s4,e4)=>{if(t4==='stbl')walkBoxes(dv,s4,e4,(t5,s5)=>{if(t5==='stsz')count=dv.getUint32(s5+8);});});}
      });
    });
    if(isVideo&&ts&&dur&&count)fps=count/(dur/ts);
  });
  return fps;
}
async function mp4Fps(blob){
  try{
    const size=blob.size;let off=0;
    while(off+8<=size){
      const h=new DataView(await blob.slice(off,Math.min(size,off+16)).arrayBuffer());
      let sz=h.getUint32(0);const t=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));let hdr=8;
      if(sz===1){sz=Number(h.getBigUint64(8));hdr=16;}else if(sz===0){sz=size-off;}
      if(sz<hdr)break;
      if(t==='moov'){const buf=new DataView(await blob.slice(off+hdr,off+sz).arrayBuffer());return fpsFromMoov(buf);}
      off+=sz;
    }
  }catch(e){}
  return 0;
}
function rvfcFps(video){
  return new Promise(res=>{
    if(!video.requestVideoFrameCallback)return res(0);
    const t=[];let done=false;const wasMuted=video.muted;
    const finish=()=>{if(done)return;done=true;try{video.pause();video.currentTime=0;}catch(e){}video.muted=wasMuted;
      const d=[];for(let i=1;i<t.length;i++){const q=t[i]-t[i-1];if(q>0.002)d.push(q);}
      d.sort((a,b)=>a-b);res(d.length>=4?1/d[Math.floor(d.length*0.25)]:0);};
    const cb=(now,md)=>{t.push(md.mediaTime);if(t.length>=16)finish();else video.requestVideoFrameCallback(cb);};
    video.muted=true;video.requestVideoFrameCallback(cb);
    video.play().catch(()=>finish());
    setTimeout(finish,1800);
  });
}
async function detectSourceFps(blob,video){
  let f=normFps(await mp4Fps(blob));
  if(!f&&video)f=normFps(await rvfcFps(video));
  return f||30;
}

/* Ukuran hasil mengikuti pengaturan sistem (Kualitas Video di admin); FPS mengikuti video asli. */
function videoTarget(sw,sh,fps){
  const ui=(weddingSettings&&weddingSettings.ui_config)||{};
  const level=(ui.quality&&ui.quality.video)||'high';
  const PR={standard:{width:1280,height:720,videoBitsPerSecond:2500000},high:{width:1920,height:1080,videoBitsPerSecond:6000000},max:{width:1920,height:1080,videoBitsPerSecond:10000000}};
  const q=level==='custom'?Object.assign({},PR.high,(ui.quality_custom&&ui.quality_custom.video)||{}):Object.assign({},PR[level]||PR.high);
  const maxLong=Math.min(Math.max(q.width,q.height),IS_LOW_END?1280:1920);
  const maxShort=Math.min(Math.min(q.width,q.height),IS_LOW_END?720:1080);
  const scale=Math.min(1,maxLong/Math.max(sw,sh),maxShort/Math.min(sw,sh));
  const even=n=>Math.max(2,Math.round(n/2)*2);
  const bps=Math.min(8000000,Math.round(q.videoBitsPerSecond*Math.min(1.5,Math.max(1,fps/30))));
  return{w:even(sw*scale),h:even(sh*scale),bps};
}
async function processVideoWithFrame(file,onProgress){
  return new Promise(async(resolve,reject)=>{
    const url=URL.createObjectURL(file);const video=document.createElement('video');
    video.src=url;video.muted=false;video.playsInline=true;video.preload='auto';
    video.onloadedmetadata=async()=>{
      const duration=Math.min(video.duration,maxVideoSeconds);
      const srcFps=await detectSourceFps(file,video);
      const tgt=videoTarget(video.videoWidth,video.videoHeight,srcFps);
      const vw=tgt.w,vh=tgt.h;
      const canvas=document.createElement('canvas');canvas.width=vw;canvas.height=vh;
      const ctx=canvas.getContext('2d');
      const ov=document.createElement('canvas');ov.width=vw;ov.height=vh;drawFrameForType(ov.getContext('2d'),vw,vh,'video');   // bingkai digambar sekali, lalu ditempel per frame
      let audioCtx,audioTracks=[];
      try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaElementSource(video);const dest=audioCtx.createMediaStreamDestination();src.connect(dest);audioTracks=dest.stream.getAudioTracks();}catch(e){audioCtx=null;}
      const canvasStream=canvas.captureStream(srcFps);
      const combined=new MediaStream([...canvasStream.getVideoTracks(),...audioTracks]);
      const recorder=new MediaRecorder(combined,{mimeType:VIDEO_MIME.mime,videoBitsPerSecond:tgt.bps,audioBitsPerSecond:128000});
      const chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      recorder.onstop=()=>{try{if(audioCtx)audioCtx.close();}catch(e){}video.pause();URL.revokeObjectURL(url);const blob=new Blob(chunks,{type:VIDEO_MIME.mime});const thumb=makeThumbUri(canvas,vw,vh);canvas.width=canvas.height=1;resolve({blob,thumb,w:vw,h:vh,fps:srcFps,ext:VIDEO_MIME.ext});};
      let drawing=true;let stopped=false;
      function stop(){if(stopped)return;stopped=true;drawing=false;try{recorder.stop();}catch(e){}}
      const useRvfc=typeof video.requestVideoFrameCallback==='function';
      function step(){
        if(!drawing)return;
        if(video.ended||video.currentTime>=duration){stop();return;}
        ctx.drawImage(video,0,0,vw,vh);ctx.drawImage(ov,0,0);
        if(onProgress)onProgress(Math.min(.99,video.currentTime/duration));
        if(useRvfc)video.requestVideoFrameCallback(step);else requestAnimationFrame(step);   // satu gambar per frame asli, tanpa lompat
      }
      video.currentTime=0;recorder.start();
      try{await video.play();step();}catch(e){stop();reject(new Error('gagal memutar video'));}
    };
    video.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('gagal muat video'));};
  });
}

/* ===== v18: progres per-pengiriman (video di atas, foto di bawah, terbaru paling atas) ===== */
const tasks=[];let taskSeq=0;let batchDone=0,batchFail=0;let videoChain=Promise.resolve();
function newClientId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function sendMedia(){
  const name=document.getElementById('guestName').value.trim();
  if(!name){showToast('Tulis namamu dulu ya','error');document.getElementById('guestName').focus();return;}
  if(currentMode==='photo'){
    if(photoItems.length===0){showToast('Pilih foto dulu ya','error');return;}
    submitPhotos(name);
  }else{
    if(!videoFile){showToast('Pilih video dulu ya','error');return;}
    const file=videoFile;resetVideo();
    addTask({kind:'video',name,file,processed:null,cid:newClientId(),fileId:null,tries:0,title:'1 video'});
  }
  showToast('Mulai dikirim. Pantau progresnya di bawah, kamu boleh lanjut pilih yang lain.','success');
}
function submitPhotos(name){
  if(photoItems.length===0)return;
  if(pvOpen())closePvFull();
  const items=photoItems.map(it=>({blob:it.blob,thumb:it.thumb,cid:newClientId(),fileId:null,done:false,tries:0}));
  photoItems.forEach(freePv);
  photoItems=[];renderPhotoGrid();updateSendButtonState();updatePickState();
  addTask({kind:'photo',name,items,total:items.length,title:items.length>1?`${items.length} foto`:'1 foto'});
}
function addTask(t){
  t.id=++taskSeq;t.seq=t.id;t.state='queued';t.pct=0;t.msg='Menunggu giliran…';
  tasks.push(t);renderTasks();
  runTask(t);
}
function runTask(t){
  t.state='running';t.msg=t.kind==='video'?'Menunggu giliran…':'Mulai mengirim…';renderTasks();
  if(t.kind==='video'){videoChain=videoChain.then(()=>doVideo(t)).catch(()=>{});}
  else doPhotos(t).catch(()=>{});
}
function setTask(t,pct,msg){if(typeof pct==='number')t.pct=Math.max(t.pct||0,Math.min(100,pct));if(msg)t.msg=msg;renderTasks();}
function finishTask(t,ok,msg){
  t.state=ok?'done':'error';t.msg=msg;if(ok){t.pct=100;batchDone++;}else batchFail++;
  renderTasks();maybeSummary();
  if(ok)setTimeout(()=>{const k=tasks.indexOf(t);if(k>-1&&t.state==='done'){tasks.splice(k,1);renderTasks();}},12000);
}
function activeTasks(){return tasks.filter(t=>t.state==='running'||t.state==='queued');}
function maybeSummary(){
  if(activeTasks().length>0)return;
  if(batchDone>0&&batchFail===0&&overflowFiles.length>0){
    const n=overflowFiles.length,k=Math.min(n,maxPhoto);
    showChoice({kind:'success',title:'Terkirim, lanjut yang berikutnya?',text:`Kiriman tadi sudah masuk.\nKamu masih punya ${n} foto dari pilihan tadi yang belum dikirim. Kirim ${k} foto berikutnya sekarang?`,
      primary:{label:`Kirim ${k} Foto`,fn:sendOverflowBatch},secondary:{label:'Nanti Saja'}});
  }
  else if(batchDone>0&&batchFail===0){showResult('success','Terkirim',`Semua kiriman sudah masuk.\nTunggu persetujuan mempelai ya.`);}
  else if(batchFail>0){showResult('error','Ada yang belum terkirim',`${batchDone?batchDone+' kiriman berhasil, ':''}${batchFail} belum berhasil.\nTekan "Coba Lagi" di daftar kiriman, nanti dilanjutkan dari yang belum selesai.`);}
  batchDone=0;batchFail=0;
}
function renderTasks(){
  const box=document.getElementById('taskList');const ttl=document.getElementById('tasksTitle');
  const ordered=tasks.slice().sort((a,b)=>{const av=a.kind==='video'?0:1,bv=b.kind==='video'?0:1;if(av!==bv)return av-bv;return b.seq-a.seq;});
  ttl.style.display=ordered.length?'block':'none';
  const ids=ordered.map(t=>t.id).join(',');
  if(box.dataset.ids!==ids){
    box.dataset.ids=ids;box.innerHTML='';
    ordered.forEach(t=>{
      const d=document.createElement('div');d.className='task';d.dataset.id=t.id;
      d.innerHTML=`<div class="task-head"><span class="task-ic"></span><span class="task-ttl"></span><span class="task-pct"></span></div><div class="progress-bar"><i></i></div><div class="task-msg"></div><div class="task-actions" style="display:none;"></div>`;
      box.appendChild(d);
    });
  }
  ordered.forEach(t=>{
    const d=box.querySelector(`.task[data-id="${t.id}"]`);if(!d)return;
    d.className='task '+(t.state==='done'?'done':t.state==='error'?'error':'');
    d.querySelector('.task-ic').textContent=t.state==='done'?'✓':t.state==='error'?'!':(t.kind==='video'?'▶':'▣');
    d.querySelector('.task-ttl').textContent=`${t.kind==='video'?'Video':'Foto'} · ${t.title}`;
    d.querySelector('.task-pct').textContent=t.state==='done'?'Selesai':Math.round(t.pct||0)+'%';
    d.querySelector('.progress-bar i').style.width=Math.round(t.pct||0)+'%';
    d.querySelector('.task-msg').textContent=t.msg||'';
    const act=d.querySelector('.task-actions');
    if(t.state==='error'){
      act.style.display='flex';
      if(!act.firstChild){
        act.innerHTML='<button class="primary" data-a="retry">Coba Lagi</button><button data-a="drop">Batalkan</button>';
        act.querySelector('[data-a=retry]').onclick=()=>{act.innerHTML='';runTask(t);};
        act.querySelector('[data-a=drop]').onclick=()=>{const k=tasks.indexOf(t);if(k>-1)tasks.splice(k,1);renderTasks();};
      }
    }else{act.style.display='none';act.innerHTML='';}
  });
}
async function doPhotos(t){
  const total=t.items.length;const totalBytes=t.items.reduce((s,it)=>s+((it.blob&&it.blob.size)||0),0)||1;
  const bytesDone=()=>t.items.reduce((s,it)=>s+(it.done?((it.blob&&it.blob.size)||0):0),0);
  try{
    for(let i=0;i<total;i++){
      const it=t.items[i];if(it.done)continue;
      const base=bytesDone();const n=t.items.filter(x=>x.done).length+1;
      setTask(t,(base/totalBytes)*100,`Mengunggah foto ${n} dari ${total} · ${fmtPair(base,totalBytes)}`);
      await uploadToDrive(it,'photo',t.name,loaded=>{const ob=base+(loaded||0);setTask(t,Math.min(99,(ob/totalBytes)*100),`Mengunggah foto ${n} dari ${total} · ${fmtPair(ob,totalBytes)}`);});
      it.done=true;
    }
    finishTask(t,true,`${total} foto sudah masuk`);
  }catch(err){finishTask(t,false,(err&&err.message)||'Belum berhasil. Coba lagi ya.');}
}
async function doVideo(t){
  try{
    if(!t.processed){
      setTask(t,0,'Menyiapkan bingkai…');
      if(!(await ensureFrame('video')))throw new Error('Bingkai video belum bisa dimuat (sinyal lemah?). Coba lagi ya, video tidak dikirim tanpa bingkai.');
      setTask(t,0,'Memproses video dengan bingkai…');
      t.processed=await processVideoWithFrame(t.file,p=>setTask(t,p*60,`Memproses video ${Math.round(p*100)}% (diputar real-time, jangan tutup halaman atau pindah tab)`));
    }
    setTask(t,60,'Mengunggah video…');
    await uploadToDrive(t,'video',t.name,(loaded,total)=>{const p=total?(loaded/total):0;setTask(t,60+p*39,`Mengunggah video · ${fmtPair(loaded,total)}`);});
    finishTask(t,true,'Video sudah masuk');
  }catch(err){finishTask(t,false,(err&&err.message)||'Belum berhasil. Coba lagi ya.');}
}

/* job: {blob|processed.blob, thumb|processed.thumb, cid, fileId, tries}. Idempotent lewat client_id; retry melanjutkan (fileId dipakai ulang). */
function xhrPut(url,blob,mime,onProgress){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();xhr.open('PUT',url);xhr.setRequestHeader('Content-Type',mime);xhr.timeout=300000;
    xhr.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded,e.total);};
    xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){try{resolve(JSON.parse(xhr.responseText).id);}catch(e){reject(new Error('Balasan upload tidak terbaca'));}}else reject(new Error('Upload gagal ('+xhr.status+')'));};
    xhr.onerror=()=>reject(new Error('Koneksi terputus saat upload'));xhr.ontimeout=()=>reject(new Error('Upload terlalu lama'));
    xhr.send(blob);
  });
}
async function checkDone(cid){
  try{const r=await fetch(`${APPS_SCRIPT_URL}?action=checkUpload&wedding_id=${encodeURIComponent(weddingId)}&client_ids=${encodeURIComponent(cid)}&deep=1`);const d=await r.json();
    const f=d&&(d.found||d.items||d.results);if(f&&f[cid])return true;if(Array.isArray(f))return f.some(x=>x&&(x.client_id===cid||x===cid));}catch(e){}
  return false;
}
async function uploadToDrive(job,type,guestName,onProgress){
  const data=job.processed||job;const blob=data.blob;const thumb=data.thumb||'';
  const mime=(blob.type||'application/octet-stream').split(';')[0];
  job.tries=(job.tries||0)+1;
  if(job.tries>1&&await checkDone(job.cid))return {success:true,duplicate:true};
  const base={wedding_id:weddingId,guest_name:guestName,media_type:type,client_id:job.cid,attempt:job.tries>1?2:1};
  if(!job.fileId){
    const init=await callServer(Object.assign({},base,{action:'initUpload',mime_type:mime,size:blob.size,origin:location.origin}));
    if(!init.success)throw new Error(init.message||'Gagal menyiapkan upload');
    job.fileId=await xhrPut(init.upload_url,blob,mime,onProgress);
  }
  const fin=await callServer(Object.assign({},base,{action:'finalizeUpload',file_id:job.fileId,thumb_data:thumb}));
  if(!fin.success)throw new Error(fin.message||'Gagal mencatat media');
  return fin;
}
async function callServer(payload,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{
      const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});
      const data=await res.json();
      if(data&&data.busy){last=new Error('Server sedang ramai, coba lagi ya');await sleepMs(900*(i+1)+Math.floor(Math.random()*600));continue;}
      return data;
    }catch(e){last=e;await sleepMs(700*(i+1));}
  }
  throw last||new Error('Koneksi bermasalah');
}

function fmtPair(loaded,total){
  loaded=Math.max(0,Number(loaded)||0);total=Math.max(1,Number(total)||0);
  if(total>=1048576){const f=n=>(n/1048576).toFixed(1).replace('.',',');return`${f(Math.min(loaded,total))} / ${f(total)} MB`;}
  const k=n=>Math.round(n/1024);
  return`${Math.min(k(loaded),k(total))} / ${Math.max(1,k(total))} KB`;
}
function formatDate(d){try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}

<!-- ============================================================
     PARENT SCRIPT: routing panel, lazy iframe, reload handler
     ============================================================ -->
<script>
(function(){
  const urlParams = new URLSearchParams(window.location.search);
  let weddingId = urlParams.get('w');
  if (weddingId) localStorage.setItem('active_wedding_id', weddingId);
  else weddingId = localStorage.getItem('active_wedding_id');

  if (!weddingId) {
    document.getElementById('empty').classList.add('show');
    return;
  }

  const TEMPLATES = { kirim:'tpl-kirim', album:'tpl-album', galeri:'tpl-galeri' };
  const loaded = { kirim:false, album:false, galeri:false };
  let currentTab = null;

  function frameOf(tab){ return document.querySelector('.panel[data-panel="'+tab+'"] iframe'); }
  function tell(tab, msg){
    const f = frameOf(tab);
    if (f && f.contentWindow) try { f.contentWindow.postMessage(msg, '*'); } catch(e){}
  }

  function createIframe(tab, background){
    const panel = document.querySelector('.panel[data-panel="'+tab+'"]');
    const tpl = document.getElementById(TEMPLATES[tab]);
    if (!panel || !tpl) return;
    panel.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.title = tab;
    iframe.name = background ? 'bg' : '';   // 'bg' = dimuat di latar belakang (kamera menunggu sampai tab dibuka)
    iframe.setAttribute('allow', 'camera; microphone; autoplay; fullscreen; clipboard-write');
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    iframe.srcdoc = tpl.innerHTML;
    panel.appendChild(iframe);
    loaded[tab] = true;
  }

  function activateTab(tab){
    if (!TEMPLATES[tab]) tab = 'kirim';
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab));
    if (!loaded[tab]) createIframe(tab, false);
    else {
      if (tab === 'album') tell('album', { type:'refreshAlbum' });
    }
    // beri tahu tiap tab: aktif / tidak (kamera di tab Kirim dilepas & dinyalakan mengikuti ini)
    Object.keys(TEMPLATES).forEach(t => { if (loaded[t]) tell(t, { type:'tabState', active: t === tab }); });
    currentTab = tab;
    schedulePreloadKirim();
    try {
      const p = new URLSearchParams(window.location.search);
      p.set('tab', tab);
      history.replaceState(null, '', '?' + p.toString());
    } catch(e){}
  }

  function reloadTab(tab){
    if (!TEMPLATES[tab]) return;
    const wasActive = currentTab === tab;
    loaded[tab] = false;
    tell(tab, { type:'shutdown' });         // lepas kamera/mikrofon dulu supaya iframe baru tidak berebut perangkat
    const panel = document.querySelector('.panel[data-panel="'+tab+'"]');
    setTimeout(() => {
      if (panel) panel.innerHTML = '';
      if (wasActive && currentTab === tab) activateTab(tab);
    }, 350);
  }

  // Muat tab Kirim di latar belakang (tanpa menyalakan kamera) supaya saat dibuka sudah siap.
  // Dilewati di HP RAM kecil dan mode hemat data.
  let preloadTimer = null;
  function schedulePreloadKirim(){
    if (loaded.kirim || preloadTimer) return;
    const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
    const saveData = navigator.connection && navigator.connection.saveData;
    if (lowEnd || saveData) return;
    preloadTimer = setTimeout(() => {
      preloadTimer = null;
      if (!loaded.kirim && currentTab && currentTab !== 'kirim') createIframe('kirim', true);
    }, 2500);
  }

  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'switchTab' && TEMPLATES[d.tab]) activateTab(d.tab);
    else if (d.type === 'reloadTab' && TEMPLATES[d.tab]) reloadTab(d.tab);
    else if (d.type === 'frameReady' && TEMPLATES[d.tab]) tell(d.tab, { type:'tabState', active: currentTab === d.tab });
  });

  const initial = urlParams.get('tab');
  activateTab(TEMPLATES[initial] ? initial : 'kirim');
})();
</script>
