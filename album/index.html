<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bagikan Momen — Wedding Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#440808; --primary-hover:#5A1010;
    --accent:#C9A66B; --accent-soft:#F5ECD9;
    --surface:#FFFFFF; --surface-2:#EFE9DF;
    --text:#1A1410; --text-2:#5A4D42; --text-3:#8A7B6E;
    --danger:#A02828; --success:#2F6B3F;
    --dark:#1A1410; --dark-2:#2A2320;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{height:100%;height:100dvh;background:var(--dark);overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#F5F1EB; touch-action:pan-y;
  }

  #app{position:relative; width:100%; height:100%; display:flex; flex-direction:column;}

  #statusScreen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:30px; background:var(--dark); z-index:50; gap:16px;
  }
  #statusScreen .icon{font-size:40px;color:var(--accent);}
  #statusScreen h2{font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:#F5F1EB; letter-spacing:-0.01em;}
  #statusScreen p{font-size:14px; color:#A99F94; max-width:320px; line-height:1.6;}
  #statusScreen button{
    margin-top:12px; padding:12px 28px; border-radius:4px; border:none;
    background:var(--accent); color:var(--dark); font-weight:700;
    font-family:inherit; font-size:14px; letter-spacing:0.01em; cursor:pointer;
  }

  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding:18px 20px;
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg, rgba(26,20,16,.72), transparent);
  }
  header .brand{
    font-family:'Fraunces',serif; font-weight:700;
    font-size:15px; color:#F5F1EB; letter-spacing:-0.01em;
  }
  header .brand small{
    display:block; font-family:'JetBrains Mono',monospace;
    font-size:10px; font-weight:400; opacity:.75;
    letter-spacing:0.06em; text-transform:uppercase; margin-top:2px;
  }
  header a.nav-link{
    color:#F5F1EB; text-decoration:none; font-size:12px;
    background:rgba(245,241,235,.14);
    padding:8px 14px; border-radius:4px; letter-spacing:0.01em;
    border:1px solid rgba(245,241,235,.14);
  }

  #cameraWrap{position:relative; flex:1; background:var(--dark); overflow:hidden;}
  #liveVideo,#recordedVideo{width:100%; height:100%; object-fit:cover; display:block;}
  #liveVideo.mirrored{transform:scaleX(-1);}
  #photoCanvasPreview{width:100%; height:100%; object-fit:cover; display:none;}
  #recordedVideo{display:none;}

  .rec-badge{
    position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:15;
    background:rgba(160,40,40,.92); padding:6px 14px; border-radius:20px;
    font-size:13px; font-family:'JetBrains Mono',monospace; font-weight:500;
    display:none; align-items:center; gap:6px;
  }
  .rec-badge .dot{width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}

  #voiceWrap{
    display:none; flex:1; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:20px;
    background:radial-gradient(circle at center, var(--dark-2), var(--dark));
  }
  .vn-orb{
    width:150px; height:150px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#A8874E);
    display:flex; align-items:center; justify-content:center;
    font-size:48px; color:var(--dark);
    box-shadow:0 0 0 8px rgba(201,166,107,.15);
  }
  .vn-orb.recording{animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(160,40,40,.4);}70%{box-shadow:0 0 0 26px rgba(160,40,40,0);}100%{box-shadow:0 0 0 0 rgba(160,40,40,0);}}
  #vnTimer{
    font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:500;
    letter-spacing:0.04em; color:#F5F1EB;
  }
  #vnHint{font-size:13px; color:#A99F94; text-align:center; line-height:1.55; max-width:320px;}
  #vnPlayer{width:85%; display:none;}

  #bottomOverlay{position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; flex-direction:column;}

  #filmstrip{
    display:none; gap:8px; padding:12px 16px; overflow-x:auto;
    background:rgba(26,20,16,.55);
  }
  .shot-thumb{
    position:relative; flex:0 0 auto; width:56px; height:56px;
    border-radius:2px; overflow:hidden;
    border:1px solid rgba(245,241,235,.3);
  }
  .shot-thumb img{width:100%; height:100%; object-fit:cover;}
  .shot-thumb .remove-shot{
    position:absolute; top:-2px; right:-2px; width:18px; height:18px;
    border-radius:50%; background:var(--danger); color:#fff; font-size:11px;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
  }
  .shot-counter{
    align-self:center; font-size:12px; color:#F5F1EB;
    font-family:'JetBrains Mono',monospace;
    white-space:nowrap; padding:0 6px;
  }

  #controls{
    padding:16px 20px max(24px, env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(26,20,16,.88) 30%, transparent);
  }
  .mode-switch{display:flex; justify-content:center; gap:26px; margin-bottom:18px;}
  .mode-switch button{
    background:none; border:none; color:rgba(245,241,235,.5);
    font-family:inherit; font-size:12px; font-weight:600;
    letter-spacing:0.08em; padding:6px 4px;
    border-bottom:2px solid transparent; cursor:pointer;
  }
  .mode-switch button.active{color:#F5F1EB; border-color:var(--accent);}

  .capture-row{display:flex; align-items:center; justify-content:center; gap:36px;}
  .side-btn{
    width:44px; height:44px; border-radius:50%;
    background:rgba(245,241,235,.15); border:1px solid rgba(245,241,235,.15);
    color:#F5F1EB; font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  #shutterBtn{
    width:74px; height:74px; border-radius:50%;
    background:#F5F1EB; border:5px solid rgba(245,241,235,.4);
    cursor:pointer; transition:transform .1s;
  }
  #shutterBtn:active{transform:scale(.96);}
  #shutterBtn.video-mode{background:var(--danger);}
  #shutterBtn.recording{border-radius:4px; width:34px; height:34px;}
  #shutterBtn:disabled{opacity:.4;}

  .finish-row{display:none; gap:14px; justify-content:center; align-items:center; margin-top:16px;}
  .finish-row button{
    padding:14px 26px; border-radius:4px; border:none;
    font-family:inherit; font-weight:700; font-size:14px; letter-spacing:0.01em;
    cursor:pointer;
  }
  /* #finishBtn{background:var(--accent); color:var(--dark);} */
   #finishBtn{background:var(--accent); color:#ffffff;}
  .vn-controls{display:none; gap:16px; justify-content:center; align-items:center;}
  #vnRecordBtn{
    background:var(--danger); color:#fff; width:64px; height:64px;
    border-radius:50%; font-size:22px; padding:0; border:none; cursor:pointer;
  }
  #vnRedoBtn,#vnPlayBtn{
    background:rgba(245,241,235,.15); color:#F5F1EB;
    padding:14px 22px; border-radius:4px; border:1px solid rgba(245,241,235,.15);
    font-family:inherit; font-weight:600; font-size:13px; cursor:pointer;
  }
  #vnSendBtn{
    background:var(--accent); color:var(--dark);
    padding:14px 22px; border-radius:4px; border:none;
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
  }

  .review-row{display:none; gap:14px; justify-content:center; align-items:center;}
  .review-row button{
    padding:14px 26px; border-radius:4px; border:none;
    font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  #retakeBtn{
    background:rgba(245,241,235,.15); color:#F5F1EB;
    border:1px solid rgba(245,241,235,.15);
  }
  #sendMediaBtn{background:var(--accent); color:var(--dark);}

  .name-field{max-width:400px; margin:0 auto 14px;}
  .name-field input{
    width:100%; padding:13px 14px; border-radius:4px;
    border:1.5px solid rgba(245,241,235,.22);
    background:rgba(245,241,235,.06); color:#F5F1EB;
    font-family:inherit; font-size:16px;
    transition:border-color .15s,box-shadow .15s;
  }
  .name-field input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(201,166,107,.22);
  }
  .name-field input::placeholder{color:rgba(245,241,235,.45);}

  .toast{
    position:absolute; bottom:110px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--dark); padding:12px 20px; border-radius:4px;
    font-size:13px; max-width:85%; text-align:center; display:none;
    border:1px solid rgba(245,241,235,.12); color:#F5F1EB;
  }
  .toast.success{background:var(--success);} .toast.error{background:var(--danger);}

  .upload-pill{
    position:absolute; top:max(64px, calc(env(safe-area-inset-top) + 56px));
    left:50%; transform:translateX(-50%); z-index:55; display:none;
    align-items:center; gap:12px; min-width:200px; max-width:92%;
    padding:12px 16px 14px; border-radius:4px;
    background:rgba(26,20,16,.86); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-size:13px; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    border:1px solid rgba(245,241,235,.1); color:#F5F1EB;
  }
  .upload-pill .bar{position:absolute; left:0; bottom:0; height:3px; width:0; background:var(--accent); transition:width .25s;}
  .upload-pill.ok .bar{background:var(--success);} .upload-pill.warn .bar{background:#D8A24A;}
  /* .upload-pill button{border:none; background:var(--accent); color:var(--dark); border-radius:4px; padding:7px 12px; font-weight:700; font-size:12px; font-family:inherit; cursor:pointer;} */
  .upload-pill button{border:none; background:var(--accent); color:#ffffff; border-radius:4px; padding:7px 12px; font-weight:700; font-size:12px; font-family:inherit; cursor:pointer;}

  .result-overlay{
    position:absolute; inset:0; z-index:90; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(26,20,16,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .result-overlay.show{display:flex; animation:fadeInBg .2s ease-out;}
  @keyframes fadeInBg{from{opacity:0;}to{opacity:1;}}
  .result-card{
    width:100%; max-width:360px;
    background:#F5F1EB; color:var(--text);
    border-radius:8px; padding:32px 28px 24px; text-align:center;
    box-shadow:0 16px 48px rgba(68,8,8,.24);
    animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2);
    border:1px solid #E5DDD1;
  }
  @keyframes cardIn{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
  .result-icon{
    width:68px; height:68px; margin:0 auto 16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft);
  }
  .result-icon svg{width:34px; height:34px; stroke:var(--accent); fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
  .result-card.success .result-icon{background:#E4F0E6;} .result-card.success .result-icon svg{stroke:var(--success);}
  .result-card.success .result-icon path{stroke-dasharray:40; stroke-dashoffset:40; animation:drawCheck .5s .15s ease-out forwards;}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}
  .result-card.error .result-icon{background:#F7E4E2;} .result-card.error .result-icon svg{stroke:var(--danger);}
  .result-card.warn .result-icon{background:var(--accent-soft);} .result-card.warn .result-icon svg{stroke:#8A6A1A;}
  .result-card h3{font-family:'Fraunces',serif; font-size:20px; font-weight:700; margin-bottom:10px; color:var(--text); letter-spacing:-0.01em;}
  .result-card p{font-size:14px; line-height:1.6; color:var(--text-2); white-space:pre-line; margin-bottom:22px;}
  .result-card button{
    display:block; width:100%; padding:13px; border-radius:4px; border:none;
    font-family:inherit; font-size:14px; font-weight:700; letter-spacing:0.01em; cursor:pointer;
  }
  #resultPrimary{background:var(--primary); color:#fff; margin-bottom:8px;}
  #resultPrimary:hover{background:var(--primary-hover);}
  #resultSecondary{background:transparent; color:var(--text-3); font-weight:600;}
</style>
</head>
<body>
<div id="app">

  <div id="statusScreen">
    <div class="icon">◈</div>
    <h2 id="statusTitle">Menyiapkan kamera…</h2>
    <p id="statusText">Sebentar ya, kami siapkan semuanya untukmu</p>
    <button id="statusBtn" style="display:none;" onclick="location.reload()">Coba Lagi</button>
  </div>

  <header>
    <div class="brand"><span id="brandName">Wedding Album</span><small id="brandDate"></small></div>
    <a class="nav-link" href="#" id="toAlbumLink">Lihat Album →</a>
  </header>

  <div class="rec-badge" id="recBadge"><span class="dot"></span> <span id="recTimer">00:00</span></div>

  <div id="cameraWrap">
    <video id="liveVideo" autoplay playsinline muted></video>
    <canvas id="photoCanvasPreview"></canvas>
    <video id="recordedVideo" playsinline controls></video>
  </div>

  <div id="voiceWrap">
    <div class="vn-orb" id="vnOrb">🎤</div>
    <div id="vnTimer">00:00</div>
    <p id="vnHint">Ketuk tombol merah, lalu ucapkan doa & harapanmu</p>
    <audio id="vnPlayer" controls></audio>
    <video id="vnVideoPlayer" playsinline controls style="display:none;width:85%;border-radius:4px;"></video>
  </div>

  <div class="toast" id="toast"></div>

  <div class="upload-pill" id="uploadPill" role="status" aria-live="polite">
    <span id="pillText">Mengirim…</span><button id="pillBtn" style="display:none;" onclick="retryFailed()">Kirim ulang</button>
    <div class="bar" id="pillBar"></div>
  </div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card success" id="resultCard" role="dialog" aria-modal="true">
      <div class="result-icon"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h3 id="resultTitle"></h3>
      <p id="resultText"></p>
      <button id="resultPrimary"></button>
      <button id="resultSecondary"></button>
    </div>
  </div>

  <div id="bottomOverlay">
    <div id="filmstrip"></div>

    <div id="controls">
    <div class="name-field">
      <input type="text" id="guestName" placeholder="Tulis namamu di sini" maxlength="40" autocomplete="name" enterkeyhint="done">
    </div>

    <div class="mode-switch" id="modeSwitch">
      <button data-mode="photo" class="active">FOTO</button>
      <button data-mode="video">VIDEO</button>
      <button data-mode="voice">SUARA</button>
    </div>

    <div class="capture-row" id="captureRow">
      <button class="side-btn" id="flipBtn" title="Ganti kamera">🔄</button>
      <button id="shutterBtn"></button>
      <div style="width:44px;"></div>
    </div>

    <div class="finish-row" id="finishRow">
      <button id="finishBtn">Kirim Foto</button>
    </div>

    <div class="vn-controls" id="vnControlsIdle">
      <button id="vnRecordBtn">●</button>
    </div>
    <div class="vn-controls" id="vnControlsReview">
      <button id="vnRedoBtn">Ulang</button>
      <button id="vnPlayBtn">Putar</button>
      <button id="vnSendBtn">Kirim Suara</button>
    </div>

    <div class="review-row" id="reviewRow">
      <button id="retakeBtn">Ambil Ulang</button>
      <button id="sendMediaBtn">Kirim Video</button>
    </div>
  </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5oH41qOF8tlHPVGVm5T_iT5KD-CfblVL6Yu9oGKp9t7eP6ewOGvh4KnmG1qfKv3F_/exec';
let MAX_SHOTS = 5;

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

const urlParams = new URLSearchParams(window.location.search);
let weddingId = urlParams.get('w');
if (weddingId) localStorage.setItem('active_wedding_id', weddingId);
else weddingId = localStorage.getItem('active_wedding_id');

document.getElementById('toAlbumLink').href = weddingId ? `album.html?w=${encodeURIComponent(weddingId)}` : '#';

if (!weddingId) {
  showStatus('Link Belum Lengkap', 'Link ini belum berisi kode undangan. Minta mempelai mengirimkan ulang link yang benar ya.', false);
  throw new Error('no wedding id');
}

function pickSupportedMime(candidates) {
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c.mime)) return c;
  }
  return candidates[candidates.length - 1];
}
const VIDEO_MIME = pickSupportedMime([
  { mime: 'video/mp4;codecs=h264,aac', ext: 'mp4' },
  { mime: 'video/mp4', ext: 'mp4' },
  { mime: 'video/webm;codecs=vp9,opus', ext: 'webm' },
  { mime: 'video/webm;codecs=vp8,opus', ext: 'webm' },
  { mime: 'video/webm', ext: 'webm' }
]);
const AUDIO_MIME = pickSupportedMime([
  { mime: 'audio/mp4;codecs=mp4a.40.2', ext: 'm4a' },
  { mime: 'audio/mp4', ext: 'm4a' },
  { mime: 'audio/webm;codecs=opus', ext: 'webm' },
  { mime: 'audio/webm', ext: 'webm' }
]);

let weddingSettings = null;

const QUALITY_PRESETS = {
  photo: {
    standard: { width: 1280, height: 720, jpegQuality: 0.85 },
    high:     { width: 1920, height: 1080, jpegQuality: 0.92 },
    max:      { width: 3840, height: 2160, jpegQuality: 0.97 }
  },
  video: {
    standard: { width: 1280, height: 720, videoBitsPerSecond: 2500000, audioBitsPerSecond: 96000 },
    high:     { width: 1920, height: 1080, videoBitsPerSecond: 6000000, audioBitsPerSecond: 128000 },
    max:      { width: 1920, height: 1080, videoBitsPerSecond: 10000000, audioBitsPerSecond: 192000 }
  },
  voice: {
    standard: { audioBitsPerSecond: 64000 },
    high:     { audioBitsPerSecond: 128000 }
  }
};

function getQuality(type) {
  const uiConfig = (weddingSettings && weddingSettings.ui_config) || {};
  const q = uiConfig.quality || {};
  const level = q[type] || 'high';
  let out;
  if (level === 'custom') {
    const custom = (uiConfig.quality_custom && uiConfig.quality_custom[type]) || {};
    out = Object.assign({}, QUALITY_PRESETS[type].high, custom);
  } else {
    out = Object.assign({}, QUALITY_PRESETS[type][level] || QUALITY_PRESETS[type].high);
  }
  const ct = (navigator.connection && navigator.connection.effectiveType) || '';
  const slow = /(^|-)2g|3g/.test(ct);
  if (type === 'photo') {
    out.width = Math.min(out.width, IS_LOW_END ? 1280 : 2560);
    out.height = Math.min(out.height, IS_LOW_END ? 720 : 1440);
    if (IS_LOW_END || slow) out.jpegQuality = Math.min(out.jpegQuality, 0.82);
  } else if (type === 'video') {
    out.width = Math.min(out.width, IS_LOW_END ? 1280 : 1920);
    out.height = Math.min(out.height, IS_LOW_END ? 720 : 1080);
    const cap = slow ? 1200000 : (IS_LOW_END ? 1800000 : 8000000);
    out.videoBitsPerSecond = Math.min(out.videoBitsPerSecond, cap);
    out.audioBitsPerSecond = Math.min(out.audioBitsPerSecond, slow ? 64000 : 128000);
  } else if (type === 'voice') {
    out.audioBitsPerSecond = Math.min(out.audioBitsPerSecond, slow ? 48000 : 96000);
  }
  return out;
}
let activeFilterCss = 'none';
let activeFilterParams = null;

let canvasFilterSupported = (function testCanvasFilterSupport() {
  try {
    const c = document.createElement('canvas');
    c.width = 2; c.height = 2;
    const cx = c.getContext('2d');
    cx.fillStyle = '#000'; cx.fillRect(0, 0, 2, 2);
    cx.filter = 'invert(1)';
    cx.fillRect(0, 0, 2, 2);
    const px = cx.getImageData(0, 0, 1, 1).data;
    return px[0] > 200;
  } catch (e) { return false; }
})();

function parseFilterString(filterStr) {
  const ops = [];
  if (!filterStr || filterStr === 'none') return ops;
  const re = /([a-z-]+)\(([^)]+)\)/g;
  let m;
  while ((m = re.exec(filterStr)) !== null) {
    const name = m[1];
    let val = parseFloat(m[2]);
    if (name === 'hue-rotate') val = parseFloat(m[2]);
    ops.push({ name, val });
  }
  return ops;
}

function applyManualFilter(ctx, w, h, filterStr) {
  const ops = parseFilterString(filterStr);
  if (ops.length === 0) return;
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];

    ops.forEach(op => {
      if (op.name === 'brightness') { r*=op.val; g*=op.val; b*=op.val; }
      else if (op.name === 'contrast') { r=(r-128)*op.val+128; g=(g-128)*op.val+128; b=(b-128)*op.val+128; }
      else if (op.name === 'saturate') {
        const l = 0.2126*r + 0.7152*g + 0.0722*b;
        r = l + (r-l)*op.val; g = l + (g-l)*op.val; b = l + (b-l)*op.val;
      } else if (op.name === 'sepia') {
        const a = op.val;
        const sr = 0.393*r + 0.769*g + 0.189*b;
        const sg = 0.349*r + 0.686*g + 0.168*b;
        const sb = 0.272*r + 0.534*g + 0.131*b;
        r = r + (sr-r)*a; g = g + (sg-g)*a; b = b + (sb-b)*a;
      } else if (op.name === 'grayscale') {
        const l = 0.2126*r + 0.7152*g + 0.0722*b;
        r = r + (l-r)*op.val; g = g + (l-g)*op.val; b = b + (l-b)*op.val;
      } else if (op.name === 'hue-rotate') {
        const rad = op.val * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const nr = r*(0.213+cos*0.787-sin*0.213) + g*(0.715-cos*0.715-sin*0.715) + b*(0.072-cos*0.072+sin*0.928);
        const ng = r*(0.213-cos*0.213+sin*0.143) + g*(0.715+cos*0.285+sin*0.140) + b*(0.072-cos*0.072-sin*0.283);
        const nb = r*(0.213-cos*0.213-sin*0.787) + g*(0.715-cos*0.715+sin*0.715) + b*(0.072+cos*0.928+sin*0.072);
        r = nr; g = ng; b = nb;
      }
    });

    d[i] = Math.max(0, Math.min(255, r));
    d[i+1] = Math.max(0, Math.min(255, g));
    d[i+2] = Math.max(0, Math.min(255, b));
  }
  ctx.putImageData(imgData, 0, 0);
}

function drawWithGuaranteedFilter(ctx, drawFn, w, h, isRealtime) {
  const p = activeFilterParams ? (isRealtime ? activeFilterParams.video : activeFilterParams.photo) : null;
  if (p && Object.keys(p).length > 0) {
    if (isRealtime) {
      if (canvasFilterSupported) {
        ctx.filter = approximateCssFromParams(p);
        drawFn();
        ctx.filter = 'none';
      } else {
        drawFn();
      }
      return;
    }
    drawFn();
    const imgData = ctx.getImageData(0, 0, w, h);
    applyToneColorPass(imgData, p);
    const result = applyDetailPass(imgData, p);
    ctx.putImageData(result, 0, 0);
  } else if (canvasFilterSupported) {
    ctx.filter = activeFilterCss;
    drawFn();
    ctx.filter = 'none';
  } else if (isRealtime) {
    drawFn();
  } else {
    drawFn();
    applyManualFilter(ctx, w, h, activeFilterCss);
  }
}

function clamp255_(v) { return v < 0 ? 0 : (v > 255 ? 255 : v); }

function applyToneColorPass(imageData, p) {
  const d = imageData.data;
  const w = imageData.width, h = imageData.height;
  const expFactor = Math.pow(2, (p.exposure || 0) / 100);
  const conFactor = 1 + (p.contrast || 0) / 100;
  const brightAdd = (p.brightness || 0) / 100 * 90;
  const bpAmt = (p.blackPoint || 0) / 100 * 60;
  const satFactor = 1 + (p.saturation || 0) / 100;
  const vibAmt = (p.vibrancy || 0) / 100;
  const warmAmt = (p.warmth || 0) / 100 * 40;
  const tintAmt = (p.tint || 0) / 100 * 40;
  const brillAmt = (p.brilliance || 0) / 100;
  const highAmt = (p.highlights || 0) / 100;
  const shadAmt = (p.shadows || 0) / 100;
  const vigAmt = (p.vignette || 0) / 100;
  const cx = w / 2, cy = h / 2, maxDist = Math.sqrt(cx * cx + cy * cy) || 1;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    r *= expFactor; g *= expFactor; b *= expFactor;

    let L = 0.2126 * r + 0.7152 * g + 0.0722 * b;

    if (brillAmt !== 0) {
      const shadowLift = Math.max(0, (140 - L) / 140) * brillAmt * 40;
      const highlightTame = Math.max(0, (L - 180) / 75) * brillAmt * -25;
      const d2 = shadowLift + highlightTame;
      r += d2; g += d2; b += d2;
    }
    if (highAmt !== 0) {
      const wgt = Math.max(0, Math.min(1, (L - 140) / 115));
      const d3 = highAmt * 70 * wgt;
      r += d3; g += d3; b += d3;
    }
    if (shadAmt !== 0) {
      const wgt = Math.max(0, Math.min(1, (115 - L) / 115));
      const d4 = shadAmt * 70 * wgt;
      r += d4; g += d4; b += d4;
    }

    r = (r - 128) * conFactor + 128;
    g = (g - 128) * conFactor + 128;
    b = (b - 128) * conFactor + 128;

    r += brightAdd; g += brightAdd; b += brightAdd;

    if (bpAmt !== 0) {
      r += bpAmt * (1 - r / 255);
      g += bpAmt * (1 - g / 255);
      b += bpAmt * (1 - b / 255);
    }

    L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    r = L + (r - L) * satFactor;
    g = L + (g - L) * satFactor;
    b = L + (b - L) * satFactor;

    if (vibAmt !== 0) {
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const curSat = (mx - mn) / 255;
      const amt = vibAmt * (1 - curSat);
      L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      r = L + (r - L) * (1 + amt);
      g = L + (g - L) * (1 + amt);
      b = L + (b - L) * (1 + amt);
    }

    r += warmAmt; b -= warmAmt;
    g += tintAmt; r -= tintAmt * 0.5; b -= tintAmt * 0.5;

    if (vigAmt !== 0) {
      const idx = i / 4;
      const x = idx % w, y = Math.floor(idx / w);
      const dist = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / maxDist;
      const fall = Math.max(0, dist - 0.4) * vigAmt * 1.6;
      const factor = 1 - fall;
      r *= factor; g *= factor; b *= factor;
    }

    d[i] = clamp255_(r); d[i + 1] = clamp255_(g); d[i + 2] = clamp255_(b);
  }
}

function applyDetailPass(imageData, p) {
  let data = imageData;
  if ((p.noiseReduction || 0) > 0) data = boxBlurPass_(data, Math.round((p.noiseReduction / 100) * 3));
  if ((p.sharpness || 0) !== 0) data = convolveSharpen_(data, (p.sharpness || 0) / 100);
  if ((p.definition || 0) !== 0) data = localContrastPass_(data, (p.definition || 0) / 100);
  return data;
}

function boxBlurPass_(imageData, radius) {
  if (radius <= 0) return imageData;
  const w = imageData.width, h = imageData.height;
  const src = imageData.data;
  const out = new Uint8ClampedArray(src.length);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let r=0,g=0,b=0,a=0,count=0;
      for (let dy=-radius; dy<=radius; dy++) {
        for (let dx=-radius; dx<=radius; dx++) {
          const nx=x+dx, ny=y+dy;
          if (nx<0||ny<0||nx>=w||ny>=h) continue;
          const idx=(ny*w+nx)*4;
          r+=src[idx]; g+=src[idx+1]; b+=src[idx+2]; a+=src[idx+3]; count++;
        }
      }
      const oidx=(y*w+x)*4;
      out[oidx]=r/count; out[oidx+1]=g/count; out[oidx+2]=b/count; out[oidx+3]=a/count;
    }
  }
  return new ImageData(out, w, h);
}

function convolveSharpen_(imageData, amount) {
  const w = imageData.width, h = imageData.height;
  const src = imageData.data;
  const out = new Uint8ClampedArray(src.length);
  const center = 1 + 4*amount, side = -amount;
  const get = (nx, ny, c) => {
    nx = Math.max(0, Math.min(w-1, nx)); ny = Math.max(0, Math.min(h-1, ny));
    return src[(ny*w+nx)*4+c];
  };
  for (let y=0;y<h;y++){
    for (let x=0;x<w;x++){
      const idx=(y*w+x)*4;
      for (let c=0;c<3;c++){
        out[idx+c] = get(x,y,c)*center + get(x-1,y,c)*side + get(x+1,y,c)*side + get(x,y-1,c)*side + get(x,y+1,c)*side;
      }
      out[idx+3]=src[idx+3];
    }
  }
  return new ImageData(out, w, h);
}

function localContrastPass_(imageData, amount) {
  const w = imageData.width, h = imageData.height;
  const blurred = boxBlurPass_(imageData, 2);
  const src = imageData.data, blur = blurred.data;
  const out = new Uint8ClampedArray(src.length);
  for (let i=0;i<src.length;i+=4){
    for (let c=0;c<3;c++){
      const diff = src[i+c]-blur[i+c];
      out[i+c] = src[i+c] + diff*amount*1.5;
    }
    out[i+3]=src[i+3];
  }
  return new ImageData(out, w, h);
}

function approximateCssFromParams(p) {
  const brightness = 1 + ((p.exposure||0) + (p.brightness||0)*0.5) / 150;
  const contrast = 1 + (p.contrast||0) / 130;
  const saturate = 1 + ((p.saturation||0) + (p.vibrancy||0)*0.6) / 130;
  const hue = (p.warmth||0) * -0.6;
  return `brightness(${brightness}) contrast(${contrast}) saturate(${saturate}) hue-rotate(${hue}deg)`;
}

function drawCheapVignette(ctx, w, h, amount) {
  const amt = Math.max(0, Math.min(100, amount)) / 100;
  if (amt <= 0) return;
  const cx = w / 2, cy = h / 2, r = Math.sqrt(cx*cx + cy*cy);
  const grad = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${amt * 0.65})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

const SMALL_UPLOAD_BYTES = 1500000;
const IS_LOW_END = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
const MAX_PARALLEL_UPLOADS = IS_LOW_END ? 1 : 2;
const MAX_TRIES = 4;

const uploadJobs = [];
let activeUploads = 0;
let sessionStats = { ok: 0, fail: 0, pending: 0, live: 0, types: {}, lastMessage: '' };
let modalShownFor = 0;

function sleepMs(ms) { return new Promise(r => setTimeout(r, ms)); }

function xhrSend(method, url, body, headers, onProgress, timeoutMs) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    Object.keys(headers || {}).forEach(k => x.setRequestHeader(k, headers[k]));
    x.timeout = timeoutMs || 90000;
    if (onProgress && x.upload) x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => resolve({ status: x.status, text: x.responseText });
    x.onerror = () => reject(new Error('network'));
    x.ontimeout = () => reject(new Error('timeout'));
    x.send(body);
  });
}

async function callServer(payload, onProgress) {
  const r = await xhrSend('POST', APPS_SCRIPT_URL, JSON.stringify(payload), { 'Content-Type': 'text/plain;charset=utf-8' }, onProgress, 120000);
  let data; try { data = JSON.parse(r.text); } catch (e) { throw new Error('bad_response'); }
  return data;
}

function enqueueUpload(job) {
  job.state = 'queued'; job.tries = 0; job.progress = 0; job.id = Date.now() + Math.random();
  uploadJobs.push(job);
  sessionStats.pending++;
  renderPill();
  pumpUploads();
}

function pumpUploads() {
  while (activeUploads < MAX_PARALLEL_UPLOADS) {
    const job = uploadJobs.find(j => j.state === 'queued');
    if (!job) break;
    activeUploads++;
    job.state = 'uploading';
    runJob(job).finally(() => { activeUploads--; pumpUploads(); renderPill(); maybeShowResult(); });
  }
}

async function runJob(job) {
  while (job.tries < MAX_TRIES) {
    job.tries++;
    try {
      if (!navigator.onLine) await waitOnline();
      const res = await uploadOnce(job);
      job.state = 'done'; job.progress = 1;
      sessionStats.ok++; sessionStats.pending--;
      sessionStats.types[job.type] = (sessionStats.types[job.type] || 0) + 1;
      if (res && res.status === 'approved') sessionStats.live++;
      if (res && res.message) sessionStats.lastMessage = res.message;
      job.blob = null; job.thumb = null;
      return;
    } catch (e) {
      if (e.fatal) { job.state = 'failed'; job.error = e.message; sessionStats.fail++; sessionStats.pending--; return; }
      if (job.tries >= MAX_TRIES) break;
      job.state = 'retrying'; renderPill();
      await sleepMs(1200 * job.tries);
      job.state = 'uploading';
    }
  }
  job.state = 'failed'; job.error = job.error || 'network';
  sessionStats.fail++; sessionStats.pending--;
}

function waitOnline() {
  return new Promise(res => { const f = () => { window.removeEventListener('online', f); res(); }; window.addEventListener('online', f); });
}

function fatalError(msg) { const e = new Error(msg); e.fatal = true; return e; }

async function uploadOnce(job) {
  const base = { wedding_id: weddingId, guest_name: job.guest, media_type: job.type, caption: job.caption || '' };
  const setP = p => { job.progress = p; renderPill(); };

  if (job.blob.size > SMALL_UPLOAD_BYTES && !job.noDirect) {
    try {
      const init = await callServer(Object.assign({}, base, { action: 'initUpload', mime_type: job.mime, size: job.blob.size, origin: location.origin }));
      if (!init.success) {
        if (init.code === 'type_off') throw fatalError(init.message);
        if (!init.fallback && init.busy !== true) throw fatalError(init.message || 'Gagal menyiapkan pengiriman');
        throw new Error('direct_unavailable');
      }
      const put = await xhrSend('PUT', init.upload_url, job.blob, { 'Content-Type': job.mime }, p => setP(p * 0.9), 300000);
      if (put.status < 200 || put.status > 299) throw new Error('direct_failed');
      const fileId = JSON.parse(put.text).id;
      const fin = await callServer(Object.assign({}, base, { action: 'finalizeUpload', file_id: fileId, thumb_data: job.thumb || '' }));
      if (!fin.success) { if (fin.code === 'type_off') throw fatalError(fin.message); throw new Error(fin.message || 'finalize_failed'); }
      return fin;
    } catch (e) {
      if (e.fatal) throw e;
      job.noDirect = true;
      job.progress = 0;
    }
  }

  const b64 = await blobToBase64(job.blob);
  const res = await callServer(Object.assign({}, base, {
    action: 'uploadMedia', filename: 'capture.' + job.ext, mime_type: job.mime, data: b64, thumb_data: job.thumb || ''
  }), p => setP(p * 0.95));
  if (!res.success) { if (res.code === 'type_off') throw fatalError(res.message); throw new Error(res.message || 'upload_failed'); }
  return res;
}

function renderPill() {
  const pill = document.getElementById('uploadPill');
  const total = uploadJobs.length;
  if (total === 0) { pill.style.display = 'none'; return; }
  const active = uploadJobs.filter(j => j.state === 'queued' || j.state === 'uploading' || j.state === 'retrying');
  const failed = uploadJobs.filter(j => j.state === 'failed');
  const done = uploadJobs.filter(j => j.state === 'done').length;
  const prog = uploadJobs.reduce((s, j) => s + (j.state === 'done' ? 1 : (j.state === 'failed' ? 1 : j.progress || 0)), 0) / total;
  pill.style.display = 'flex';
  const txt = document.getElementById('pillText');
  const bar = document.getElementById('pillBar');
  const btn = document.getElementById('pillBtn');
  bar.style.width = Math.round(prog * 100) + '%';
  btn.style.display = 'none';
  if (active.length > 0) {
    const retrying = active.some(j => j.state === 'retrying');
    txt.textContent = retrying ? 'Sinyal kurang stabil, mencoba lagi…' : `Mengirim ${done + 1} dari ${total} · ${Math.round(prog * 100)}%`;
    pill.className = 'upload-pill';
  } else if (failed.length > 0) {
    txt.textContent = `${failed.length} momen belum terkirim`;
    btn.style.display = 'inline-block'; btn.textContent = 'Kirim ulang';
    pill.className = 'upload-pill warn';
  } else {
    txt.textContent = 'Semua momen sudah terkirim';
    pill.className = 'upload-pill ok';
    setTimeout(() => { if (!uploadJobs.some(j => j.state !== 'done')) pill.style.display = 'none'; }, 3500);
  }
}

function retryFailed() {
  uploadJobs.filter(j => j.state === 'failed').forEach(j => { j.state = 'queued'; j.tries = 0; j.noDirect = false; j.progress = 0; sessionStats.fail--; sessionStats.pending++; });
  closeResultModal();
  renderPill(); pumpUploads();
}

window.addEventListener('beforeunload', e => {
  if (uploadJobs.some(j => j.state !== 'done' && j.state !== 'failed')) { e.preventDefault(); e.returnValue = ''; }
});

function maybeShowResult() {
  const busy = uploadJobs.some(j => j.state === 'queued' || j.state === 'uploading' || j.state === 'retrying');
  if (busy || uploadJobs.length === 0) return;
  if (modalShownFor === uploadJobs.length) return;
  modalShownFor = uploadJobs.length;
  const ok = uploadJobs.filter(j => j.state === 'done').length;
  const failed = uploadJobs.filter(j => j.state === 'failed');
  const fatalMsg = failed.find(j => j.error && j.error !== 'network' && j.error !== 'upload_failed');
  const labels = { photo: 'foto', video: 'video', voice: 'voice note' };
  const parts = Object.keys(sessionStats.types).map(t => `${sessionStats.types[t]} ${labels[t]}`);

  if (failed.length === 0) {
    const live = sessionStats.live >= ok;
    openResultModal({
      kind: 'success',
      title: 'Terkirim',
      text: `Terima kasih sudah ikut mengabadikan momen.\n${parts.join(' & ')} kamu ` + (live ? 'sudah tampil di album.' : 'sedang menunggu persetujuan mempelai. Setelah disetujui, otomatis tampil di album.'),
      primary: { label: 'Lihat Album', href: document.getElementById('toAlbumLink').href },
      secondary: { label: 'Kirim Lagi', fn: closeResultModal }
    });
  } else if (ok > 0) {
    openResultModal({
      kind: 'warn', title: 'Sebagian sudah terkirim',
      text: `${ok} berhasil, ${failed.length} belum.\nYang belum terkirim masih aman di HP-mu — coba kirim lagi ya.`,
      primary: { label: 'Kirim Ulang', fn: retryFailed }, secondary: { label: 'Nanti Saja', fn: closeResultModal }
    });
  } else {
    openResultModal({
      kind: 'error', title: fatalMsg ? 'Pengiriman ditutup' : 'Belum berhasil terkirim',
      text: fatalMsg ? fatalMsg.error : 'Sinyal sepertinya kurang stabil.\nMomenmu masih aman di HP — coba kirim lagi sebentar lagi.',
      primary: fatalMsg ? { label: 'Mengerti', fn: closeResultModal } : { label: 'Coba Lagi', fn: retryFailed },
      secondary: fatalMsg ? null : { label: 'Nanti Saja', fn: closeResultModal }
    });
  }
}

function openResultModal(o) {
  const ov = document.getElementById('resultOverlay');
  const card = document.getElementById('resultCard');
  card.className = 'result-card ' + o.kind;
  document.getElementById('resultTitle').textContent = o.title;
  document.getElementById('resultText').textContent = o.text;
  const p = document.getElementById('resultPrimary'), s = document.getElementById('resultSecondary');
  p.textContent = o.primary.label; p.onclick = o.primary.fn || (() => { location.href = o.primary.href; });
  if (o.secondary) { s.style.display = 'block'; s.textContent = o.secondary.label; s.onclick = o.secondary.fn; } else s.style.display = 'none';
  ov.classList.add('show');
}
function closeResultModal() { document.getElementById('resultOverlay').classList.remove('show'); }

function makeThumbDataUri(source, sw, sh) {
  const scale = Math.min(1, 360 / Math.max(sw, 1));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * scale)); c.height = Math.max(1, Math.round(sh * scale));
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  let q = 0.62, uri = c.toDataURL('image/jpeg', q);
  while (uri.length > 42000 && q > 0.2) { q -= 0.1; uri = c.toDataURL('image/jpeg', q); }
  c.width = c.height = 1;
  return uri.length <= 42000 ? uri : '';
}

let currentMode = 'photo';
let currentFacing = 'environment';
let liveStream = null;
let streamHasAudio = false;
let mediaRecorder = null, recordedChunks = [];
let capturedBlob = null, capturedMime = null, capturedExt = null;
let recordTimer = null, recordSeconds = 0;
let vnRecorder = null, vnChunks = [], vnBlob = null;
let vnTimer = null, vnSeconds = 0;
let photoShots = [];
let videoThumbBlob = null;

const liveVideo = document.getElementById('liveVideo');
const photoCanvas = document.getElementById('photoCanvasPreview');
const recordedVideo = document.getElementById('recordedVideo');

async function fetchJson(qs, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`, { signal: ctrl.signal });
      const d = await res.json(); clearTimeout(to);
      if (d && d.busy && i < tries - 1) { await sleepMs(700 * (i + 1)); continue; }
      return d;
    } catch (e) { clearTimeout(to); last = e; await sleepMs(500 * (i + 1)); }
  }
  throw last || new Error('offline');
}

function applyThemeColors(s) {
  if (!s) return;
  if (s.primary_color)   document.documentElement.style.setProperty('--primary', s.primary_color);
  if (s.secondary_color) document.documentElement.style.setProperty('--accent',  s.secondary_color);
}

async function init() {
  const nameInput = document.getElementById('guestName');
  try { nameInput.value = localStorage.getItem('guest_name') || ''; } catch (e) {}
  nameInput.addEventListener('input', () => { try { localStorage.setItem('guest_name', nameInput.value.trim()); } catch (e) {} });
  try {
    const w = encodeURIComponent(weddingId);
    const [settings, filterData] = await Promise.all([
      fetchJson(`action=getSettings&wedding_id=${w}`),
      fetchJson(`action=getFilters&wedding_id=${w}`).catch(() => null)
    ]);
    if (!settings.success) { showStatus('Momen Tidak Ditemukan', settings.message || 'Kode undangan tidak valid. Minta link terbaru ke mempelai ya.', false); return; }
    weddingSettings = settings;
    applyThemeColors(settings);
    MAX_SHOTS = settings.max_photo || 5;
    document.getElementById('brandName').textContent = (settings.ui_config && settings.ui_config.index_headline) || `${settings.groom_name} & ${settings.bride_name}`;
    if (settings.date) document.getElementById('brandDate').textContent = formatDate(settings.date);

    const types = settings.types || ['photo'];
    if (types.length === 0) {
      showStatus('Pengiriman Sedang Ditutup', 'Mempelai sedang menutup pengiriman momen. Kamu tetap bisa melihat album ya.', { label: 'Lihat Album', href: document.getElementById('toAlbumLink').href });
      return;
    }

    if (settings.allow_filter !== false && filterData && filterData.success && filterData.active_filter_id) {
      const match = filterData.filters.find(f => String(f.filter_id) === String(filterData.active_filter_id));
      if (match) {
        activeFilterCss = match.css_filter || 'none';
        try {
          const raw = match.params ? JSON.parse(match.params) : null;
          if (!raw) activeFilterParams = null;
          else if (raw.photo || raw.video) activeFilterParams = { photo: raw.photo || {}, video: raw.video || {} };
          else activeFilterParams = { photo: raw, video: raw };
        } catch (e) { activeFilterParams = null; }
      }
    }

    setupModeSwitch(types);
    await Promise.all([preloadFrameAssets(settings), currentMode === 'voice' ? Promise.resolve() : startCamera()]);
    hideStatus();
  } catch (err) {
    showStatus('Belum Bisa Terhubung', 'Koneksi internet kamu sepertinya sedang kurang stabil. Coba lagi ya.', true);
  }
}

let autoIncludeFrame = { photo: false, video: false, voice: false };
let frameConfigCache = {};
let customFrameImgCache = {};

function getFrameConfig(type) {
  const w = weddingSettings || {};
  const uiConfig = w.ui_config || {};
  const frames = uiConfig.frames || {};
  const customFrame = type ? frames[type] : null;
  const voiceCfg = frames.voice || {};
  return {
    style: w.frame_style || 'elegant', primary: w.primary_color || '#440808', secondary: w.secondary_color || '#C9A66B',
    groom: w.groom_name || '', bride: w.bride_name || '', date: w.date ? formatDate(w.date) : '',
    customFrame: (customFrame && customFrame.type === 'custom' && customFrame.file_id) ? customFrame : null,
    voiceLabel: voiceCfg.label || 'Ucapan & Doa',
    voiceCenterColor: voiceCfg.centerColor || '#ffffff',
    voiceBarColor: voiceCfg.barColor || w.primary_color || '#C9A66B',
    voiceShape: voiceCfg.shape || 'radial',
    voiceCenterShape: voiceCfg.centerShape || 'circle',
    voiceCenterRound: voiceCfg.centerRound != null ? voiceCfg.centerRound : 20,
    voiceFont: voiceCfg.font || 'Plus Jakarta Sans'
  };
}

function getVnResolution() {
  const w = weddingSettings || {};
  const vnRes = (w.ui_config && w.ui_config.vn_resolution) || { preset: 'hd' };
  if (vnRes.preset === 'custom') return { width: vnRes.width || 720, height: vnRes.height || 720 };
  if (vnRes.preset === 'sd') return { width: 480, height: 480 };
  if (vnRes.preset === 'fhd') return { width: 1080, height: 1080 };
  return { width: 720, height: 720 };
}

async function preloadFrameAssets(settings) {
  const uiConfig = settings.ui_config || {};
  autoIncludeFrame = Object.assign({ photo:false, video:false, voice:false }, uiConfig.frame_auto_include || {});
  if (!autoIncludeFrame.photo && !autoIncludeFrame.video && !autoIncludeFrame.voice) return;

  for (const type of ['photo', 'video', 'voice']) {
    if (!autoIncludeFrame[type]) continue;
    frameConfigCache[type] = getFrameConfig(type);
    const cf = frameConfigCache[type].customFrame;
    if (cf && cf.file_id) {
      try { customFrameImgCache[type] = await loadFrameImageBase64(cf.file_id); }
      catch (e) { customFrameImgCache[type] = null; }
    }
  }
}

function loadFrameImageBase64(fileId) {
  return (async () => {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getMediaFile&file_id=${encodeURIComponent(fileId)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Gagal memuat template bingkai');
    const byteChars = atob(data.base64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: data.mimeType || 'image/png' });
    const blobUrl = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = blobUrl;
    });
  })();
}

function fillCenterShape(ctx, cx, cy, radius, cfg) {
  const shape = cfg.voiceCenterShape || 'circle';
  ctx.fillStyle = cfg.voiceCenterColor;
  if (shape === 'square') {
    const size = radius * 1.7;
    const round = Math.min(size / 2, ((cfg.voiceCenterRound != null ? cfg.voiceCenterRound : 20) / 100) * (size / 2));
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(cx - size/2, cy - size/2, size, size, round); }
    else { ctx.rect(cx - size/2, cy - size/2, size, size); }
    ctx.fill();
  } else if (shape === 'heart') {
    const s = radius / 60;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 35*s);
    ctx.bezierCurveTo(cx - 70*s, cy - 30*s, cx - 25*s, cy - 70*s, cx, cy - 30*s);
    ctx.bezierCurveTo(cx + 25*s, cy - 70*s, cx + 70*s, cy - 30*s, cx, cy + 35*s);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
  }
}

function drawAudiogramLive(ctx, w, h, dataArray, cfg, guestName) {
  const cx = w / 2, cy = h / 2;
  const shape = cfg.voiceShape || 'radial';
  const font = cfg.voiceFont || 'Plus Jakarta Sans';
  const scale = Math.min(w, h) / 720;

  if (shape === 'bars') {
    const barCount = 32, barW = (w * 0.7) / barCount, startX = w * 0.15, baseY = cy + 130 * scale;
    ctx.fillStyle = cfg.voiceBarColor;
    for (let i = 0; i < barCount; i++) {
      const value = dataArray[i % dataArray.length] / 255;
      const barH = (10 + value * (h * 0.2 / scale)) * scale;
      ctx.fillRect(startX + i * barW, baseY - barH, barW * 0.7, barH);
    }
    fillCenterShape(ctx, cx, cy, 90 * scale, cfg);
  } else if (shape === 'pulse') {
    let avg = 0; for (let i = 0; i < dataArray.length; i++) avg += dataArray[i];
    avg = avg / dataArray.length / 255;
    const radius = (100 + avg * 40) * scale;
    ctx.fillStyle = cfg.voiceBarColor; ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(cx, cy, radius + 20 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    fillCenterShape(ctx, cx, cy, radius, cfg);
  } else {
    const radius = 140 * scale, bars = 48;
    ctx.strokeStyle = cfg.voiceBarColor; ctx.lineWidth = 5 * scale;
    for (let i = 0; i < bars; i++) {
      const value = dataArray[i % dataArray.length] / 255;
      const angle = (i / bars) * Math.PI * 2;
      const barLen = (20 + value * 90) * scale;
      const x1 = cx + Math.cos(angle)*radius, y1 = cy + Math.sin(angle)*radius;
      const x2 = cx + Math.cos(angle)*(radius+barLen), y2 = cy + Math.sin(angle)*(radius+barLen);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    fillCenterShape(ctx, cx, cy, radius - 10 * scale, cfg);
  }

  ctx.fillStyle = cfg.voiceBarColor;
  ctx.font = `600 ${Math.round(24*scale)}px "${font}", "Plus Jakarta Sans", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(cfg.voiceLabel, cx, cy - 8 * scale);
  ctx.font = `400 ${Math.round(14*scale)}px "JetBrains Mono", monospace`;
  ctx.fillText(guestName, cx, cy + 20 * scale);
}

function drawCaptureFrameOverlay(ctx, w, h, type) {
  const cfg = frameConfigCache[type];
  if (!cfg) return;
  const customImg = customFrameImgCache[type];
  if (customImg) { ctx.drawImage(customImg, 0, 0, w, h); return; }
  drawFrameBar(ctx, w, h, cfg);
}

function drawFrameBar(ctx, w, h, cfg) {
  const barH = Math.round(h * 0.10);
  if (cfg.style === 'minimalist') {
    ctx.fillStyle = 'rgba(26,20,16,0.55)'; ctx.fillRect(0, h - barH, w, barH);
  } else if (cfg.style === 'modern') {
    ctx.fillStyle = cfg.primary; ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.lineWidth = Math.max(4, w * 0.006);
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
  } else if (cfg.style === 'floral-simple') {
    ctx.fillStyle = cfg.primary; ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.globalAlpha = 0.6; ctx.lineWidth = Math.max(3, w*0.005);
    const step = Math.max(10, w*0.03);
    [[10,10,1,1],[w-10,10,-1,1],[10,h-barH-10,1,-1],[w-10,h-barH-10,-1,-1]].forEach(([x,y,sx,sy])=>{
      for (let k=1;k<=4;k++){
        ctx.beginPath();
        ctx.moveTo(x + sx*step*(k-1), y + sy*step*k);
        ctx.lineTo(x + sx*step*k, y + sy*step*(k-1));
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = cfg.primary; ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.lineWidth = Math.max(2, w*0.0025);
    const pad = w*0.02;
    ctx.strokeRect(pad, pad, w-pad*2, h-pad*2-barH*0.15);
  }
  const centerY = h - barH/2;
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = `700 ${Math.round(barH*0.32)}px Fraunces, Georgia, serif`;
  ctx.fillText(`${cfg.groom} & ${cfg.bride}`, w/2, centerY - barH*0.08);
  ctx.font = `400 ${Math.round(barH*0.18)}px "Plus Jakarta Sans", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(cfg.date, w/2, centerY + barH*0.28);
}

function setupModeSwitch(types) {
  const buttons = document.querySelectorAll('#modeSwitch button');
  buttons.forEach(btn => {
    const mode = btn.dataset.mode;
    if (types.indexOf(mode) === -1) { btn.style.display = 'none'; return; }
    btn.addEventListener('click', () => switchMode(mode));
  });
  if (types.length <= 1) document.getElementById('modeSwitch').style.display = 'none';
  applyModeUI(types[0]);
}

function applyModeUI(mode) {
  currentMode = mode;
  document.querySelectorAll('#modeSwitch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('cameraWrap').style.display = mode === 'voice' ? 'none' : 'block';
  document.getElementById('voiceWrap').style.display = mode === 'voice' ? 'flex' : 'none';
  document.getElementById('captureRow').style.display = mode === 'voice' ? 'none' : 'flex';
  document.getElementById('vnControlsIdle').style.display = mode === 'voice' ? 'flex' : 'none';
  document.getElementById('finishRow').style.display = 'none';
  document.getElementById('reviewRow').style.display = 'none';
  const shutter = document.getElementById('shutterBtn');
  shutter.classList.toggle('video-mode', mode === 'video');
  shutter.disabled = false;
}

function switchMode(mode) {
  if (mediaRecorder && mediaRecorder.state === 'recording') return;
  if (vnRecorder && vnRecorder.state === 'recording') return;
  resetCapture();
  clearFilmstrip();
  liveVideo.style.display = 'block'; recordedVideo.style.display = 'none'; photoCanvas.style.display = 'none';
  applyModeUI(mode);
  if (mode === 'voice') { stopCameraStream(); resetVoice(); }
  else { startCamera(); }
}

async function startCamera() {
  try {
    stopCameraStream();
    const needsAudio = currentMode === 'video';
    const q = getQuality(currentMode === 'video' ? 'video' : 'photo');
    liveStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: currentFacing },
        width: { ideal: q.width },
        height: { ideal: q.height }
      },
      audio: needsAudio ? { echoCancellation:true, noiseSuppression:true } : false
    });
    streamHasAudio = liveStream.getAudioTracks().length > 0;
    liveVideo.srcObject = liveStream;
    liveVideo.style.filter = activeFilterParams ? approximateCssFromParams(currentMode === 'video' ? activeFilterParams.video : activeFilterParams.photo) : activeFilterCss;
    liveVideo.classList.toggle('mirrored', currentFacing === 'user');
  } catch (err) {
    showStatus('Kamera Belum Diizinkan', 'Kami perlu akses kamera (dan mikrofon untuk video) supaya kamu bisa mengabadikan momen. Aktifkan izinnya di pengaturan browser, lalu muat ulang halaman.', true);
  }
}

function stopCameraStream() {
  if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
}

document.getElementById('flipBtn').addEventListener('click', () => {
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  startCamera();
});

const shutterBtn = document.getElementById('shutterBtn');
shutterBtn.addEventListener('click', () => {
  if (currentMode === 'photo') takePhoto();
  else if (currentMode === 'video') {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopVideoRecording();
    else startVideoRecording();
  }
});

let shotsInFlight = 0;
function takePhoto() {
  if (photoShots.length + shotsInFlight >= MAX_SHOTS) return;
  const vw0 = liveVideo.videoWidth, vh0 = liveVideo.videoHeight;
  if (!vw0) { showToast('Kamera belum siap, tunggu sebentar ya', 'error'); return; }
  const q = getQuality('photo');
  const sc = Math.min(1, Math.max(q.width, q.height) / Math.max(vw0, vh0));
  const vw = Math.round(vw0 * sc), vh = Math.round(vh0 * sc);
  shotsInFlight++;
  photoCanvas.width = vw; photoCanvas.height = vh;
  const ctx = photoCanvas.getContext('2d');
  drawWithGuaranteedFilter(ctx, () => {
    if (currentFacing === 'user') { ctx.save(); ctx.translate(vw, 0); ctx.scale(-1, 1); }
    ctx.drawImage(liveVideo, 0, 0, vw, vh);
    if (currentFacing === 'user') ctx.restore();
  }, vw, vh, false);

  if (autoIncludeFrame.photo) drawCaptureFrameOverlay(ctx, vw, vh, 'photo');

  const thumb = makeThumbDataUri(photoCanvas, vw, vh);
  photoCanvas.toBlob(blob => {
    shotsInFlight--;
    photoCanvas.width = 1; photoCanvas.height = 1;
    if (!blob) { showToast('Foto belum berhasil diambil, coba lagi ya', 'error'); return; }
    photoShots.push({ blob, url: thumb, thumb });
    renderFilmstrip();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    if (photoShots.length >= MAX_SHOTS) {
      shutterBtn.disabled = true;
      showToast(`Sudah ${MAX_SHOTS} foto, batas maksimal. Tekan "Kirim Foto" ya.`, 'success');
    }
    document.getElementById('finishRow').style.display = 'flex';
  }, 'image/jpeg', q.jpegQuality);
}

function renderFilmstrip() {
  const strip = document.getElementById('filmstrip');
  strip.innerHTML = '';
  if (photoShots.length === 0) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';

  photoShots.forEach((shot, idx) => {
    const div = document.createElement('div');
    div.className = 'shot-thumb';
    div.innerHTML = `<img src="${shot.url}"><button class="remove-shot" onclick="removeShot(${idx})">✕</button>`;
    strip.appendChild(div);
  });

  const counter = document.createElement('div');
  counter.className = 'shot-counter';
  counter.textContent = `${photoShots.length}/${MAX_SHOTS}`;
  strip.appendChild(counter);
}

function removeShot(idx) {
  URL.revokeObjectURL(photoShots[idx].url);
  photoShots.splice(idx, 1);
  renderFilmstrip();
  shutterBtn.disabled = false;
  if (photoShots.length === 0) document.getElementById('finishRow').style.display = 'none';
}

function clearFilmstrip() {
  photoShots.forEach(s => URL.revokeObjectURL(s.url));
  photoShots = [];
  renderFilmstrip();
  shutterBtn.disabled = false;
}

document.getElementById('finishBtn').addEventListener('click', sendAllPhotos);

function ensureGuestName() {
  const input = document.getElementById('guestName');
  const name = input.value.trim();
  if (!name) {
    showToast('Tulis namamu dulu ya, supaya mempelai tahu siapa pengirimnya', 'error');
    input.focus();
    return '';
  }
  try { localStorage.setItem('guest_name', name); } catch (e) {}
  return name;
}

function sendAllPhotos() {
  const guestName = ensureGuestName();
  if (!guestName) return;
  if (photoShots.length === 0) { showToast('Ambil minimal 1 foto dulu ya', 'error'); return; }
  const shots = photoShots.slice();
  shots.forEach(sh => enqueueUpload({ type: 'photo', blob: sh.blob, mime: 'image/jpeg', ext: 'jpg', thumb: sh.thumb, guest: guestName }));
  photoShots = [];
  renderFilmstrip();
  shutterBtn.disabled = false;
  document.getElementById('finishRow').style.display = 'none';
  showToast(`${shots.length} foto sedang dikirim. Kamu boleh lanjut memotret`, 'success');
}

function captureVideoThumbnail() {
  return new Promise(resolve => {
    try {
      const vw = liveVideo.videoWidth || 640, vh = liveVideo.videoHeight || 480;
      const scale = Math.min(1, 360 / vw);
      const tCanvas = document.createElement('canvas');
      tCanvas.width = Math.round(vw * scale); tCanvas.height = Math.round(vh * scale);
      const tctx = tCanvas.getContext('2d');
      tctx.save();
      if (currentFacing === 'user') { tctx.translate(tCanvas.width, 0); tctx.scale(-1, 1); }
      if (canvasFilterSupported && activeFilterCss && activeFilterCss !== 'none') tctx.filter = activeFilterCss;
      tctx.drawImage(liveVideo, 0, 0, tCanvas.width, tCanvas.height);
      tctx.restore();
      let q = 0.62, uri = tCanvas.toDataURL('image/jpeg', q);
      while (uri.length > 42000 && q > 0.2) { q -= 0.1; uri = tCanvas.toDataURL('image/jpeg', q); }
      resolve(uri.length <= 42000 ? uri : '');
    } catch (e) { resolve(''); }
  });
}

async function startVideoRecording() {
  if (!streamHasAudio) {
    showToast('Mikrofon tidak terdeteksi, jadi videonya akan tanpa suara.', 'error');
  }
  videoThumbBlob = await captureVideoThumbnail();
  recordedChunks = [];
  const maxSeconds = Number(weddingSettings.max_video_seconds) || 60;
  const recordFps = (activeFilterParams && activeFilterParams.video && activeFilterParams.video.fps) || 30;

  const vq = getQuality('video');
  const audioTracks = liveStream.getAudioTracks();
  const needsCanvas = currentFacing === 'user' || autoIncludeFrame.video || !!activeFilterParams || (activeFilterCss && activeFilterCss !== 'none');
  let drawing = false;
  let combined;

  if (needsCanvas) {
    const vw0 = liveVideo.videoWidth || 1280, vh0 = liveVideo.videoHeight || 720;
    const sc = Math.min(1, Math.max(vq.width, vq.height) / Math.max(vw0, vh0));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vw0 * sc); canvas.height = Math.round(vh0 * sc);
    const ctx = canvas.getContext('2d');
    drawing = true;

    const drawFrame = () => {
      if (!drawing) return;
      drawWithGuaranteedFilter(ctx, () => {
        if (currentFacing === 'user') {
          ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
          ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
          ctx.restore();
        } else {
          ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
        }
      }, canvas.width, canvas.height, true);
      if (activeFilterParams && activeFilterParams.video && activeFilterParams.video.vignette) {
        drawCheapVignette(ctx, canvas.width, canvas.height, activeFilterParams.video.vignette);
      }
      if (autoIncludeFrame.video) drawCaptureFrameOverlay(ctx, canvas.width, canvas.height, 'video');
      requestAnimationFrame(drawFrame);
    };
    drawFrame();
    const fps = IS_LOW_END ? Math.min(24, recordFps) : recordFps;
    combined = new MediaStream([...canvas.captureStream(fps).getVideoTracks(), ...audioTracks]);
  } else {
    combined = liveStream;
  }

  mediaRecorder = new MediaRecorder(combined, {
    mimeType: VIDEO_MIME.mime,
    videoBitsPerSecond: vq.videoBitsPerSecond,
    audioBitsPerSecond: vq.audioBitsPerSecond
  });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    drawing = false;
    capturedBlob = new Blob(recordedChunks, { type: VIDEO_MIME.mime });
    capturedMime = VIDEO_MIME.mime; capturedExt = VIDEO_MIME.ext;
    recordedVideo.src = URL.createObjectURL(capturedBlob);
    if (IS_LOW_END) stopCameraStream();
    liveVideo.style.display = 'none';
    recordedVideo.style.display = 'block';
    showReview();
  };
  mediaRecorder.start();

  recordSeconds = 0;
  document.getElementById('recBadge').style.display = 'flex';
  shutterBtn.classList.add('recording');
  updateRecTimer();
  recordTimer = setInterval(() => {
    recordSeconds++;
    updateRecTimer();
    if (recordSeconds >= maxSeconds) stopVideoRecording();
  }, 1000);
}

function stopVideoRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  clearInterval(recordTimer);
  document.getElementById('recBadge').style.display = 'none';
  shutterBtn.classList.remove('recording');
}

function updateRecTimer() { document.getElementById('recTimer').textContent = formatSeconds(recordSeconds); }

function showReview() {
  document.getElementById('captureRow').style.display = 'none';
  document.getElementById('reviewRow').style.display = 'flex';
}

document.getElementById('retakeBtn').addEventListener('click', () => {
  resetCapture();
  document.getElementById('captureRow').style.display = 'flex';
  document.getElementById('reviewRow').style.display = 'none';
  liveVideo.style.display = 'block';
  photoCanvas.style.display = 'none';
  recordedVideo.style.display = 'none';

});

document.getElementById('sendMediaBtn').addEventListener('click', () => sendSingleMedia(currentMode));

function resetCapture() {
  capturedBlob = null; capturedMime = null; capturedExt = null; recordedChunks = []; videoThumbBlob = null;
  try { if (recordedVideo.src && recordedVideo.src.indexOf('blob:') === 0) URL.revokeObjectURL(recordedVideo.src); } catch (e) {}
  recordedVideo.removeAttribute('src');
}

const vnOrb = document.getElementById('vnOrb');
const vnRecordBtn = document.getElementById('vnRecordBtn');
document.getElementById('vnRedoBtn').addEventListener('click', resetVoice);
document.getElementById('vnPlayBtn').addEventListener('click', () => {

document.getElementById('vnSendBtn').addEventListener('click', () => sendSingleMedia('voice'));

async function startVoiceRecording() {
  if (autoIncludeFrame.voice) return startVoiceRecordingWithFrame();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true } });
    vnChunks = [];
    vnRecorder = new MediaRecorder(stream, { mimeType: AUDIO_MIME.mime, audioBitsPerSecond: getQuality('voice').audioBitsPerSecond });
    vnRecorder.ondataavailable = e => vnChunks.push(e.data);
    vnRecorder.onstop = () => {
      vnBlob = new Blob(vnChunks, { type: AUDIO_MIME.mime });
      capturedBlob = vnBlob; capturedMime = AUDIO_MIME.mime; capturedExt = AUDIO_MIME.ext;
      const vnPlayer = document.getElementById('vnPlayer');
      vnPlayer.src = URL.createObjectURL(vnBlob);
      vnPlayer.style.display = 'block';
      vnOrb.classList.remove('recording');
      document.getElementById('vnControlsIdle').style.display = 'none';
      document.getElementById('vnControlsReview').style.display = 'flex';
      document.getElementById('vnHint').textContent = 'Dengarkan dulu sebelum dikirim ya';
      stream.getTracks().forEach(t => t.stop());
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');
    document.getElementById('vnHint').textContent = 'Sedang merekam… ketuk tombol untuk berhenti';

    const maxSeconds = Number(weddingSettings.max_voice_seconds) || 60;
    vnSeconds = 0;
    updateVnTimer();
    vnTimer = setInterval(() => {
      vnSeconds++;
      updateVnTimer();
      if (vnSeconds >= maxSeconds) stopVoiceRecording();
    }, 1000);

    vnRecordBtn.textContent = '■';
    vnRecordBtn.onclick = stopVoiceRecording;
  } catch (err) {
    showToast('Mikrofon belum bisa dipakai. Cek izin mikrofon di browser kamu ya.', 'error');
  }
}
vnRecordBtn.onclick = startVoiceRecording;

let vnFrameAudioCtx = null;

async function startVoiceRecordingWithFrame() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true } });
    const cfg = frameConfigCache.voice || getFrameConfig('voice');
    const vnRes = getVnResolution();
    const guestNamePreview = (document.getElementById('guestName').value || 'Tamu').trim();

    const canvas = document.createElement('canvas');
    canvas.width = vnRes.width; canvas.height = vnRes.height;
    const ctx = canvas.getContext('2d');

    vnFrameAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = vnFrameAudioCtx.createMediaStreamSource(stream);
    const analyser = vnFrameAudioCtx.createAnalyser();
    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);

    const customImg = customFrameImgCache.voice;
    let drawing = true;
    function drawLoop() {
      if (!drawing) return;
      analyser.getByteFrequencyData(dataArray);
      if (customImg) {
        ctx.drawImage(customImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = cfg.secondary; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = cfg.primary; ctx.globalAlpha = 0.15; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1;
      }
      drawAudiogramLive(ctx, canvas.width, canvas.height, dataArray, cfg, guestNamePreview);
      if (!customImg) drawFrameBar(ctx, canvas.width, canvas.height, cfg);
      requestAnimationFrame(drawLoop);
    }
    drawLoop();

    const canvasStream = canvas.captureStream(30);
    const combined = new MediaStream([...canvasStream.getVideoTracks(), ...stream.getAudioTracks()]);

    vnChunks = [];
    vnRecorder = new MediaRecorder(combined, {
      mimeType: VIDEO_MIME.mime,
      videoBitsPerSecond: 2500000,
      audioBitsPerSecond: getQuality('voice').audioBitsPerSecond
    });
    vnRecorder.ondataavailable = e => { if (e.data.size > 0) vnChunks.push(e.data); };
    vnRecorder.onstop = () => {
      drawing = false;
      vnBlob = new Blob(vnChunks, { type: VIDEO_MIME.mime });
      capturedBlob = vnBlob; capturedMime = VIDEO_MIME.mime; capturedExt = VIDEO_MIME.ext;
      const vnVideoPlayer = document.getElementById('vnVideoPlayer');
      vnVideoPlayer.src = URL.createObjectURL(vnBlob);
      vnVideoPlayer.style.display = 'block';
      vnOrb.classList.remove('recording');
      document.getElementById('vnControlsIdle').style.display = 'none';
      document.getElementById('vnControlsReview').style.display = 'flex';
      document.getElementById('vnHint').textContent = 'Tonton dulu sebelum dikirim ya';
      stream.getTracks().forEach(t => t.stop());
      if (vnFrameAudioCtx) { vnFrameAudioCtx.close().catch(()=>{}); vnFrameAudioCtx = null; }
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');
    document.getElementById('vnHint').textContent = 'Sedang merekam (dengan bingkai)...';

    const maxSeconds = Number(weddingSettings.max_voice_seconds) || 60;
    vnSeconds = 0;
    updateVnTimer();
    vnTimer = setInterval(() => {
      vnSeconds++;
      updateVnTimer();
      if (vnSeconds >= maxSeconds) stopVoiceRecording();
    }, 1000);

    vnRecordBtn.textContent = '■';
    vnRecordBtn.onclick = stopVoiceRecording;
  } catch (err) {
    showToast('Tidak bisa mengakses mikrofon. Periksa izin mikrofon di browser kamu.', 'error');
  }
}

function stopVoiceRecording() {
  if (vnRecorder && vnRecorder.state === 'recording') vnRecorder.stop();
  clearInterval(vnTimer);
}

function updateVnTimer() { document.getElementById('vnTimer').textContent = formatSeconds(vnSeconds); }

function resetVoice() {
  capturedBlob = null; vnBlob = null; vnChunks = [];
  const vnPlayer = document.getElementById('vnPlayer');
  vnPlayer.style.display = 'none';
  vnPlayer.src = '';
  const vnVideoPlayer = document.getElementById('vnVideoPlayer');
  vnVideoPlayer.style.display = 'none';
  vnVideoPlayer.src = '';
  document.getElementById('vnControlsReview').style.display = 'none';
  document.getElementById('vnControlsIdle').style.display = 'flex';
  document.getElementById('vnHint').textContent = autoIncludeFrame.voice ? 'Ketuk tombol merah, lalu ucapkan doa & harapanmu (sudah berbingkai)' : 'Ketuk tombol merah, lalu ucapkan doa & harapanmu';
  vnRecordBtn.textContent = '●';
  vnRecordBtn.onclick = startVoiceRecording;
  vnSeconds = 0;
  updateVnTimer();
}

function sendSingleMedia(type) {
  const guestName = ensureGuestName();
  if (!guestName) return;
  if (!capturedBlob) { showToast(type === 'voice' ? 'Rekam suaramu dulu ya' : 'Rekam videonya dulu ya', 'error'); return; }

  enqueueUpload({
    type, blob: capturedBlob, mime: String(capturedMime || '').split(';')[0] || (type === 'video' ? 'video/webm' : 'audio/webm'),
    ext: capturedExt, thumb: type === 'video' ? (videoThumbBlob || '') : '', guest: guestName
  });

  if (type === 'voice') { resetVoice(); }
  else {
    resetCapture();
    document.getElementById('captureRow').style.display = 'flex';
    document.getElementById('reviewRow').style.display = 'none';
    liveVideo.style.display = 'block';
    photoCanvas.style.display = 'none';
    recordedVideo.style.display = 'none';
    if (!liveStream) startCamera();
  }
  showToast(type === 'voice' ? 'Suaramu sedang dikirim. Kamu boleh lanjut.' : 'Videomu sedang dikirim. Kamu boleh lanjut.', 'success');
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function showStatus(title, text, action) {
  document.getElementById('statusScreen').style.display = 'flex';
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusText').textContent = text;
  const btn = document.getElementById('statusBtn');
  if (action && typeof action === 'object') {
    btn.style.display = 'inline-block'; btn.textContent = action.label;
    btn.onclick = () => { location.href = action.href; };
  } else {
    btn.style.display = action ? 'inline-block' : 'none'; btn.textContent = 'Coba Lagi';
    btn.onclick = () => location.reload();
  }
}
function hideStatus() { document.getElementById('statusScreen').style.display = 'none'; }

function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function showProgress() {}
function hideProgress() {}

function formatSeconds(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}
function formatDate(d) {
  try { return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }); }
  catch (e) { return d; }
}
