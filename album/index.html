<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bagikan Momen — Wedding Album</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#111; overflow:hidden; }
  body { font-family:'Segoe UI', sans-serif; color:#fff; }

  #app { position:relative; width:100%; height:100%; display:flex; flex-direction:column; }

  /* ---------- LAYAR STATUS (loading / error / butuh izin) ---------- */
  #statusScreen {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; background:#1a1a1a; z-index:50; gap:14px;
  }
  #statusScreen .icon { font-size:44px; }
  #statusScreen h2 { font-size:18px; }
  #statusScreen p { font-size:14px; color:#bbb; max-width:320px; line-height:1.5; }
  #statusScreen button { margin-top:10px; padding:12px 28px; border-radius:30px; border:none; background:#c99b6a; color:#fff; font-weight:700; font-size:14px; }

  /* ---------- HEADER ---------- */
  header {
    position:absolute; top:0; left:0; right:0; z-index:20; padding:16px 18px;
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  }
  header .brand { font-size:15px; font-weight:700; }
  header .brand small { display:block; font-size:11px; font-weight:400; opacity:.8; }
  header a.nav-link { color:#fff; text-decoration:none; font-size:12px; background:rgba(255,255,255,.15); padding:8px 14px; border-radius:20px; }

  /* ---------- CAMERA VIEW ---------- */
  #cameraWrap { position:relative; flex:1; background:#000; overflow:hidden; }
  #liveVideo, #recordedVideo { width:100%; height:100%; object-fit:cover; display:block; }
  #photoCanvasPreview { width:100%; height:100%; object-fit:cover; display:none; }
  #recordedVideo { display:none; }

  .rec-badge {
    position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:15;
    background:rgba(224,82,82,.9); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700;
    display:none; align-items:center; gap:6px;
  }
  .rec-badge .dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }

  /* ---------- VOICE MODE ---------- */
  #voiceWrap {
    display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:20px;
    background:radial-gradient(circle at center, #2a2320, #111);
  }
  .vn-orb {
    width:150px; height:150px; border-radius:50%;
    background:linear-gradient(135deg,#c99b6a,#8a6a45);
    display:flex; align-items:center; justify-content:center; font-size:50px;
    box-shadow:0 0 0 8px rgba(201,155,106,.15);
  }
  .vn-orb.recording { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(224,82,82,.4);} 70%{box-shadow:0 0 0 26px rgba(224,82,82,0);} 100%{box-shadow:0 0 0 0 rgba(224,82,82,0);} }
  #vnTimer { font-size:22px; font-weight:700; letter-spacing:1px; }
  #vnHint { font-size:13px; color:#bbb; text-align:center; }
  #vnPlayer { width:85%; display:none; }

  /* ---------- BOTTOM CONTROLS ---------- */
  #controls {
    position:relative; z-index:20; padding:18px 18px 26px; background:linear-gradient(0deg, rgba(0,0,0,.7), transparent);
  }
  .mode-switch { display:flex; justify-content:center; gap:22px; margin-bottom:18px; }
  .mode-switch button {
    background:none; border:none; color:rgba(255,255,255,.55); font-size:13px; font-weight:700; padding:6px 4px; border-bottom:2px solid transparent;
  }
  .mode-switch button.active { color:#fff; border-color:#c99b6a; }

  .capture-row { display:flex; align-items:center; justify-content:center; gap:36px; }
  .side-btn { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.15); border:none; color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; }

  #shutterBtn {
    width:74px; height:74px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.4);
  }
  #shutterBtn.video-mode { background:#e05252; }
  #shutterBtn.recording { border-radius:14px; width:34px; height:34px; }

  .vn-controls { display:none; gap:16px; justify-content:center; align-items:center; }
  .vn-controls button {
    padding:14px 20px; border-radius:30px; border:none; font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;
  }
  #vnRecordBtn { background:#e05252; color:#fff; width:64px; height:64px; border-radius:50%; font-size:22px; padding:0; }
  #vnRedoBtn { background:rgba(255,255,255,.15); color:#fff; }
  #vnPlayBtn { background:rgba(255,255,255,.15); color:#fff; }
  #vnSendBtn { background:#c99b6a; color:#fff; }

  /* ---------- REVIEW (setelah foto/video diambil) ---------- */
  .review-row { display:none; gap:14px; justify-content:center; align-items:center; }
  .review-row button { padding:14px 24px; border-radius:30px; border:none; font-weight:700; font-size:14px; }
  #retakeBtn { background:rgba(255,255,255,.15); color:#fff; }
  #sendMediaBtn { background:#c99b6a; color:#fff; }

  .name-field { max-width:400px; margin:0 auto 14px; }
  .name-field input {
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08); color:#fff; font-size:14px;
  }
  .name-field input::placeholder { color:rgba(255,255,255,.5); }

  .toast {
    position:absolute; bottom:110px; left:50%; transform:translateX(-50%); z-index:60;
    background:#222; padding:12px 20px; border-radius:10px; font-size:13px; max-width:85%; text-align:center; display:none;
  }
  .toast.success { background:#2e7d32; }
  .toast.error { background:#c62828; }
</style>
</head>
<body>
<div id="app">

  <div id="statusScreen">
    <div class="icon">💍</div>
    <h2 id="statusTitle">Menyiapkan kamera...</h2>
    <p id="statusText">Mohon tunggu sebentar</p>
    <button id="statusBtn" style="display:none;" onclick="location.reload()">Coba Lagi</button>
  </div>

  <header>
    <div class="brand"><span id="brandName">Wedding Album</span><small id="brandDate"></small></div>
    <a class="nav-link" href="#" id="toAlbumLink">Lihat Album →</a>
  </header>

  <div class="rec-badge" id="recBadge"><span class="dot"></span> <span id="recTimer">00:00</span></div>

  <div id="cameraWrap">
    <video id="liveVideo" autoplay playsinline muted></video>
    <canvas id="photoCanvasPreview"></canvas>
    <video id="recordedVideo" playsinline controls></video>
  </div>

  <div id="voiceWrap">
    <div class="vn-orb" id="vnOrb">🎤</div>
    <div id="vnTimer">00:00</div>
    <p id="vnHint">Tekan tombol merah untuk mulai merekam ucapanmu</p>
    <audio id="vnPlayer" controls></audio>
  </div>

  <div class="toast" id="toast"></div>

  <div id="controls">
    <div class="name-field">
      <input type="text" id="guestName" placeholder="Nama kamu" maxlength="40">
    </div>

    <div class="mode-switch" id="modeSwitch">
      <button data-mode="photo" class="active">FOTO</button>
      <button data-mode="video">VIDEO</button>
      <button data-mode="voice">SUARA</button>
    </div>

    <div class="capture-row" id="captureRow">
      <button class="side-btn" id="flipBtn" title="Ganti kamera">🔄</button>
      <button id="shutterBtn"></button>
      <div style="width:44px;"></div>
    </div>

    <div class="vn-controls" id="vnControlsIdle">
      <button id="vnRecordBtn">●</button>
    </div>
    <div class="vn-controls" id="vnControlsReview">
      <button id="vnRedoBtn">↺ Ulang</button>
      <button id="vnPlayBtn">▶ Putar</button>
      <button id="vnSendBtn">Kirim ✓</button>
    </div>

    <div class="review-row" id="reviewRow">
      <button id="retakeBtn">↺ Ambil Ulang</button>
      <button id="sendMediaBtn">Kirim ✓</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3Z20dUlbqn1XH9z8OaQoOiataPsDT8uIQoGAAnk_oJH81U349swbm2i9iOyXVckpG/exec';

// ============================================
// WEDDING ID — HANYA DARI LINK, TERSIMPAN OTOMATIS, TIDAK BISA DIKETIK MANUAL
// ============================================
const urlParams = new URLSearchParams(window.location.search);
let weddingId = urlParams.get('w');

if (weddingId) {
  localStorage.setItem('active_wedding_id', weddingId);
} else {
  weddingId = localStorage.getItem('active_wedding_id');
}

document.getElementById('toAlbumLink').href = weddingId ? `album.html?w=${encodeURIComponent(weddingId)}` : '#';

if (!weddingId) {
  showStatus('Tautan Tidak Lengkap', 'Link ini belum berisi kode undangan. Minta mempelai untuk mengirimkan ulang link undangan yang benar.', false);
  throw new Error('no wedding id');
}

// ============================================
// STATE
// ============================================
let weddingSettings = null;
let activeFilterCss = 'none';
let currentMode = 'photo'; // photo | video | voice
let currentFacing = 'environment';
let liveStream = null;
let capturedBlob = null, capturedMime = null, capturedExt = null;
let mediaRecorder = null, recordedChunks = [];
let recordTimer = null, recordSeconds = 0;
let vnRecorder = null, vnChunks = [], vnBlob = null;
let vnTimer = null, vnSeconds = 0;

const liveVideo = document.getElementById('liveVideo');
const photoCanvas = document.getElementById('photoCanvasPreview');
const recordedVideo = document.getElementById('recordedVideo');

// ============================================
// INIT
// ============================================
init();

async function init() {
  try {
    const settingsRes = await fetch(`${APPS_SCRIPT_URL}?action=getSettings&wedding_id=${encodeURIComponent(weddingId)}`);
    const settings = await settingsRes.json();
    if (!settings.success) {
      showStatus('Momen Tidak Ditemukan', settings.message || 'Kode undangan tidak valid.', false);
      return;
    }
    weddingSettings = settings;
    document.getElementById('brandName').textContent = `${settings.groom_name} & ${settings.bride_name}`;
    if (settings.date) document.getElementById('brandDate').textContent = formatDate(settings.date);

    // ambil filter aktif tunggal yang ditentukan admin
    if (settings.allow_filter !== false) {
      const filterRes = await fetch(`${APPS_SCRIPT_URL}?action=getFilters&wedding_id=${encodeURIComponent(weddingId)}`);
      const filterData = await filterRes.json();
      if (filterData.success && filterData.active_filter_id) {
        const match = filterData.filters.find(f => String(f.filter_id) === String(filterData.active_filter_id));
        if (match) activeFilterCss = match.css_filter || 'none';
      }
    }

    setupModeSwitch(settings);
    await startCamera();
    hideStatus();
  } catch (err) {
    showStatus('Gagal Memuat', 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu lalu coba lagi.', true);
  }
}

function setupModeSwitch(settings) {
  const btns = document.querySelectorAll('#modeSwitch button');
  btns.forEach(btn => {
    const mode = btn.dataset.mode;
    if (mode === 'video' && settings.allow_video !== true) { btn.style.display = 'none'; return; }
    if (mode === 'voice' && settings.allow_voice !== true) { btn.style.display = 'none'; return; }
    btn.addEventListener('click', () => switchMode(mode));
  });
}

function switchMode(mode) {
  if (mediaRecorder && mediaRecorder.state === 'recording') return;
  currentMode = mode;
  resetCapture();
  document.querySelectorAll('#modeSwitch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  document.getElementById('cameraWrap').style.display = mode === 'voice' ? 'none' : 'block';
  document.getElementById('voiceWrap').style.display = mode === 'voice' ? 'flex' : 'none';
  document.getElementById('captureRow').style.display = mode === 'voice' ? 'none' : 'flex';
  document.getElementById('vnControlsIdle').style.display = mode === 'voice' ? 'flex' : 'none';

  const shutter = document.getElementById('shutterBtn');
  shutter.classList.toggle('video-mode', mode === 'video');

  if (mode === 'voice') stopCameraStream();
  else if (!liveStream) startCamera();
}

// ============================================
// KAMERA
// ============================================
async function startCamera() {
  try {
    stopCameraStream();
    liveStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing },
      audio: currentMode === 'video'
    });
    liveVideo.srcObject = liveStream;
    liveVideo.style.filter = activeFilterCss;
  } catch (err) {
    showStatus('Izin Kamera Diperlukan', 'Kami butuh akses kamera untuk membantumu mengambil foto/video. Aktifkan izin kamera di pengaturan browser, lalu muat ulang halaman.', true);
  }
}

function stopCameraStream() {
  if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
}

document.getElementById('flipBtn').addEventListener('click', () => {
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  startCamera();
});

// ============================================
// SHUTTER — foto / video
// ============================================
const shutterBtn = document.getElementById('shutterBtn');
shutterBtn.addEventListener('click', () => {
  if (currentMode === 'photo') takePhoto();
  else if (currentMode === 'video') {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopVideoRecording();
    else startVideoRecording();
  }
});

function takePhoto() {
  const vw = liveVideo.videoWidth, vh = liveVideo.videoHeight;
  photoCanvas.width = vw; photoCanvas.height = vh;
  const ctx = photoCanvas.getContext('2d');
  ctx.filter = activeFilterCss;
  if (currentFacing === 'user') { ctx.translate(vw, 0); ctx.scale(-1, 1); }
  ctx.drawImage(liveVideo, 0, 0, vw, vh);

  photoCanvas.toBlob(blob => {
    capturedBlob = blob; capturedMime = 'image/jpeg'; capturedExt = 'jpg';
    liveVideo.style.display = 'none';
    photoCanvas.style.display = 'block';
    showReview();
  }, 'image/jpeg', 0.9);
}

function startVideoRecording() {
  recordedChunks = [];
  const maxSeconds = Number(weddingSettings.max_video_seconds) || 60;

  // canvas pipeline supaya filter ikut terbakar ke hasil rekaman
  const canvas = document.createElement('canvas');
  canvas.width = liveVideo.videoWidth || 640;
  canvas.height = liveVideo.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  let drawing = true;

  function drawFrame() {
    if (!drawing) return;
    ctx.filter = activeFilterCss;
    if (currentFacing === 'user') {
      ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    } else {
      ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(drawFrame);
  }
  drawFrame();

  const canvasStream = canvas.captureStream(30);
  const audioTracks = liveStream.getAudioTracks();
  const combined = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

  mediaRecorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp8,opus' });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    drawing = false;
    capturedBlob = new Blob(recordedChunks, { type: 'video/webm' });
    capturedMime = 'video/webm'; capturedExt = 'webm';
    recordedVideo.src = URL.createObjectURL(capturedBlob);
    liveVideo.style.display = 'none';
    recordedVideo.style.display = 'block';
    showReview();
  };
  mediaRecorder.start();

  recordSeconds = 0;
  document.getElementById('recBadge').style.display = 'flex';
  shutterBtn.classList.add('recording');
  updateRecTimer();
  recordTimer = setInterval(() => {
    recordSeconds++;
    updateRecTimer();
    if (recordSeconds >= maxSeconds) stopVideoRecording();
  }, 1000);
}

function stopVideoRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  clearInterval(recordTimer);
  document.getElementById('recBadge').style.display = 'none';
  shutterBtn.classList.remove('recording');
}

function updateRecTimer() {
  document.getElementById('recTimer').textContent = formatSeconds(recordSeconds);
}

// ============================================
// REVIEW (FOTO/VIDEO)
// ============================================
function showReview() {
  document.getElementById('captureRow').style.display = 'none';
  document.getElementById('reviewRow').style.display = 'flex';
}

document.getElementById('retakeBtn').addEventListener('click', () => {
  resetCapture();
  document.getElementById('captureRow').style.display = 'flex';
  document.getElementById('reviewRow').style.display = 'none';
  liveVideo.style.display = 'block';
  photoCanvas.style.display = 'none';
  recordedVideo.style.display = 'none';
  if (!liveStream) startCamera();
});

document.getElementById('sendMediaBtn').addEventListener('click', () => sendMedia(currentMode));

function resetCapture() {
  capturedBlob = null; capturedMime = null; capturedExt = null;
  recordedChunks = [];
}

// ============================================
// VOICE NOTE — rekam / putar / ulang / kirim
// ============================================
const vnOrb = document.getElementById('vnOrb');
const vnRecordBtn = document.getElementById('vnRecordBtn');
const vnRedoBtn = document.getElementById('vnRedoBtn');
const vnPlayBtn = document.getElementById('vnPlayBtn');
const vnSendBtn = document.getElementById('vnSendBtn');
const vnPlayer = document.getElementById('vnPlayer');

vnRecordBtn.addEventListener('click', startVoiceRecording);
vnRedoBtn.addEventListener('click', resetVoice);
vnPlayBtn.addEventListener('click', () => { vnPlayer.play(); });
vnSendBtn.addEventListener('click', () => sendMedia('voice'));

async function startVoiceRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    vnChunks = [];
    vnRecorder = new MediaRecorder(stream);
    vnRecorder.ondataavailable = e => vnChunks.push(e.data);
    vnRecorder.onstop = () => {
      vnBlob = new Blob(vnChunks, { type: 'audio/webm' });
      capturedBlob = vnBlob; capturedMime = 'audio/webm'; capturedExt = 'webm';
      vnPlayer.src = URL.createObjectURL(vnBlob);
      vnPlayer.style.display = 'block';
      vnOrb.classList.remove('recording');
      document.getElementById('vnControlsIdle').style.display = 'none';
      document.getElementById('vnControlsReview').style.display = 'flex';
      document.getElementById('vnHint').textContent = 'Dengarkan dulu sebelum mengirim';
      stream.getTracks().forEach(t => t.stop());
    };
    vnRecorder.start();
    vnOrb.classList.add('recording');
    document.getElementById('vnHint').textContent = 'Sedang merekam...';

    const maxSeconds = Number(weddingSettings.max_voice_seconds) || 60;
    vnSeconds = 0;
    updateVnTimer();
    vnTimer = setInterval(() => {
      vnSeconds++;
      updateVnTimer();
      if (vnSeconds >= maxSeconds) stopVoiceRecording();
    }, 1000);

    // ganti tombol rekam jadi tombol stop
    vnRecordBtn.textContent = '■';
    vnRecordBtn.onclick = stopVoiceRecording;
  } catch (err) {
    showToast('Tidak bisa mengakses mikrofon. Periksa izin mikrofon di browser kamu.', 'error');
  }
}

function stopVoiceRecording() {
  if (vnRecorder && vnRecorder.state === 'recording') vnRecorder.stop();
  clearInterval(vnTimer);
}

function updateVnTimer() {
  document.getElementById('vnTimer').textContent = formatSeconds(vnSeconds);
}

function resetVoice() {
  capturedBlob = null;
  vnPlayer.style.display = 'none';
  vnPlayer.src = '';
  document.getElementById('vnControlsReview').style.display = 'none';
  document.getElementById('vnControlsIdle').style.display = 'flex';
  document.getElementById('vnHint').textContent = 'Tekan tombol merah untuk mulai merekam ucapanmu';
  vnRecordBtn.textContent = '●';
  vnRecordBtn.onclick = startVoiceRecording;
  vnSeconds = 0;
  updateVnTimer();
}

// ============================================
// KIRIM KE SERVER
// ============================================
async function sendMedia(type) {
  const guestName = document.getElementById('guestName').value.trim();
  if (!guestName) { showToast('Isi nama kamu dulu ya', 'error'); return; }
  if (!capturedBlob) { showToast('Ambil foto/video/suara dulu', 'error'); return; }

  const sendBtn = type === 'voice' ? vnSendBtn : document.getElementById('sendMediaBtn');
  sendBtn.disabled = true;
  const originalText = sendBtn.textContent;
  sendBtn.textContent = 'Mengirim...';

  try {
    const base64 = await blobToBase64(capturedBlob);
    const payload = {
      action: 'uploadMedia',
      wedding_id: weddingId,
      guest_name: guestName,
      media_type: type,
      filename: `capture.${capturedExt}`,
      mime_type: capturedMime,
      data: base64
    };
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.success) {
      showToast(result.message || 'Berhasil dikirim! 🎉', 'success');
      if (result.warning) {
        // Peringatan non-fatal dari server (mis. sharing Drive dibatasi
        // kebijakan domain) — upload tetap berhasil, cuma info tambahan.
        console.warn('Server warning:', result.warning);
      }
      if (type === 'voice') { resetVoice(); }
      else {
        resetCapture();
        document.getElementById('captureRow').style.display = 'flex';
        document.getElementById('reviewRow').style.display = 'none';
        liveVideo.style.display = 'block';
        photoCanvas.style.display = 'none';
        recordedVideo.style.display = 'none';
        if (!liveStream) startCamera();
      }
    } else {
      showToast(result.message || 'Gagal mengirim', 'error');
    }
  } catch (err) {
    showToast('Gagal terhubung ke server: ' + err.message, 'error');
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = originalText;
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ============================================
// UI HELPERS
// ============================================
function showStatus(title, text, showRetry) {
  document.getElementById('statusScreen').style.display = 'flex';
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusBtn').style.display = showRetry ? 'inline-block' : 'none';
}
function hideStatus() { document.getElementById('statusScreen').style.display = 'none'; }

function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast ' + type;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function formatSeconds(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}

function formatDate(d) {
  try {
    const date = new Date(d);
    return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) { return d; }
}
</script>
</body>
</html>
