<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Wedding Album</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  body { font-family:'Segoe UI', sans-serif; background:#faf6f2; color:#3a2e28; touch-action:pan-y; overscroll-behavior:none; }
  .hero { text-align:center; padding:44px 20px 24px; }
  .hero h1 { font-size:24px; margin-bottom:6px; }
  .hero p { color:#8a7b6e; font-size:13px; }
  .topnav { display:flex; justify-content:center; gap:10px; padding:0 20px 8px; }
  .topnav a { text-decoration:none; font-size:12px; color:#a97c4f; background:#fff; border:1px solid #e6dcd2; padding:8px 16px; border-radius:20px; }

  .container { max-width:1000px; margin:0 auto; padding:0 20px 60px; }
  .filters { display:flex; gap:8px; justify-content:center; margin-bottom:22px; flex-wrap:wrap; }
  .filters button { padding:8px 16px; border-radius:20px; border:1.5px solid #e6dcd2; background:#fff; cursor:pointer; font-size:13px; color:#8a7b6e; }
  .filters button.active { background:#c99b6a; color:#fff; border-color:#c99b6a; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; align-items:start; }
  .item { margin:0; border-radius:14px; overflow:hidden; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.05); position:relative; }
  .item .media-box { position:relative; background:#eee; min-height:120px; display:flex; align-items:center; justify-content:center; }
  .item img { width:100%; display:block; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .item video { width:100%; display:block; }
  .item .audio-box { padding:26px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; background:linear-gradient(135deg,#efe2d3,#f8f1e8); }
  .audio-box .wave { font-size:30px; }
  .play-toggle {
    width:44px; height:44px; border-radius:50%; border:none; background:#c99b6a; color:#fff; font-size:16px; cursor:pointer;
  }
  .video-poster-btn {
    position:absolute; inset:0; margin:auto; width:52px; height:52px; border-radius:50%;
    background:rgba(0,0,0,.5); color:#fff; border:none; font-size:20px; cursor:pointer;
  }
  .spinner { font-size:12px; color:#a08d7d; padding:20px; text-align:center; }

  .cap { padding:10px 12px; font-size:12px; color:#8a7b6e; }
  .cap .who { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .cap b { color:#3a2e28; }
  .dl-row { display:flex; gap:6px; }
  .dl-btn { flex:1; border:none; background:#f1e6d8; color:#8a6a45; padding:7px 8px; border-radius:8px; font-size:11px; cursor:pointer; white-space:nowrap; }
  .dl-btn.primary { background:#c99b6a; color:#fff; }
  .dl-btn:disabled { opacity:.5; }

  #photoViewer { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
  #photoViewer img { max-width:96vw; max-height:84vh; object-fit:contain; border-radius:8px; }
  #photoViewerCap { color:#eee; font-size:13px; }
  .pv-close { position:absolute; top:14px; right:16px; background:rgba(255,255,255,.15); color:#fff; border:none; width:38px; height:38px; border-radius:50%; font-size:16px; }
  .retry-btn { margin-top:12px; padding:10px 22px; border:none; border-radius:22px; background:#c99b6a; color:#fff; font-weight:700; }
  .item { content-visibility:auto; contain-intrinsic-size:auto 260px; }
  .empty { text-align:center; color:#a08d7d; padding:60px 0; }
  .loader { text-align:center; padding:60px 0; color:#a08d7d; }
  @media (max-width:640px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } .cap .who { flex-direction:column; align-items:flex-start; gap:2px; } .dl-row { flex-direction:column; } }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:99;
    background:#222; color:#fff; padding:12px 22px; border-radius:10px; font-size:13px; display:none; max-width:88%; text-align:center;
  }
  .toast.success { background:#2e7d32; }
  .toast.error { background:#c62828; }

  #hiddenCanvas { display:none; }
</style>
</head>
<body>

<div class="hero">
  <h1 id="titleText">💍 Wedding Album</h1>
  <p id="subtitleText">Momen indah dari orang-orang terkasih</p>
</div>

<div class="topnav">
  <a id="backToIndex" href="#">📷 Kirim Momen</a>
</div>

<div class="container">
  <div class="filters" id="filters" style="display:none;"></div>

  <div id="grid" class="grid"></div>
  <div id="loader" class="loader">Sedang menyiapkan album…</div>
  <div id="sentinel" style="height:1px;"></div>
  <div id="empty" class="empty" style="display:none;">Belum ada momen di sini.<br>Yuk, jadi yang pertama berbagi! 💌</div>
</div>

<div class="toast" id="toast"></div>
<div id="photoViewer" onclick="closePhoto()">
  <img id="photoViewerImg" alt="">
  <div id="photoViewerCap"></div>
  <button class="pv-close" aria-label="Tutup">✕</button>
</div>
<canvas id="hiddenCanvas"></canvas>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5oH41qOF8tlHPVGVm5T_iT5KD-CfblVL6Yu9oGKp9t7eP6ewOGvh4KnmG1qfKv3F_/exec';

// ---- Cegah zoom tidak sengaja ----
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

const urlParams = new URLSearchParams(window.location.search);
let weddingId = urlParams.get('w');
if (weddingId) localStorage.setItem('active_wedding_id', weddingId);
else weddingId = localStorage.getItem('active_wedding_id');

document.getElementById('backToIndex').href = weddingId ? `index.html?w=${encodeURIComponent(weddingId)}` : 'index.html';

let items = [];            // semua momen yang sudah dimuat (halaman demi halaman)
let currentFilter = 'all';
let currentPage = 0, hasMore = false, isLoading = false, loadToken = 0;
let weddingSettings = null;
let enabledTypes = ['photo', 'video', 'voice'];
let currentlyPlayingEl = null;
const fullFileCache = new Map(); // file_id -> { blob, url, mimeType }  (dibatasi supaya HP RAM kecil tidak berat)
const CACHE_LIMIT = 4;
const TYPE_LABEL = { photo: 'Foto', video: 'Video', voice: 'Suara' };
const TYPE_ICON = { photo: '📷', video: '🎥', voice: '🎤' };

if (!weddingId) {
  document.getElementById('loader').textContent = 'Link album belum lengkap. Buka lewat link yang dibagikan mempelai ya.';
} else {
  init();
}

// Permintaan ke server dengan batas waktu & coba ulang otomatis (jaringan seluler sering putus-putus)
async function apiGet(params, tries = 3) {
  const qs = new URLSearchParams(params).toString();
  let lastErr;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`, { signal: ctrl.signal });
      const data = await res.json();
      clearTimeout(to);
      if (data && data.busy && i < tries - 1) { await sleep(800 * (i + 1)); continue; }
      return data;
    } catch (e) { clearTimeout(to); lastErr = e; await sleep(600 * (i + 1)); }
  }
  throw lastErr || new Error('Koneksi bermasalah');
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function init() {
  try {
    const s = await apiGet({ action: 'getSettings', wedding_id: weddingId });
    if (!s.success) {
      document.getElementById('loader').textContent = s.message || 'Album tidak ditemukan.';
      return;
    }
    weddingSettings = s;
    enabledTypes = s.types || ['photo'];
    document.getElementById('titleText').textContent = (s.ui_config && s.ui_config.album_headline) || `💍 ${s.groom_name} & ${s.bride_name}`;
    if (s.date) document.getElementById('subtitleText').textContent = formatDate(s.date);
    buildFilters();
  } catch (e) {
    showLoadError();
    return;
  }
  loadPage(true);
}

// Tab filter hanya menampilkan kategori yang sedang ON. Kalau cuma satu kategori ON, tab disembunyikan.
function buildFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  if (enabledTypes.length <= 1) { box.style.display = 'none'; currentFilter = 'all'; return; }
  box.style.display = 'flex';
  [['all', 'Semua']].concat(enabledTypes.map(t => [t, TYPE_LABEL[t]])).forEach(([val, label]) => {
    const b = document.createElement('button');
    b.dataset.filter = val; b.textContent = label;
    if (val === currentFilter) b.classList.add('active');
    b.addEventListener('click', () => {
      if (currentFilter === val) return;
      currentFilter = val;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      loadPage(true);
    });
    box.appendChild(b);
  });
}

function showLoadError() {
  const l = document.getElementById('loader');
  l.style.display = 'block';
  l.innerHTML = 'Koneksi sedang kurang stabil 😕<br><button class="retry-btn" onclick="location.reload()">Coba Lagi</button>';
}

// Muat halaman album. reset=true -> mulai dari awal (ganti filter / pertama kali).
async function loadPage(reset) {
  if (isLoading && !reset) return;
  const myToken = ++loadToken;
  isLoading = true;
  const grid = document.getElementById('grid');
  const loader = document.getElementById('loader');
  const cacheKey = `alb_${weddingId}_${currentFilter}`;

  if (reset) {
    items = []; currentPage = 0; hasMore = false;
    grid.innerHTML = ''; document.getElementById('empty').style.display = 'none';
    // Tampilkan hasil tersimpan dulu supaya album terasa instan, lalu perbarui dari server
    try {
      const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
      if (cached && cached.media && cached.media.length) { items = cached.media.slice(); renderItems(items, false); }
      else loader.style.display = 'block';
    } catch (e) { loader.style.display = 'block'; }
  } else {
    loader.style.display = 'block';
  }

  try {
    const next = reset ? 1 : currentPage + 1;
    const data = await apiGet({ action: 'getAlbum', wedding_id: weddingId, page: next, type: currentFilter });
    if (myToken !== loadToken) return; // pengguna sudah ganti filter
    loader.style.display = 'none';
    if (!data.success) { showToast(data.message || 'Album belum bisa dimuat', 'error'); return; }
    if (JSON.stringify(data.types) !== JSON.stringify(enabledTypes)) { // mempelai baru mengubah kategori aktif
      enabledTypes = data.types; buildFilters();
    }
    currentPage = data.page; hasMore = data.has_more;
    if (reset) {
      items = data.media.slice();
      grid.innerHTML = '';
      renderItems(items, false);
      try { sessionStorage.setItem(cacheKey, JSON.stringify({ media: data.media })); } catch (e) {}
    } else {
      const start = items.length;
      items = items.concat(data.media);
      renderItems(data.media, true, start);
    }
    document.getElementById('empty').style.display = items.length === 0 ? 'block' : 'none';
    watchSentinel();
  } catch (e) {
    if (myToken === loadToken) { loader.style.display = 'none'; if (items.length === 0) showLoadError(); else showToast('Koneksi terputus. Gulir lagi untuk mencoba memuat.', 'error'); }
  } finally {
    if (myToken === loadToken) isLoading = false;
  }
}

// Gulir tak terbatas dengan IntersectionObserver (lebih ringan daripada event scroll)
let sentinelObserver = null;
function watchSentinel() {
  const s = document.getElementById('sentinel');
  if (!('IntersectionObserver' in window)) return;
  if (!sentinelObserver) {
    sentinelObserver = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && hasMore && !isLoading) loadPage(false);
    }, { rootMargin: '600px' });
    sentinelObserver.observe(s);
  } else { sentinelObserver.unobserve(s); sentinelObserver.observe(s); }
}

function renderItems(list, append, startIndex) {
  const grid = document.getElementById('grid');
  const ui = (weddingSettings && weddingSettings.ui_config) || {};
  const previewOn = ui.allow_preview !== false;
  const originalOn = ui.allow_download_original !== false;
  const framedOn = ui.allow_download_framed !== false;
  const frag = document.createDocumentFragment();
  const base = append ? startIndex : 0;

  list.forEach((item, k) => {
    const idx = base + k;
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.idx = idx;
    const uid = 'm_' + item.media_id;
    const thumb = item.thumbnail_url || '';
    let mediaHtml = '';

    if (!previewOn) {
      mediaHtml = `<div class="media-box" style="min-height:100px;flex-direction:column;gap:6px;color:#a08d7d;">
        <span style="font-size:26px;">${TYPE_ICON[item.media_type]}</span>
        <span style="font-size:11px;">${TYPE_LABEL[item.media_type]} — unduh untuk melihat</span></div>`;
    } else if (item.media_type === 'photo') {
      mediaHtml = thumb
        ? `<div class="media-box" data-act="view" style="cursor:zoom-in"><img src="${thumb}" decoding="async" alt="Foto dari ${escapeAttr(item.guest_name)}"></div>`
        : `<div class="media-box" data-act="view" style="min-height:140px;cursor:zoom-in"><span class="spinner">📷 Ketuk untuk melihat foto</span></div>`;
    } else if (item.media_type === 'video') {
      mediaHtml = `<div class="media-box" id="${uid}_box" style="${thumb ? '' : 'min-height:160px;background:#2a2320;'}">
          ${thumb ? `<img src="${thumb}" decoding="async" alt="">` : ''}
          <button class="video-poster-btn" data-act="playvideo" aria-label="Putar video">▶</button></div>`;
    } else {
      mediaHtml = `<div class="audio-box" id="${uid}_box"><div class="wave">🎵</div>
          <button class="play-toggle" data-act="playaudio" id="${uid}_btn" aria-label="Putar suara">▶</button></div>`;
    }

    const dl = [];
    if (originalOn) dl.push(`<button class="dl-btn" data-act="dlorig">Unduh Asli</button>`);
    if (framedOn) dl.push(`<button class="dl-btn primary" data-act="dlframe">Unduh Berbingkai ✨</button>`);
    if (!dl.length) dl.push(`<span style="font-size:11px;color:#bbb;">Unduhan sedang dinonaktifkan mempelai</span>`);

    div.innerHTML = `${mediaHtml}
      <div class="cap">
        <div class="who"><b>${escapeHtml(item.guest_name)}</b><span>${escapeHtml(item.date || '')}</span></div>
        ${item.caption ? `<div style="margin-bottom:8px;font-style:italic;">${escapeHtml(item.caption)}</div>` : ''}
        <div class="dl-row">${dl.join('')}</div>
      </div>`;
    frag.appendChild(div);
  });
  grid.appendChild(frag);
}

// Satu pendengar klik untuk semua kartu (hemat memori, dan aman untuk nama tamu yang berisi tanda kutip)
document.getElementById('grid').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const card = el.closest('.item');
  const item = items[Number(card.dataset.idx)];
  if (!item) return;
  const uid = 'm_' + item.media_id;
  const act = el.dataset.act;
  if (act === 'playvideo') playFullVideo(item.file_id, uid, el);
  else if (act === 'playaudio') playAudio(item.file_id, uid, el);
  else if (act === 'dlorig') downloadOriginal(item.file_id, item.media_type, item.guest_name, el);
  else if (act === 'dlframe') downloadWithFrame(item.media_id, item.file_id, item.media_type, item.guest_name, el);
  else if (act === 'view') openPhoto(item, card);
});

// Lihat foto ukuran penuh (diambil hanya saat diketuk)
async function openPhoto(item, card) {
  const ov = document.getElementById('photoViewer');
  const img = document.getElementById('photoViewerImg');
  document.getElementById('photoViewerCap').textContent = item.guest_name;
  img.src = item.thumbnail_url || '';
  ov.style.display = 'flex';
  try {
    const { url } = await fetchFileChunked(item.file_id);
    if (ov.style.display === 'flex') img.src = url;
  } catch (e) { showToast('Foto ukuran penuh belum bisa dimuat. Coba lagi ya.', 'error'); }
}
function closePhoto() { document.getElementById('photoViewer').style.display = 'none'; document.getElementById('photoViewerImg').src = ''; }

// ============================================
// AMBIL FILE UTUH PER POTONGAN (paralel 3 potongan sekaligus -> lebih cepat)
// ============================================
function base64ToUint8(base64) {
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function rememberFile(fileId, entry) {
  fullFileCache.set(fileId, entry);
  while (fullFileCache.size > CACHE_LIMIT) {
    const oldest = fullFileCache.keys().next().value;
    const old = fullFileCache.get(oldest);
    fullFileCache.delete(oldest);
    try { URL.revokeObjectURL(old.url); } catch (e) {}
  }
}

const inflight = new Map();
function fetchFileChunked(fileId, onProgress) {
  if (fullFileCache.has(fileId)) return Promise.resolve(fullFileCache.get(fileId));
  if (inflight.has(fileId)) return inflight.get(fileId);
  const p = (async () => {
    const meta = await apiGet({ action: 'getMediaMeta', file_id: fileId });
    if (!meta.success) throw new Error(meta.message || 'File tidak ditemukan');
    const size = meta.size || 0, chunk = meta.chunkSize || 3145728;
    const count = Math.max(1, Math.ceil(size / chunk));
    const parts = new Array(count);
    let done = 0, next = 0;
    async function worker() {
      while (next < count) {
        const i = next++;
        const d = await apiGet({ action: 'getMediaChunk', file_id: fileId, offset: i * chunk });
        if (!d.success) throw new Error(d.message || 'Gagal mengambil bagian file');
        parts[i] = base64ToUint8(d.base64);
        done++;
        if (onProgress) onProgress(Math.min(99, Math.round(done / count * 100)));
      }
    }
    await Promise.all([worker(), worker(), worker()].slice(0, Math.min(3, count)));
    if (onProgress) onProgress(100);
    const blob = new Blob(parts, { type: meta.mimeType });
    const entry = { blob, url: URL.createObjectURL(blob), mimeType: meta.mimeType, filename: meta.filename };
    rememberFile(fileId, entry);
    return entry;
  })();
  inflight.set(fileId, p);
  p.finally(() => inflight.delete(fileId)).catch(() => {});
  return p;
}

async function playFullVideo(fileId, uid, btn) {
  const box = document.getElementById(uid + '_box');
  btn.disabled = true; btn.textContent = '…';
  try {
    const { url } = await fetchFileChunked(fileId);
    box.innerHTML = `<video id="${uid}" src="${url}" controls playsinline autoplay style="width:100%;display:block;"></video>`;
    document.getElementById(uid).play();
  } catch (err) {
    showToast('Video belum bisa diputar. Coba lagi ya.', 'error');
    btn.disabled = false; btn.textContent = '▶';
  }
}

async function playAudio(fileId, uid, btn) {
  let mediaEl = document.getElementById(uid);
  if (!mediaEl) {
    btn.disabled = true; btn.textContent = '…';
    try {
      const { url, mimeType } = await fetchFileChunked(fileId);
      // VN dengan "frame otomatis include" tersimpan sebagai file video
      // (berisi animasi audiogram+bingkai), walau tetap berjenis 'voice' di
      // sheet — deteksi dari mimeType asli filenya, bukan dari media_type.
      const isVideoContainer = mimeType && mimeType.startsWith('video/');
      mediaEl = document.createElement(isVideoContainer ? 'video' : 'audio');
      mediaEl.id = uid; mediaEl.src = url;
      if (isVideoContainer) {
        mediaEl.playsInline = true;
        mediaEl.style.cssText = 'width:100%;border-radius:10px;display:block;margin-top:10px;';
        btn.insertAdjacentElement('afterend', mediaEl);
      } else {
        mediaEl.style.display = 'none';
        document.body.appendChild(mediaEl);
      }
      mediaEl.onended = () => { btn.textContent = '▶'; };
    } catch (err) {
      showToast('Suara belum bisa diputar. Coba lagi ya.', 'error');
      btn.disabled = false; btn.textContent = '▶';
      return;
    }
    btn.disabled = false;
  }
  if (currentlyPlayingEl && currentlyPlayingEl !== mediaEl) {
    currentlyPlayingEl.pause();
    const otherBtn = document.getElementById(currentlyPlayingEl.id + '_btn');
    if (otherBtn) otherBtn.textContent = '▶';
  }
  if (mediaEl.paused) { mediaEl.play(); btn.textContent = '⏸'; currentlyPlayingEl = mediaEl; }
  else { mediaEl.pause(); btn.textContent = '▶'; }
}

// ============================================
// UNDUH ASLI (langsung, file utuh apa adanya)
// ============================================
async function downloadOriginal(fileId, type, guestName, btnEl) {
  const originalText = btnEl.textContent;
  btnEl.disabled = true; btnEl.textContent = '0%';
  try {
    const { blob, mimeType } = await fetchFileChunked(fileId, pct => { btnEl.textContent = pct + '%'; });
    const ext = mimeType.startsWith('audio/mp4') ? 'm4a' : mimeType.includes('mp4') ? 'mp4' : mimeType.includes('webm') ? 'webm' : mimeType.includes('jpeg') ? 'jpg' : 'bin';
    triggerDownload(blob, `wedding-${guestName}-${Date.now()}.${ext}`);
    showToast('Unduhan siap! 🎉', 'success');
  } catch (err) {
    showToast('Unduhan belum berhasil. Periksa koneksi lalu coba lagi.', 'error');
  } finally {
    btnEl.disabled = false; btnEl.textContent = originalText;
  }
}

// ============================================
// UNDUH DENGAN BINGKAI AESTHETIC (perlu proses render ulang, ada progres)
// ============================================
function pickSupportedMime(candidates) {
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c.mime)) return c;
  }
  return candidates[candidates.length - 1];
}
const OUT_VIDEO_MIME = pickSupportedMime([
  { mime: 'video/mp4;codecs=h264,aac', ext: 'mp4' },
  { mime: 'video/mp4', ext: 'mp4' },
  { mime: 'video/webm;codecs=vp9,opus', ext: 'webm' },
  { mime: 'video/webm;codecs=vp8,opus', ext: 'webm' },
  { mime: 'video/webm', ext: 'webm' }
]);

function getFrameConfig(type) {
  const w = weddingSettings || {};
  const uiConfig = w.ui_config || {};
  const frames = uiConfig.frames || {};
  const customFrame = type ? frames[type] : null;
  const voiceCfg = frames.voice || {};
  return {
    style: w.frame_style || 'elegant', primary: w.primary_color || '#8B7355', secondary: w.secondary_color || '#D4C4A8',
    groom: w.groom_name || '', bride: w.bride_name || '', date: w.date ? formatDate(w.date) : '',
    customFrame: (customFrame && customFrame.type === 'custom' && customFrame.file_id) ? customFrame : null,
    voiceLabel: voiceCfg.label || '🎤 Voice Note',
    voiceCenterColor: voiceCfg.centerColor || '#ffffff',
    voiceBarColor: voiceCfg.barColor || w.primary_color || '#8B7355',
    voiceShape: voiceCfg.shape || 'radial',
    voiceCenterShape: voiceCfg.centerShape || 'circle',
    voiceCenterRound: voiceCfg.centerRound != null ? voiceCfg.centerRound : 20,
    voiceFont: voiceCfg.font || 'Segoe UI'
  };
}

function getVnResolution() {
  const w = weddingSettings || {};
  const vnRes = (w.ui_config && w.ui_config.vn_resolution) || { preset: 'hd' };
  if (vnRes.preset === 'custom') return { width: vnRes.width || 720, height: vnRes.height || 720 };
  if (vnRes.preset === 'sd') return { width: 480, height: 480 };
  if (vnRes.preset === 'fhd') return { width: 1080, height: 1080 };
  return { width: 720, height: 720 }; // hd (default)
}

const customFrameImageCache = new Map();
function loadCustomFrameImage(fileId) {
  if (customFrameImageCache.has(fileId)) return customFrameImageCache.get(fileId);
  const p = (async () => {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getMediaFile&file_id=${encodeURIComponent(fileId)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Gagal memuat template bingkai');
    const bytes = base64ToUint8(data.base64);
    const blob = new Blob([bytes], { type: data.mimeType || 'image/png' });
    const blobUrl = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = blobUrl;
    });
  })();
  customFrameImageCache.set(fileId, p);
  return p;
}

function drawFrame(ctx, w, h, cfg, customImg) {
  // Kalau admin sudah pasang template PNG custom, timpakan itu saja
  // (sudah otomatis disesuaikan ke ukuran w x h media tamu) — tidak perlu
  // gambar bar/teks bawaan lagi.
  if (customImg) {
    ctx.drawImage(customImg, 0, 0, w, h);
    return;
  }

  const barH = Math.round(h * 0.12);
  ctx.fillStyle = cfg.primary;
  if (cfg.style === 'minimalist') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, h - barH, w, barH);
  } else if (cfg.style === 'modern') {
    ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.lineWidth = Math.max(4, w * 0.006);
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
  } else if (cfg.style === 'floral-simple') {
    ctx.fillRect(0, h - barH, w, barH);
    ctx.fillStyle = cfg.secondary;
    const r = Math.max(4, w*0.006);
    [[16,16],[w-16,16],[16,h-barH-16],[w-16,h-barH-16]].forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); });
  } else {
    ctx.fillRect(0, h - barH, w, barH);
    ctx.strokeStyle = cfg.secondary; ctx.lineWidth = Math.max(2, w*0.003);
    const pad = w*0.015;
    ctx.strokeRect(pad, pad, w-pad*2, h-pad*2-barH*0.15);
  }
  const centerY = h - barH/2;
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = `700 ${Math.round(barH*0.3)}px Georgia, serif`;
  ctx.fillText(`${cfg.groom} & ${cfg.bride}`, w/2, centerY - barH*0.08);
  ctx.font = `400 ${Math.round(barH*0.2)}px Segoe UI, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(cfg.date, w/2, centerY + barH*0.28);
}

async function downloadWithFrame(mediaId, fileId, type, guestName, btnEl) {
  const originalText = btnEl.textContent;
  btnEl.disabled = true; btnEl.textContent = '0%';

  // Kalau admin mengaktifkan "frame otomatis include" untuk jenis media ini,
  // bingkai sudah dibakar sejak proses rekam di HP tamu — jadi tinggal
  // serve file aslinya langsung (instan), tidak perlu diproses ulang lagi.
  const autoInclude = (weddingSettings && weddingSettings.ui_config && weddingSettings.ui_config.frame_auto_include) || {};
  if (autoInclude[type]) {
    try {
      const { blob, mimeType } = await fetchFileChunked(fileId, pct => { btnEl.textContent = pct + '%'; });
      const ext = mimeType.startsWith('audio/mp4') ? 'm4a' : mimeType.includes('mp4') ? 'mp4' : mimeType.includes('webm') ? 'webm' : mimeType.includes('jpeg') ? 'jpg' : 'bin';
      triggerDownload(blob, `wedding-${guestName}-${Date.now()}.${ext}`);
      showToast('Unduhan siap! 🎉 (bingkai sudah include sejak rekam)', 'success');
    } catch (err) {
      showToast('Unduhan belum berhasil. Periksa koneksi lalu coba lagi.', 'error');
    } finally {
      btnEl.disabled = false; btnEl.textContent = originalText;
    }
    return;
  }

  try {
    const { url } = await fetchFileChunked(fileId, pct => { btnEl.textContent = pct + '%'; });
    const cfg = getFrameConfig(type);
    const customImg = cfg.customFrame ? await loadCustomFrameImage(cfg.customFrame.file_id) : null;

    if (type === 'photo') {
      btnEl.textContent = 'Membingkai...';
      await downloadPhotoWithFrame(url, cfg, guestName, customImg);
    } else if (type === 'video') {
      btnEl.textContent = '0%';
      await downloadVideoWithFrame(url, cfg, guestName, pct => { btnEl.textContent = pct + '%'; }, customImg);
    } else {
      btnEl.textContent = '0%';
      await downloadAudioAsVideo(url, cfg, guestName, pct => { btnEl.textContent = pct + '%'; }, customImg);
    }
    showToast('Selesai! Berkasnya sudah tersimpan 🎉', 'success');
  } catch (err) {
    showToast('Unduhan belum berhasil. Coba lagi sebentar lagi ya.', 'error');
  } finally {
    btnEl.disabled = false; btnEl.textContent = originalText;
  }
}

function downloadPhotoWithFrame(blobUrl, cfg, guestName, customImg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.getElementById('hiddenCanvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      drawFrame(ctx, canvas.width, canvas.height, cfg, customImg);
      canvas.toBlob(blob => { triggerDownload(blob, `wedding-${guestName}-${Date.now()}.jpg`); resolve(); }, 'image/jpeg', 0.96);
    };
    img.onerror = reject;
    img.src = blobUrl;
  });
}

function downloadVideoWithFrame(blobUrl, cfg, guestName, onProgress, customImg) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.src = blobUrl; video.muted = false; video.playsInline = true;

    video.onloadedmetadata = () => {
      const canvas = document.getElementById('hiddenCanvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      const duration = video.duration || 1;

      const canvasStream = canvas.captureStream(30);
      let audioTrack = [];
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaElementSource(video);
        const dest = audioCtx.createMediaStreamDestination();
        src.connect(dest); src.connect(audioCtx.destination);
        audioTrack = dest.stream.getAudioTracks();
      } catch (e) { /* lanjut tanpa audio jika gagal */ }

      const combined = new MediaStream([...canvasStream.getVideoTracks(), ...audioTrack]);
      const recorder = new MediaRecorder(combined, { mimeType: OUT_VIDEO_MIME.mime, videoBitsPerSecond: 6000000, audioBitsPerSecond: 128000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: OUT_VIDEO_MIME.mime });
        triggerDownload(blob, `wedding-${guestName}-${Date.now()}.${OUT_VIDEO_MIME.ext}`);
        resolve();
      };

      let drawing = true;
      function drawLoop() {
        if (!drawing) return;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        drawFrame(ctx, canvas.width, canvas.height, cfg, customImg);
        onProgress(Math.min(99, Math.round((video.currentTime / duration) * 100)));
        requestAnimationFrame(drawLoop);
      }

      video.onended = () => { drawing = false; onProgress(100); recorder.stop(); };
      video.currentTime = 0;
      recorder.start();
      video.play().then(drawLoop);
    };
    video.onerror = reject;
  });
}

// Menggambar audiogram — dipanggil baik saat proses render video sungguhan
// (dataArray dari analyser real-time) maupun saat pratinjau statis di admin
// dashboard (dataArray simulasi). Bentuk: 'radial' (lingkaran spike),
// 'bars' (equalizer horizontal), atau 'pulse' (lingkaran polos berdenyut).
function fillCenterShape(ctx, cx, cy, radius, cfg) {
  const shape = cfg.voiceCenterShape || 'circle';
  ctx.fillStyle = cfg.voiceCenterColor;
  if (shape === 'square') {
    const size = radius * 1.7;
    const round = Math.min(size / 2, ((cfg.voiceCenterRound != null ? cfg.voiceCenterRound : 20) / 100) * (size / 2));
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(cx - size/2, cy - size/2, size, size, round); }
    else { ctx.rect(cx - size/2, cy - size/2, size, size); }
    ctx.fill();
  } else if (shape === 'heart') {
    const s = radius / 60;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 35*s);
    ctx.bezierCurveTo(cx - 70*s, cy - 30*s, cx - 25*s, cy - 70*s, cx, cy - 30*s);
    ctx.bezierCurveTo(cx + 25*s, cy - 70*s, cx + 70*s, cy - 30*s, cx, cy + 35*s);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
  }
}

function drawAudiogram(ctx, w, h, dataArray, cfg, guestName) {
  const cx = w / 2, cy = h / 2;
  const shape = cfg.voiceShape || 'radial';
  const font = cfg.voiceFont || 'Segoe UI';
  const scale = Math.min(w, h) / 720; // skala relatif terhadap ukuran acuan 720px, supaya proporsional di semua pilihan resolusi

  if (shape === 'bars') {
    const barCount = 32;
    const barW = (w * 0.7) / barCount;
    const startX = w * 0.15;
    const baseY = cy + 130 * scale;
    ctx.fillStyle = cfg.voiceBarColor;
    for (let i = 0; i < barCount; i++) {
      const value = dataArray[i % dataArray.length] / 255;
      const barH = (10 + value * (h * 0.2 / scale)) * scale;
      ctx.fillRect(startX + i * barW, baseY - barH, barW * 0.7, barH);
    }
    fillCenterShape(ctx, cx, cy, 90 * scale, cfg);
  } else if (shape === 'pulse') {
    let avg = 0;
    for (let i = 0; i < dataArray.length; i++) avg += dataArray[i];
    avg = avg / dataArray.length / 255;
    const radius = (100 + avg * 40) * scale;
    ctx.fillStyle = cfg.voiceBarColor; ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(cx, cy, radius + 20 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    fillCenterShape(ctx, cx, cy, radius, cfg);
  } else { // radial (default)
    const radius = 140 * scale, bars = 48;
    ctx.strokeStyle = cfg.voiceBarColor; ctx.lineWidth = 5 * scale;
    for (let i = 0; i < bars; i++) {
      const value = dataArray[i % dataArray.length] / 255;
      const angle = (i / bars) * Math.PI * 2;
      const barLen = (20 + value * 90) * scale;
      const x1 = cx + Math.cos(angle)*radius, y1 = cy + Math.sin(angle)*radius;
      const x2 = cx + Math.cos(angle)*(radius+barLen), y2 = cy + Math.sin(angle)*(radius+barLen);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    fillCenterShape(ctx, cx, cy, radius - 10 * scale, cfg);
  }

  ctx.fillStyle = cfg.voiceBarColor; ctx.font = `600 ${Math.round(26*scale)}px ${font}, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(cfg.voiceLabel, cx, cy - 6 * scale);
  ctx.font = `400 ${Math.round(15*scale)}px ${font}, sans-serif`; ctx.fillText(guestName, cx, cy + 20 * scale);
}

function downloadAudioAsVideo(blobUrl, cfg, guestName, onProgress, customImg) {
  return new Promise((resolve, reject) => {
    const audio = document.createElement('audio');
    audio.src = blobUrl;

    audio.onloadedmetadata = () => {
      const canvas = document.getElementById('hiddenCanvas');
      const vnRes = getVnResolution();
      canvas.width = vnRes.width; canvas.height = vnRes.height;
      const ctx = canvas.getContext('2d');
      const duration = audio.duration || 1;

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(audio);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      const dest = audioCtx.createMediaStreamDestination();
      src.connect(analyser); analyser.connect(dest); src.connect(audioCtx.destination);

      const canvasStream = canvas.captureStream(30);
      const combined = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
      const recorder = new MediaRecorder(combined, { mimeType: OUT_VIDEO_MIME.mime, videoBitsPerSecond: 4000000, audioBitsPerSecond: 128000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: OUT_VIDEO_MIME.mime });
        triggerDownload(blob, `wedding-vn-${guestName}-${Date.now()}.${OUT_VIDEO_MIME.ext}`);
        resolve();
      };

      let drawing = true;
      function drawLoop() {
        if (!drawing) return;
        analyser.getByteFrequencyData(dataArray);

        // LAPIS 1 (paling bawah): background — kalau admin pasang template
        // custom (PNG) untuk voice note, itu jadi backdrop di sini dulu,
        // BUKAN ditimpakan belakangan, supaya audiogram di atasnya tetap
        // kelihatan dan tidak ketutupan.
        if (customImg) {
          ctx.drawImage(customImg, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = cfg.secondary; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = cfg.primary; ctx.globalAlpha = 0.15; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1;
        }

        // LAPIS 2 (di atas background): audiogram — bentuk, warna, dan
        // label semuanya bisa diatur admin dari dashboard
        drawAudiogram(ctx, canvas.width, canvas.height, dataArray, cfg, guestName);

        // LAPIS 3: bar nama mempelai + tanggal (gaya bawaan) — dilewati
        // kalau memang sudah pakai template custom, karena template custom
        // biasanya sudah punya elemen dekorasinya sendiri
        if (!customImg) {
          drawFrame(ctx, canvas.width, canvas.height, cfg, null);
        }

        onProgress(Math.min(99, Math.round((audio.currentTime / duration) * 100)));
        requestAnimationFrame(drawLoop);
      }

      audio.onended = () => { drawing = false; onProgress(100); recorder.stop(); };
      audio.currentTime = 0;
      recorder.start();
      audio.play().then(drawLoop);
    };
    audio.onerror = reject;
  });
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function escapeAttr(str) { return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeHtml(str) { return escapeAttr(str); }
function formatDate(d) { try { return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }); } catch (e) { return d; } }
function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4500);
}
</script>
